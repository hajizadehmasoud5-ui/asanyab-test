<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>دکترلینک | تست جامع بیمار v2.1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="drlinq-patient-flow-v2.html" title="دکترلینک"></iframe><script>(function(){var f=document.getElementById('app');var imgs={OPG:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Panoramicfilm.JPG?width=960',CBCT:'https://commons.wikimedia.org/wiki/Special:Redirect/file/CBCT_image_01.png?width=960'};f.onload=function(){var d=f.contentDocument;if(!d)return;var st=d.createElement('style');st.textContent='.doc{grid-template-columns:145px 1fr!important}.thumb{height:86px!important;background:#05080b!important}.thumb img.real-medical{width:100%;height:100%;object-fit:contain;display:block;background:#05080b}@media(max-width:520px){.doc{grid-template-columns:125px 1fr!important}.thumb{height:78px!important}}';d.head.appendChild(st);function patch(){var cards=d.querySelectorAll('.doc');for(var i=0;i<cards.length;i++){var b=cards[i].querySelector('b'),th=cards[i].querySelector('.thumb');if(!b||!th)continue;var n=b.textContent.trim();if(imgs[n]&&th.getAttribute('data-real')!=='1'){th.innerHTML='<img class="real-medical" src="'+imgs[n]+'" alt="نمونه واقعی '+n+'" referrerpolicy="no-referrer">';th.setAttribute('data-real','1')}}}new MutationObserver(patch).observe(d.body,{childList:true,subtree:true});patch()}})();</script></body></html>
