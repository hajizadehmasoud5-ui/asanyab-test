<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>دکتر لینک | ارجاع</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f6f8fb;color:#101828;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px;max-width:420px;margin:20px;text-align:center}.brand{font-size:24px;font-weight:900;margin-bottom:12px}.brand b{color:#1769e0}.muted{font-size:12px;color:#667085;line-height:1.9}</style>
</head>
<body><div class="box"><div class="brand">دکتر<b>لینک</b></div><div id="msg" class="muted">در حال باز کردن فرم ارجاع…</div></div>
<script>
(async()=>{const code=new URLSearchParams(location.search).get('c');if(!code){document.getElementById('msg').textContent='لینک ارجاع ناقص است.';return}try{const r=await fetch('https://python-0jatcc.cldv.dev/alanoffer/api/referral/short/'+encodeURIComponent(code));const j=await r.json();if(!r.ok||!j.slug)throw new Error();location.replace('referral.html?c='+encodeURIComponent(j.slug));}catch(e){document.getElementById('msg').textContent='این لینک ارجاع پیدا نشد.'}})();
</script></body></html>
