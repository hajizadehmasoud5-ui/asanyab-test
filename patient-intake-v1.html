opg:['OPG','عکس پانورامیک که تقریباً همه دندان‌ها و فک را یکجا نشان می‌دهد.','opg'],cbct:['CBCT','تصویر سه‌بعدی فک/دندان؛ معمولاً مجموعه‌ای از برش‌های تصویری یا فایل دیجیتال است.','cbct'],ceph:['لترال سفالومتری','عکس نیم‌رخ جمجمه که در ارتودنسی استفاده می‌شود.','ceph'],dental_photo:['عکس دندان/داخل دهان','عکس معمولی از دندان‌ها یا داخل دهان.','photo'],ecg:['نوار قلب ECG','برگه‌ای با خطوط موج‌دار ثبت فعالیت الکتریکی قلب.','ecg'],echo:['اکوکاردیوگرافی','گزارش یا تصاویر سونوگرافی قلب.','echo'],oct:['OCT چشم','تصویر لایه‌ای شبکیه/عصب چشم، معمولاً همراه نقشه‌های رنگی.','oct'],eye_rx:['نسخه/شماره چشم','نسخه عینک یا نتیجه اپتومتری قبلی.','report'],xray:['رادیوگرافی X-Ray','تصویر ساده رادیولوژی از استخوان یا ناحیه موردنظر.','xray'],mri:['MRI','تصاویر مقطعی ناحیه بدن، معمولاً به‌صورت فیلم، CD یا فایل دیجیتال.','mri'],ct:['CT Scan','تصاویر مقطعی سی‌تی‌اسکن و گزارش آن.','ct'],eeg:['نوار مغز EEG','گزارش ثبت امواج مغزی.','ecg'],ultrasound:['سونوگرافی','تصاویر و گزارش سونوگرافی.','echo'],hearing_test:['ادیوگرام/تست شنوایی','نمودار نتیجه شنوایی‌سنجی.','chart'],lab:['آزمایش خون/آزمایشگاه','برگه یا فایل نتیجه آزمایش.','lab'],prescription:['نسخه/درخواست پزشک','نسخه کاغذی یا تصویر درخواست خدمت.','report'],report:['گزارش یا پرونده قبلی','گزارش پزشک، پاتولوژی، ترخیص یا مدارک مرتبط.','report'],imaging:['تصویربرداری قبلی','هر نوع MRI، CT، X-Ray یا سونوگرافی مرتبط.','mri'],photo:['عکس ناحیه','عکس معمولی از ناحیه موردنظر برای نشان دادن وضعیت ظاهری.','photo']};
function svg(kind){const common='stroke="#dbe8f4" stroke-width="2" fill="none"';if(kind==='opg')return `<svg viewBox="0 0 100 60"><path ${common} d="M8 24 Q50 54 92 24"/><path ${common} d="M15 18 Q50 40 85 18"/><g ${common}>${[20,28,36,44,52,60,68,76].map(x=>`<rect x="${x}" y="19" width="5" height="18" rx="2"/>`).join('')}</g></svg>`;if(kind==='cbct'||kind==='mri'||kind==='ct')return `<svg viewBox="0 0 100 60"><circle ${common} cx="32" cy="30" r="20"/><circle ${common} cx="32" cy="30" r="10"/><rect ${common} x="58" y="9" width="30" height="18"/><rect ${common} x="58" y="33" width="30" height="18"/></svg>`;if(kind==='ceph')return `<svg viewBox="0 0 100 60"><circle ${common} cx="47" cy="25" r="18"/><path ${common} d="M53 41 Q70 42 73 32 L62 29 M37 40 L37 55"/><path ${common} d="M19 10 L82 49 M80 8 L20 50" opacity=".45"/></svg>`;if(kind==='ecg')return `<svg viewBox="0 0 100 60"><path ${common} d="M5 32 H22 L27 24 L33 42 L40 10 L47 34 H95"/></svg>`;if(kind==='echo')return `<svg viewBox="0 0 100 60"><path ${common} d="M50 50 C12 29 27 9 43 18 C50 5 78 9 74 28 C72 40 60 46 50 50Z"/><path ${common} d="M50 18 V48 M31 29 H69" opacity=".5"/></svg>`;if(kind==='oct')return `<svg viewBox="0 0 100 60"><path ${common} d="M5 38 C24 27 43 44 62 29 C75 20 85 28 95 22"/><path ${common} d="M5 45 C25 34 44 50 64 36 C77 27 87 34 95 29"/><circle cx="52" cy="29" r="4" fill="#8fb8dc"/></svg>`;if(kind==='chart'||kind==='lab')return `<svg viewBox="0 0 100 60"><path ${common} d="M12 8 V52 H92 M20 44 L34 32 L48 36 L62 20 L78 25"/><path ${common} d="M20 16 H82 M20 26 H82" opacity=".35"/></svg>`;if(kind==='xray')return `<svg viewBox="0 0 100 60"><path ${common} d="M43 6 C38 18 42 26 35 35 C31 41 33 50 42 54 M57 6 C62 18 58 26 65 35 C69 41 67 50 58 54"/><circle ${common} cx="50" cy="28" r="8"/></svg>`;if(kind==='photo')return `<svg viewBox="0 0 100 60"><rect ${common} x="12" y="10" width="76" height="40" rx="5"/><circle ${common} cx="34" cy="25" r="6"/><path ${common} d="M17 46 L38 32 L50 40 L65 27 L83 46"/></svg>`;return `<svg viewBox="0 0 100 60"><rect ${common} x="19" y="7" width="62" height="46" rx="4"/><path ${common} d="M28 18 H72 M28 27 H68 M28 36 H74 M28 45 H58"/></svg>`}
function setProgress(n,total=7){prog.style.width=Math.round((n/total)*100)+'%'}
function choiceGroup(name,opts,value){return `<div class="grid">${opts.map(o=>`<button type="button" class="choice ${value===o?'on':''}" data-choice="${name}" data-value="${o}">${o}</button>`).join('')}</div>`}
function wireChoices(){screen.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{screen.querySelectorAll(`[data-choice="${b.dataset.choice}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on');if(state.current)state.current[b.dataset.choice]=b.dataset.value;else state[b.dataset.choice]=b.dataset.value})}
function startScreen(){setProgress(1);title.textContent='برای چه کسی دنبال خدمات درمانی هستید؟';sub.textContent='اگر چند مشکل دارید، هر مورد را جدا ثبت می‌کنیم ولی اطلاعات تماس فقط یک‌بار گرفته می‌شود.';screen.innerHTML=`<div class="card"><h2>بیمار چه کسی است؟</h2>${choiceGroup('person',['خودم','فرزندم','والدین/همسر','فرد دیگری'],state.person)}<div class="personbox"><div><label class="label">سن بیمار</label><input class="input" id="age" inputmode="numeric" placeholder="مثلاً ۴۲" value="${state.age||''}"></div><div><label class="label">جنسیت <span class="mini">(اختیاری)</span></label><select class="select" id="gender"><option value="">انتخاب نکنم</option><option>زن</option><option>مرد</option></select></div></div></div>${needsBox()}`;wireChoices();$('#age').oninput=e=>state.age=e.target.value;$('#gender').value=state.gender;$('#gender').onchange=e=>state.gender=e.target.value;back.classList.add('hidden');next.textContent=state.needs.length?'ثبت مشکل/نیاز جدید':'ادامه';next.onclick=()=>{state.step=1;categoryScreen()}}
function needsBox(){if(!state.needs.length)return '';return `<div class="card"><h2>نیازهای ثبت‌شده این بیمار</h2>${state.needs.map((n,i)=>`<div class="need"><b>${i+1}. ${n.service}</b><div>${n.city||''} · اولویت اول: ${n.priority1||'-'} · ${n.complaint||''}</div></div>`).join('')}</div>`}
function categoryScreen(){setProgress(2);title.textContent='چه مشکل یا خدمتی دارید؟';sub.textContent='می‌توانید با زبان خودتان بنویسید؛ یا حوزه را مستقیم انتخاب کنید.';state.current={category:'',service:'',pack:'general',complaint:'',city:'',answers:{},docs:{},priority1:'',priority2:'',when:'',insurance:'',insuranceName:'',genderPref:''};screen.innerHTML=`<div class="card"><h2>با زبان خودتان بگویید</h2><p>مثلاً «مشکل چشم دارم»، «برای قلب می‌خوام ویزیت بشم»، «ایمپلنت می‌خوام» یا «MRI زانو دارم».</p><div class="searchrow"><input class="input" id="complaint" placeholder="مشکل یا خدمت مورد نیاز"><button class="btn soft" id="suggest">پیشنهاد حوزه</button></div><div id="suggestion" class="mini"></div></div><div class="card"><h2>یا حوزه را انتخاب کنید</h2><div class="grid">${Object.keys(catalog).map(c=>`<button class="choice" data-cat="${c}">${c}</button>`).join('')}</div></div>`;$('#complaint').oninput=e=>state.current.complaint=e.target.value;$('#suggest').onclick=()=>{const t=$('#complaint').value.trim();state.current.complaint=t;const hit=keywordMap.find(([r])=>r.test(t));if(hit){const [cat,serv]=hit[1];const found=catalog[cat].find(x=>x[0]===serv);$('#suggestion').innerHTML=`پیشنهاد مسیریابی: <b>${serv}</b> · <button class="chip" id="acceptSug">انتخاب</button>`;$('#acceptSug').onclick=()=>serviceSelected(cat,serv,found?.[1]||'general')}else $('#suggestion').textContent='مسیر مشخصی پیدا نشد؛ حوزه را از پایین انتخاب کنید یا «پزشکی عمومی/داخلی» را انتخاب کنید.'};screen.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>specialtyScreen(b.dataset.cat));back.classList.remove('hidden');back.onclick=startScreen;next.classList.add('hidden')}
function specialtyScreen(cat){setProgress(2);title.textContent=`انتخاب خدمت · ${cat}`;sub.textContent='خدمت یا تخصصی را انتخاب کنید که به نیاز شما نزدیک‌تر است.';const list=catalog[cat];screen.innerHTML=`<div class="card"><div class="searchrow"><input class="input" id="serviceSearch" placeholder="جستجو در خدمات"><button class="btn ghost" id="clearS">پاک</button></div><div class="services" id="services">${serviceList(cat,list)}</div></div>`;function filter(){const q=$('#serviceSearch').value.trim();$('#services').innerHTML=serviceList(cat,list.filter(x=>x[0].includes(q)));wireServices(cat)}$('#serviceSearch').oninput=filter;$('#clearS').onclick=()=>{$('#serviceSearch').value='';filter()};wireServices(cat);back.onclick=categoryScreen;back.classList.remove('hidden');next.classList.add('hidden')}
function serviceList(cat,list){return list.map(([s,p])=>`<div class="service" data-service="${s}" data-pack="${p}"><b>${s}</b><span>انتخاب ←</span></div>`).join('')}
function wireServices(cat){screen.querySelectorAll('[data-service]').forEach(x=>x.onclick=()=>serviceSelected(cat,x.dataset.service,x.dataset.pack))}
function serviceSelected(cat,service,pack){state.current.category=cat;state.current.service=service;state.current.pack=pack||'general';detailsScreen()}
function detailsScreen(){setProgress(3);title.textContent=state.current.service;sub.textContent='فقط اطلاعاتی را می‌پرسیم که برای پیدا کردن ارائه‌دهنده مناسب لازم است.';const qs=packQuestions[state.current.pack]||packQuestions.general;screen.innerHTML=`<div class="card"><label class="label">شهر <span class="req">*</span></label><input class="input" id="city" placeholder="مثلاً اهواز" value="${state.current.city||''}"><label class="label">توضیح کوتاه نیاز شما</label><textarea class="textarea" id="desc" placeholder="هر چیزی که فکر می‌کنید برای فهم درخواست لازم است">${state.current.complaint||''}</textarea></div><div class="card"><h2>چند سؤال مرتبط</h2>${qs.map((q,i)=>fieldHTML(q,i)).join('')}</div>`;qs.forEach((q,i)=>{const el=$(`#q${i}`);if(!el)return;el.value=state.current.answers[i]||'';el.onchange=el.oninput=e=>state.current.answers[i]=e.target.value});$('#city').oninput=e=>state.current.city=e.target.value;$('#desc').oninput=e=>state.current.complaint=e.target.value;back.onclick=()=>specialtyScreen(state.current.category);back.classList.remove('hidden');next.classList.remove('hidden');next.textContent='ادامه';next.onclick=()=>{if(!state.current.city.trim())return alert('شهر را وارد کنید.');docsScreen()}}
function fieldHTML(q,i){const [lab,type,opts]=q;return `<label class="label">${lab}</label>${type==='select'?`<select class="select" id="q${i}"><option value="">انتخاب کنید</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input class="input" id="q${i}" placeholder="در صورت اطلاع بنویسید">`}
function docsScreen(){setProgress(4);title.textContent='مدارک و تصاویر';sub.textContent='اگر اسم مدرک را نمی‌شناسید، نمونه تصویری کمک می‌کند تشخیص دهید مشابه آن را دارید یا نه.';const docs=packDocs[state.current.pack]||['report'];screen.innerHTML=`<div class="card"><h2>آیا این مدارک را دارید؟</h2><p>نداشتن مدرک مانع ثبت درخواست نیست. فایل‌ها در این نمونه آزمایشی به سرور ارسال نمی‌شوند.</p>${docs.map(docCard).join('')}</div>`;wireDocOpts();back.onclick=detailsScreen;next.onclick=priorityScreen;next.textContent='ادامه'}
function docCard(k){const m=docMeta[k]||docMeta.report, val=state.current.docs[k]?.status||'';return `<div class="doc"><div class="thumb">${svg(m[2])}</div><div><b>${m[0]}</b><p>${m[1]}</p><div class="docopts">${['دارم','ندارم','مطمئن نیستم'].map(o=>`<button type="button" class="docopt ${val===o?'on':''}" data-doc="${k}" data-val="${o}">${o}</button>`).join('')}</div><div class="upload ${val==='دارم'?'':'hidden'}" id="up_${k}"><input type="file" data-file="${k}" accept="image/*,.pdf"></div></div></div>`}
function wireDocOpts(){screen.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{const k=b.dataset.doc;screen.querySelectorAll(`[data-doc="${k}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on');state.current.docs[k]=state.current.docs[k]||{};state.current.docs[k].status=b.dataset.val;$(`#up_${k}`).classList.toggle('hidden',b.dataset.val!=='دارم')});screen.querySelectorAll('[data-file]').forEach(f=>f.onchange=()=>{const k=f.dataset.file;state.current.docs[k]=state.current.docs[k]||{};state.current.docs[k].file=f.files[0]?.name||''})}
function priorityScreen(){setProgress(5);title.textContent='چه چیزی برای شما مهم‌تر است؟';sub.textContent='اولویت‌ها رتبه‌بندی می‌شوند؛ اولویت اول وزن بیشتری در تطبیق دارد.';screen.innerHTML=`<div class="card"><div class="rank"><em>۱</em><select class="select" id="p1"><option value="">اولویت اول</option>${priorities.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="rank"><em>۲</em><select class="select" id="p2"><option value="">اولویت دوم (اختیاری)</option>${priorities.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="divider"></div><label class="label">چه زمانی می‌خواهید مراجعه/خدمت انجام شود؟</label><select class="select" id="when"><option value="">انتخاب کنید</option><option>امروز/فردا</option><option>تا ۳ روز</option><option>تا یک هفته</option><option>تا یک ماه</option><option>عجله ندارم</option></select><label class="label">بیمه دارید؟</label><select class="select" id="ins"><option value="">انتخاب کنید</option><option>بله</option><option>خیر</option></select><div id="insName" class="hidden"><label class="label">نام بیمه</label><input class="input" id="insInput" placeholder="مثلاً تأمین اجتماعی"></div><label class="label">ترجیح جنسیت ارائه‌دهنده <span class="mini">(اختیاری)</span></label><select class="select" id="gp"><option value="">فرقی ندارد</option><option>خانم</option><option>آقا</option></select></div>`;$('#p1').value=state.current.priority1;$('#p2').value=state.current.priority2;$('#when').value=state.current.when;$('#ins').value=state.current.insurance;$('#gp').value=state.current.genderPref;$('#p1').onchange=e=>state.current.priority1=e.target.value;$('#p2').onchange=e=>state.current.priority2=e.target.value;$('#when').onchange=e=>state.current.when=e.target.value;$('#gp').onchange=e=>state.current.genderPref=e.target.value;$('#ins').onchange=e=>{state.current.insurance=e.target.value;$('#insName').classList.toggle('hidden',e.target.value!=='بله');if(e.target.value==='بله')setTimeout(()=>{$('#insInput').value=state.current.insuranceName;$('#insInput').oninput=x=>state.current.insuranceName=x.target.value},0)};if(state.current.insurance==='بله'){$('#insName').classList.remove('hidden');$('#insInput').value=state.current.insuranceName;$('#insInput').oninput=e=>state.current.insuranceName=e.target.value}back.onclick=docsScreen;next.onclick=()=>{if(!state.current.priority1)return alert('اولویت اول را انتخاب کنید.');if(state.current.priority2===state.current.priority1)return alert('اولویت اول و دوم باید متفاوت باشند.');reviewNeed()}}
function reviewNeed(){setProgress(6);title.textContent='این درخواست درست است؟';sub.textContent='قبل از ثبت، خلاصه درخواست را بررسی کنید.';const docs=Object.entries(state.current.docs).filter(([,v])=>v.status==='دارم').map(([k])=>docMeta[k]?.[0]||k);screen.innerHTML=`<div class="card summary"><strong>${state.current.service}</strong><br>حوزه: ${state.current.category}<br>شهر: ${state.current.city}<br>شرح: ${state.current.complaint||'—'}<br>اولویت اول: ${state.current.priority1}<br>اولویت دوم: ${state.current.priority2||'—'}<br>زمان: ${state.current.when||'—'}<br>بیمه: ${state.current.insurance||'—'} ${state.current.insuranceName?`(${state.current.insuranceName})`:''}<br>مدارک موجود: ${docs.length?docs.map(x=>`<span class="pill">${x}</span>`).join(' '):'موردی ثبت نشده'}</div><div class="notice">اطلاعات درمانی این مرحله فقط برای تطبیق درخواست با ارائه‌دهنده مرتبط طراحی شده و به معنی تشخیص یا طرح درمان نیست.</div>`;back.onclick=priorityScreen;next.textContent='ثبت این نیاز';next.onclick=()=>{state.needs.push(JSON.parse(JSON.stringify(state.current)));state.current=null;afterNeed()}}
function afterNeed(){setProgress(6);title.textContent='نیاز ثبت شد';sub.textContent='اگر بیمار چند مشکل یا خدمت متفاوت نیاز دارد، هرکدام را جدا اضافه کنید.';screen.innerHTML=`<div class="notice">✓ درخواست «${state.needs.at(-1).service}» به فهرست اضافه شد.</div>${needsBox()}<div class="card"><h2>مشکل یا نیاز دیگری هم دارید؟</h2><div class="grid"><button class="choice" id="addNeed">+ بله، مورد دیگری دارم</button><button class="choice" id="finishNeeds">نه، ادامه ثبت</button></div></div>`;$('#addNeed').onclick=categoryScreen;$('#finishNeeds').onclick=contactScreen;back.onclick=()=>{state.needs.pop();priorityScreen()};next.classList.add('hidden')}
function contactScreen(){setProgress(7);title.textContent='راه ارتباط و رضایت';sub.textContent='این اطلاعات بین همه درخواست‌های همین بیمار مشترک است.';screen.innerHTML=`<div class="card"><label class="label">شماره موبایل <span class="req">*</span></label><input class="input" id="contact" inputmode="tel" placeholder="09xxxxxxxxx" value="${state.contact||''}"><label class="label"><input type="checkbox" id="consent" ${state.consent?'checked':''}> اجازه می‌دهم اطلاعات لازم هر درخواست فقط برای بررسی و تطبیق با ارائه‌دهندگان مرتبط پردازش شود.</label><p class="mini">قبل از انتخاب نهایی مرکز، شماره تماس بیمار نباید برای مراکز متعدد نمایش داده شود.</p></div>${needsBox()}`;$('#contact').oninput=e=>state.contact=e.target.value;$('#consent').onchange=e=>state.consent=e.target.checked;back.onclick=afterNeed;back.classList.remove('hidden');next.classList.remove('hidden');next.textContent='پایان تست';next.onclick=finish}
function finish(){if(!/^09\d{9}$/.test(String(state.contact).replace(/\D/g,'')))return alert('شماره موبایل معتبر وارد کنید.');if(!state.consent)return alert('برای ادامه، رضایت پردازش اطلاعات لازم است.');setProgress(7);title.textContent='فرم آزمایشی کامل شد';sub.textContent='این نسخه فقط برای تست طراحی مرحله اول است و چیزی به بک‌اند اصلی ارسال نکرد.';screen.innerHTML=`<div class="notice">✓ ${state.needs.length} نیاز درمانی برای این بیمار آماده شد.</div><div class="card"><h2>خروجی قابل ارسال به موتور Matching</h2>${state.needs.map((n,i)=>`<div class="need"><b>${i+1}. ${n.service} · ${n.city}</b><div>${n.complaint||''}<br>اولویت ۱: ${n.priority1} · اولویت ۲: ${n.priority2||'-'}<br>مدارک: ${Object.entries(n.docs).filter(([,v])=>v.status==='دارم').map(([k])=>docMeta[k]?.[0]||k).join('، ')||'—'}</div></div>`).join('')}</div><button class="btn soft" id="restart" style="width:100%">تست از اول</button>`;$('#restart').onclick=()=>location.reload();back.classList.add('hidden');next.classList.add('hidden')}
startScreen();
})();
</script>
