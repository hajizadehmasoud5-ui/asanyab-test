function details(){setProgress(3);title.textContent=state.current.service;sub.textContent='فقط اطلاعات لازم برای پیدا کردن ارائه‌دهنده مناسب را می‌پرسیم.';var qs=questions[state.current.pack]||questions.general;var h='<div class="card"><label class="label">شهر *</label><input class="input" id="city" placeholder="مثلاً اهواز"><label class="label">توضیح کوتاه نیاز</label><textarea class="textarea" id="desc"></textarea></div><div class="card"><h2>چند سؤال مرتبط</h2>';for(var i=0;i<qs.length;i++){h+='<label class="label">'+qs[i][0]+'</label><select class="select" id="q'+i+'"><option value="">انتخاب کنید</option>';for(var j=0;j<qs[i][1].length;j++)h+='<option>'+qs[i][1][j]+'</option>';h+='</select>'}h+='</div>';screen.innerHTML=h;el('city').value=state.current.city;el('desc').value=state.current.complaint;el('city').oninput=function(){state.current.city=this.value};el('desc').oninput=function(){state.current.complaint=this.value};for(var z=0;z<qs.length;z++){(function(idx){el('q'+idx).onchange=function(){state.current.answers[idx]=this.value}})(z)}back.onclick=function(){services(state.current.category)};back.classList.remove('hidden');next.classList.remove('hidden');next.textContent='ادامه';next.onclick=function(){if(!state.current.city.trim()){alert('شهر را وارد کنید.');return}documents()}}
function documents(){setProgress(4);title.textContent='مدارک و تصاویر';sub.textContent='اگر اسم مدرک را نمی‌شناسید، نمونه تصویری کمک می‌کند.';var arr=docs[state.current.pack]||['report'];var h='<div class="card"><h2>آیا این مدارک را دارید؟</h2><p class="mini">نداشتن مدرک مانع ثبت درخواست نیست.</p>';for(var i=0;i<arr.length;i++){var k=arr[i],m=docMeta[k]||docMeta.report;h+='<div class="doc"><div class="thumb">'+svg(m[2])+'</div><div><b>'+m[0]+'</b><p>'+m[1]+'</p><div class="opts"><button class="opt" data-doc="'+k+'" data-val="دارم">دارم</button><button class="opt" data-doc="'+k+'" data-val="ندارم">ندارم</button><button class="opt" data-doc="'+k+'" data-val="مطمئن نیستم">مطمئن نیستم</button></div><div id="file_'+k+'" class="hidden"><input type="file" accept="image/*,.pdf"></div></div></div>'}h+='</div>';screen.innerHTML=h;var opts=screen.querySelectorAll('[data-doc]');for(var j=0;j<opts.length;j++)opts[j].onclick=function(){var k=this.getAttribute('data-doc'),v=this.getAttribute('data-val');state.current.docs[k]=v;var same=screen.querySelectorAll('[data-doc="'+k+'"]');for(var x=0;x<same.length;x++)same[x].classList.remove('on');this.classList.add('on');el('file_'+k).classList.toggle('hidden',v!=='دارم')};back.onclick=details;next.onclick=priority;next.textContent='ادامه'}
function priority(){setProgress(5);title.textContent='چه چیزی برای شما مهم‌تر است؟';sub.textContent='اولویت اول وزن بیشتری در تطبیق دارد.';var po='<option value="">انتخاب کنید</option>';for(var i=0;i<priorities.length;i++)po+='<option>'+priorities[i]+'</option>';screen.innerHTML='<div class="card"><div class="rank"><i>۱</i><select id="p1" class="select">'+po+'</select></div><div class="rank"><i>۲</i><select id="p2" class="select">'+po+'</select></div><label class="label">زمان مراجعه</label><select id="when" class="select"><option value="">انتخاب کنید</option><option>امروز/فردا</option><option>تا ۳ روز</option><option>تا یک هفته</option><option>تا یک ماه</option><option>عجله ندارم</option></select><label class="label">بیمه دارید؟</label><select id="ins" class="select"><option value="">انتخاب کنید</option><option>بله</option><option>خیر</option></select><div id="insbox" class="hidden"><label class="label">نام بیمه</label><input id="insname" class="input" placeholder="مثلاً تأمین اجتماعی"></div></div>';el('p1').onchange=function(){state.current.priority1=this.value};el('p2').onchange=function(){state.current.priority2=this.value};el('when').onchange=function(){state.current.when=this.value};el('ins').onchange=function(){state.current.insurance=this.value;el('insbox').classList.toggle('hidden',this.value!=='بله')};el('insname').oninput=function(){state.current.insuranceName=this.value};back.onclick=documents;next.onclick=function(){if(!state.current.priority1){alert('اولویت اول را انتخاب کنید.');return}if(state.current.priority1===state.current.priority2){alert('اولویت اول و دوم باید متفاوت باشند.');return}review()}}
function review(){setProgress(6);title.textContent='این درخواست درست است؟';sub.textContent='خلاصه را بررسی کنید.';var have=[];for(var k in state.current.docs)if(state.current.docs[k]==='دارم')have.push((docMeta[k]||[k])[0]);screen.innerHTML='<div class="card"><b>'+state.current.service+'</b><div class="mini" style="margin-top:8px">شهر: '+state.current.city+'<br>شرح: '+(state.current.complaint||'—')+'<br>اولویت اول: '+state.current.priority1+'<br>اولویت دوم: '+(state.current.priority2||'—')+'<br>زمان: '+(state.current.when||'—')+'<br>بیمه: '+(state.current.insurance||'—')+' '+(state.current.insuranceName||'')+'<br>مدارک: '+(have.join('، ')||'—')+'</div></div><div class="notice">این اطلاعات برای تطبیق درخواست با ارائه‌دهنده مرتبط است و به معنی تشخیص یا طرح درمان نیست.</div>';back.onclick=priority;next.textContent='ثبت این نیاز';next.onclick=function(){state.needs.push(JSON.parse(JSON.stringify(state.current)));state.current=null;afterNeed()}}
function afterNeed(){setProgress(6);title.textContent='نیاز ثبت شد';sub.textContent='اگر مشکل دیگری هم دارید، آن را جدا اضافه کنید.';screen.innerHTML='<div class="notice">✓ نیاز ثبت شد.</div><div class="card"><h2>نیازهای این بیمار</h2>'+needList()+'</div><div class="card"><div class="grid"><button id="more" class="choice">+ نیاز دیگری دارم</button><button id="done" class="choice">ادامه ثبت</button></div></div>';el('more').onclick=category;el('done').onclick=contact;back.classList.add('hidden');next.classList.add('hidden')}
function contact(){setProgress(7);title.textContent='راه ارتباط و رضایت';sub.textContent='شماره تماس فقط یک‌بار برای همه نیازهای این بیمار گرفته می‌شود.';screen.innerHTML='<div class="card"><label class="label">شماره موبایل *</label><input id="phone" class="input" inputmode="tel" placeholder="09xxxxxxxxx"><label class="label"><input id="consent" type="checkbox"> اجازه می‌دهم اطلاعات لازم برای تطبیق این درخواست‌ها با ارائه‌دهندگان مرتبط پردازش شود.</label><p class="mini">شماره بیمار قبل از انتخاب نهایی نباید برای مراکز متعدد نمایش داده شود.</p></div><div class="card"><h2>نیازهای ثبت‌شده</h2>'+needList()+'</div>';el('phone').value=state.contact;el('phone').oninput=function(){state.contact=this.value};el('consent').checked=state.consent;el('consent').onchange=function(){state.consent=this.checked};back.classList.remove('hidden');back.onclick=afterNeed;next.classList.remove('hidden');next.textContent='پایان تست';next.onclick=finish}
function finish(){var p=String(state.contact).replace(/\D/g,'');if(!/^09\d{9}$/.test(p)){alert('شماره موبایل معتبر وارد کنید.');return}if(!state.consent){alert('رضایت پردازش اطلاعات لازم است.');return}setProgress(7);title.textContent='مرحله اول کامل شد';sub.textContent='این نسخه آزمایشی چیزی به بک‌اند اصلی ارسال نمی‌کند.';screen.innerHTML='<div class="notice">✓ '+state.needs.length+' نیاز درمانی برای این بیمار آماده شد.</div><div class="card"><h2>خروجی آماده Matching</h2>'+needList()+'</div><button id="restart" class="btn soft" style="width:100%">تست از اول</button>';el('restart').onclick=function(){location.reload()};back.classList.add('hidden');next.classList.add('hidden')}
start();
})();
</script></body></html>
