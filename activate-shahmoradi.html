<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>فعال‌سازی لینک ارجاع</title><style>body{margin:0;background:#f6f8fb;font-family:Tahoma,Arial,sans-serif;color:#101828}.w{max-width:560px;margin:60px auto;padding:16px}.c{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:20px}.b{width:100%;border:0;border-radius:12px;background:#1769e0;color:#fff;padding:13px;font-weight:900;font-size:15px}.m{font-size:12px;color:#667085;line-height:1.9}.ok{background:#ecfaf4;color:#126546;padding:12px;border-radius:12px;margin-top:12px}.err{background:#fef3f2;color:#b42318;padding:12px;border-radius:12px;margin-top:12px}</style></head><body><main class="w"><div class="c"><h2>فعال‌سازی لینک دکتر محسن شاهمرادی</h2><p class="m">این کار فقط یک‌بار انجام می‌شود. لینک عمومی ثابت می‌ماند و اطلاعات مدیریت فقط روی همین مرورگر ذخیره می‌شود.</p><button id="go" class="b">فعال‌سازی</button><div id="msg"></div></div></main><script>const API='https://python-0jatcc.cldv.dev/alanoffer/api/referral';document.getElementById('go').onclick=async()=>{const b=document.getElementById('go'),m=document.getElementById('msg');b.disabled=true;b.textContent='در حال فعال‌سازی...';try{let r=await fetch(API+'/specialists/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'دکتر محسن شاهمرادی',clinicName:'مطب دکتر محسن شاهمرادی',city:'اهواز',phone:'',slug:'dr.shahmoradi.endodontist'})});let j=await r.json();if(!r.ok)throw new Error();localStorage.setItem('drlinqReferralShahmoradi',JSON.stringify({specialistId:j.specialistId,accessToken:j.accessToken,slug:j.slug,name:'دکتر محسن شاهمرادی',clinicName:'مطب دکتر محسن شاهمرادی',city:'اهواز'}));m.innerHTML='<div class="ok">فعال شد ✓<br>الان لینک ارجاع باز می‌شود.</div>';setTimeout(()=>location.href='/dr.shahmoradi.endodontist/',800)}catch(e){m.innerHTML='<div class="err">فعال‌سازی انجام نشد. دوباره بزن.</div>';b.disabled=false;b.textContent='فعال‌سازی'}};</script></body></html>
