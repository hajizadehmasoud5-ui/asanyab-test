<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پیگیری درخواست | دکترلینک</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><header class="topbar"><a class="logo" href="./"><span class="logo-mark">د+</span><span data-brand></span></a><a class="provider-link" href="./">درخواست تازه</a></header><main><section class="hero"><div class="eyebrow">پیگیری شفاف</div><h1>وضعیت درخواست درمان</h1><p>وقتی درمانگری اعلام آمادگی کند، پیشنهادش همین‌جا نمایش داده می‌شود.</p></section><section class="card"><div id="loading" class="empty">در حال دریافت وضعیت…</div><div id="error" hidden></div><div id="content" class="hidden"><div class="status-track" id="track"></div><div class="request-summary" id="summary"></div><div class="results-title"><div><h2>پیشنهادهای درمانگران</h2><p class="sub" id="offerHint"></p></div><button class="button secondary" id="refresh">به‌روزرسانی</button></div><div id="offers" class="provider-list"></div><div id="selectMessage" hidden></div></div></section></main><footer class="footer">لینک این صفحه را برای پیگیری نگه دار.</footer></div><script src="config.js"></script><script src="common.js"></script><script>
const {api,money,escapeHtml,params,setMessage}=window.DrLinq,p=params(),id=p.get('id'),token=p.get('token'),content=document.querySelector('#content'),offers=document.querySelector('#offers');const stages=['submitted','providers_notified','provider_interested','selected'],labels=['ثبت شد','اطلاع به درمانگران','اعلام آمادگی','انتخاب نهایی'];let state;
async function load(){if(!id||!token){document.querySelector('#loading').hidden=true;return setMessage(document.querySelector('#error'),'لینک پیگیری ناقص است.','error')}try{state=await api(`/marketplace/requests/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`);document.querySelector('#loading').hidden=true;content.classList.remove('hidden');const current=Math.max(0,stages.indexOf(state.request.status));document.querySelector('#track').innerHTML=labels.map((x,i)=>`<div class="step ${i<=current?'done':''}">${x}</div>`).join('');document.querySelector('#summary').innerHTML=`<strong>${escapeHtml(state.request.service)}</strong><span>${escapeHtml(state.request.province)}، ${escapeHtml(state.request.city)}${state.request.insurer?` · ${escapeHtml(state.request.insurer)}`:''}</span><span>بودجه: ${money(state.request.budget_min)} تا ${money(state.request.budget_max)}</span>`;document.querySelector('#offerHint').textContent=state.request.status==='selected'?'درمانگر انتخاب شده و اطلاعات تماس در دسترس است.':state.offers.length?'پیشنهادها را مقایسه و یک درمانگر را انتخاب کن.':'هنوز درمانگری اعلام آمادگی نکرده است.';offers.innerHTML=state.offers.length?state.offers.map(renderOffer).join(''):'<div class="empty">درخواست ارسال شده است. برای دیدن پاسخ‌ها بعداً این صفحه را به‌روزرسانی کن.</div>'}catch(e){document.querySelector('#loading').hidden=true;setMessage(document.querySelector('#error'),`وضعیت درخواست در دسترس نیست: ${e.message}`,'error')}}
function renderOffer(x){const o=x.offer||{},selected=state.request.selected_match_id===x.match_id;return `<article class="provider-card offer"><div class="provider-head"><div><h3>${escapeHtml(x.provider_name)}</h3><p>${escapeHtml(x.provider_type||'مرکز درمانی')} · ${escapeHtml(x.city)}</p></div>${selected?'<span class="score">انتخاب‌شده</span>':''}</div><div class="offer-data"><div class="datum"><span>برآورد هزینه</span><strong>${money(o.estimated_price_min)} تا ${money(o.estimated_price_max)}</strong></div><div class="datum"><span>اولین زمان</span><strong>${escapeHtml(o.earliest_available||'هماهنگ می‌شود')}</strong></div></div>${o.note?`<p>${escapeHtml(o.note)}</p>`:''}${selected?`<div class="message success">اطلاعات تماس درمانگر: ${escapeHtml(x.contact||'در بانک ثبت نشده')}</div>`:`<button class="button choose" data-match="${x.match_id}">انتخاب این درمانگر</button>`}</article>`}
offers.addEventListener('click',async(e)=>{const button=e.target.closest('.choose');if(!button)return;button.disabled=true;try{await api(`/marketplace/requests/${encodeURIComponent(id)}/select`,{method:'POST',body:JSON.stringify({public_token:token,match_id:button.dataset.match})});await load();setMessage(document.querySelector('#selectMessage'),'درمانگر با موفقیت انتخاب شد.','success')}catch(err){button.disabled=false;setMessage(document.querySelector('#selectMessage'),`انتخاب انجام نشد: ${err.message}`,'error')}});document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
