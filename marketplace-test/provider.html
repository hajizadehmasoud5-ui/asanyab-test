<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پنل درمانگر | دکترلینک</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><header class="topbar"><a class="logo" href="./"><span class="logo-mark">د+</span><span data-brand></span></a><a class="provider-link" href="./">سمت بیمار</a></header><main><section class="hero"><div class="eyebrow">ورودی ساده درمانگر</div><h1>درخواست‌های مرتبط با شما</h1><p>با کد اختصاصی، درخواست‌های ارسال‌شده را ببین و فقط وضعیت دسترسی و برآورد اولیه را اعلام کن.</p></section><section class="card" id="login"><h2>ورود درمانگر</h2><p class="sub">کد دسترسی همراه اعلان درخواست برای شما ارسال می‌شود.</p><form id="loginForm"><div class="field"><label for="access">کد دسترسی</label><input id="access" autocomplete="off" required placeholder="کد اختصاصی درمانگر"></div><div id="loginMessage" hidden></div><div class="actions"><button class="button" type="submit">مشاهده درخواست‌ها</button></div></form></section><section class="card hidden" id="dashboard"><div class="dashboard-head"><div><h2 id="providerName"></h2><p class="sub" id="providerType"></p></div><button class="button secondary" id="exit">خروج</button></div><div id="dashboardMessage" hidden></div><div id="requests"></div></section></main><footer class="footer">این صفحه تشخیص پزشکی یا گفت‌وگوی درمانی ارائه نمی‌کند.</footer></div><script src="config.js"></script><script src="common.js"></script><script>
const {api,money,escapeHtml,params,setMessage}=window.DrLinq;let access=params().get('code')||'';const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),requests=document.querySelector('#requests');document.querySelector('#access').value=access;
async function load(){try{const data=await api(`/marketplace/provider/dashboard?access_token=${encodeURIComponent(access)}`);login.classList.add('hidden');dashboard.classList.remove('hidden');document.querySelector('#providerName').textContent=data.provider.name;document.querySelector('#providerType').textContent=data.provider.type||'درمانگر';requests.innerHTML=data.requests.length?data.requests.map(renderRequest).join(''):'<div class="empty">درخواست جدیدی برای شما وجود ندارد.</div>'}catch(e){setMessage(document.querySelector('#loginMessage'),'کد دسترسی معتبر نیست یا سامانه موقتاً در دسترس نیست.','error')}}
function renderRequest(r){const responded=['interested','not_available','selected'].includes(r.status);return `<article class="request-card" data-match="${r.match_id}"><div class="provider-head"><div><h3>${escapeHtml(r.service_text)}</h3><p>${escapeHtml(r.province)}، ${escapeHtml(r.city)}${r.location_text?` · ${escapeHtml(r.location_text)}`:''}</p></div><span class="score">${statusLabel(r.status)}</span></div><div class="request-meta">${r.insurer?`<span>بیمه: ${escapeHtml(r.insurer)}</span>`:''}<span>بودجه: ${money(r.budget_min)} تا ${money(r.budget_max)}</span>${r.preferred_time?`<span>زمان: ${escapeHtml(r.preferred_time)}</span>`:''}</div>${r.patient_contact?`<div class="message success">تماس بیمار: ${escapeHtml(r.patient_contact)}</div>`:''}${responded?`<p class="sub">پاسخ شما ثبت شده است.</p>`:`<div class="actions"><button class="button interested">علاقه‌مندم</button><button class="button danger unavailable">در این زمان امکان‌پذیر نیست</button></div><form class="response-form hidden"><div class="grid two"><div class="field"><label>حداقل برآورد (تومان)</label><input name="min" type="number" min="0" inputmode="numeric"></div><div class="field"><label>حداکثر برآورد (تومان)</label><input name="max" type="number" min="0" inputmode="numeric"></div></div><div class="grid two" style="margin-top:12px"><div class="field"><label>اولین زمان موجود</label><input name="time" placeholder="مثلاً فردا ساعت ۱۷"></div><div class="field"><label>یادداشت کوتاه</label><input name="note" maxlength="700" placeholder="توضیح لازم برای بیمار"></div></div><div class="actions"><button class="button" type="submit">ثبت اعلام آمادگی</button></div></form>`}<div class="response-message" hidden></div></article>`}
function statusLabel(s){return({notified:'جدید',interested:'علاقه‌مند',not_available:'عدم امکان',selected:'انتخاب‌شده'})[s]||s}
document.querySelector('#loginForm').addEventListener('submit',e=>{e.preventDefault();access=document.querySelector('#access').value.trim();load()});document.querySelector('#exit').addEventListener('click',()=>{history.replaceState({},'',location.pathname);location.reload()});
requests.addEventListener('click',async e=>{const card=e.target.closest('.request-card');if(!card)return;if(e.target.closest('.interested'))card.querySelector('.response-form').classList.remove('hidden');if(e.target.closest('.unavailable'))await respond(card,'not_available')});requests.addEventListener('submit',async e=>{const form=e.target.closest('.response-form');if(!form)return;e.preventDefault();const card=form.closest('.request-card');await respond(card,'interested',{estimated_price_min:form.min.value?Number(form.min.value):null,estimated_price_max:form.max.value?Number(form.max.value):null,earliest_available:form.time.value.trim(),note:form.note.value.trim()})});
async function respond(card,decision,extra={}){const msg=card.querySelector('.response-message');try{await api('/marketplace/provider/respond',{method:'POST',body:JSON.stringify({access_token:access,match_id:card.dataset.match,decision,...extra})});setMessage(document.querySelector('#dashboardMessage'),'پاسخ شما ثبت شد و در صفحه بیمار نمایش داده می‌شود.','success');await load()}catch(e){setMessage(msg,`ثبت پاسخ انجام نشد: ${e.message}`,'error')}}if(access)load();
</script></body></html>
