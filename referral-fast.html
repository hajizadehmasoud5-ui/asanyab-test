<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DrLinq | ارجاع سریع اندو</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#101828;font-family:Tahoma,Arial,sans-serif}.w{max-width:680px;margin:auto;padding:14px}.hero,.card{border-radius:18px}.hero{background:#0f1f38;color:#fff;padding:18px;margin-bottom:10px}.hero h1{font-size:19px;margin:0 0 5px}.hero p{font-size:10px;line-height:1.8;margin:0;color:#d9e2ee}.card{background:#fff;border:1px solid #e4e7ec;padding:14px}.p{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.p i{height:5px;background:#e4e7ec;border-radius:9px}.p i.on{background:#1769e0}.step{display:none}.step.on{display:block}h2{font-size:15px;margin:0 0 4px}.mut{font-size:9px;color:#667085;line-height:1.8}.f{margin:10px 0}.f label{display:block;font-size:10px;font-weight:800;margin-bottom:5px}.f input,.f textarea{width:100%;border:1px solid #d8dde5;border-radius:11px;padding:10px;font:inherit;font-size:11px}.f textarea{min-height:60px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.c,.t{border:1px solid #d8dde5;background:#fff;border-radius:10px;padding:9px;font-size:10px;cursor:pointer}.c.on,.t.on{background:#eef5ff;border-color:#1769e0;color:#14549a;font-weight:800}.teeth{direction:ltr;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.t{padding:8px 1px;text-align:center}.t.on{background:#1769e0;color:#fff}.lab{font-size:8px;color:#667085;margin:7px 0 3px}.up{border:1px dashed #aeb8c6;border-radius:11px;padding:11px;text-align:center;font-size:9px}.actions{display:flex;gap:7px;margin-top:12px}.btn{border-radius:11px;padding:11px;border:0;font-weight:800;cursor:pointer}.next{background:#1769e0;color:#fff;flex:1}.back{background:#fff;border:1px solid #e4e7ec}.hide{display:none}.ok{background:#ecfaf4;color:#126546;border-radius:10px;padding:10px;font-size:9px}.err{background:#fef3f2;color:#b42318;border-radius:10px;padding:10px;font-size:9px}@media(max-width:560px){.grid,.choices{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero"><h1 id="title">ارجاع به متخصص درمان ریشه</h1><p id="meta">بدون ثبت‌نام؛ فقط اطلاعاتی که متخصص قبل از دیدن بیمار لازم دارد.</p></div><div class="p" id="prog"><i></i><i></i><i></i></div><form id="form" class="card"><section class="step" data-n="1"><h2>۱. بیمار و علت ارجاع</h2><div class="grid"><div class="f"><label>نام همکار ارجاع‌دهنده *</label><input id="doctor" placeholder="دکتر ..."></div><div class="f"><label>نام بیمار *</label><input id="patient" placeholder="نام و نام خانوادگی"></div></div><div class="f"><label>موبایل بیمار *</label><input id="phone" inputmode="tel" placeholder="09..."></div><div class="lab">فک بالا</div><div class="teeth" id="up"></div><div class="lab">فک پایین</div><div class="teeth" id="down"></div><div class="f"><label>علت اصلی ارجاع *</label><div class="choices" id="types"></div></div></section><section class="step" data-n="2"><h2>۲. نکته مهم کیس</h2><p class="mut">فقط گزینه‌های مرتبط با علت ارجاع نشان داده می‌شود.</p><div class="f"><label>مشکل اصلی</label><div class="choices" id="problems"></div></div><div class="f"><label>تشخیص یا نکته بالینی (اختیاری)</label><input id="dx" placeholder="مثلاً SAP، نکروز پالپ، شک به ترک"></div><div class="f"><label>یافته مهم (اختیاری)</label><div class="choices" id="findings"></div></div><div class="f"><label>توضیح کوتاه (اختیاری)</label><textarea id="note" placeholder="اگر چیزی در گزینه‌ها نبود"></textarea></div></section><section class="step" data-n="3"><h2>۳. تصویر و ارسال</h2><div class="up"><b>رادیوگرافی / CBCT در صورت وجود</b><br><br><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf,.dcm"><div id="fn"></div></div><div class="f"><label>فوریت *</label><div class="choices" id="urgencies"></div></div><label style="font-size:9px;line-height:1.8;display:flex;gap:7px"><input id="consent" type="checkbox">اطلاعات و تصاویر بیمار با اطلاع/رضایت او برای ادامه درمان تخصصی ارسال می‌شود.</label><div id="msg" style="margin-top:9px"></div></section><div class="actions"><button type="button" class="btn back" id="back">قبلی</button><button type="button" class="btn next" id="next">ادامه</button><button type="submit" class="btn next hide" id="send">ارسال برای متخصص</button></div></form></main><script>const API='https://python-0jatcc.cldv.dev/alanoffer/api/referral',$=x=>document.getElementById(x),q=new URLSearchParams(location.search),slug=q.get('c');let step=1,tooth='',type='',problem='',finding='',urgency='';const TYPES=['RCT اولیه','درمان مجدد (Re-RCT)','مشکل حین درمان','تشخیص درد / ضایعه','جراحی اندو','تروما / ترک / رزورپشن'];const P={'RCT اولیه':['کانال کلسیفیه / قابل مذاکره نیست','آناتومی پیچیده','بی‌حسی دشوار','سایر'],'درمان مجدد (Re-RCT)':['علائم یا ضایعه پایدار','کانال جاافتاده','اُبتوریشن نامناسب','خارج‌کردن پست','سایر'],'مشکل حین درمان':['فایل جداشده','پرفوریشن','کانال کلسیفیه / قابل مذاکره نیست','Ledge / Blockage','خارج‌کردن پست','سایر'],'تشخیص درد / ضایعه':['منشأ درد نامشخص','شک به ترک','رزورپشن','ضایعه نامشخص','سایر'],'جراحی اندو':['ارزیابی Apicoectomy','ضایعه پایدار بعد RCT','سایر'],'تروما / ترک / رزورپشن':['تروما','شک به ترک / VRF','Internal resorption','External resorption','سایر']};function choices(id,a,cb){let e=$(id);e.innerHTML='';a.forEach(x=>{let b=document.createElement('button');b.type='button';b.className='c';b.textContent=x;b.onclick=()=>{[...e.children].forEach(z=>z.classList.remove('on'));b.classList.add('on');cb(x)};e.appendChild(b)})}function teeth(id,a){let e=$(id);a.forEach(n=>{let b=document.createElement('button');b.type='button';b.className='t';b.textContent=n;b.onclick=()=>{document.querySelectorAll('.t').forEach(z=>z.classList.remove('on'));b.classList.add('on');tooth=n};e.appendChild(b)})}teeth('up',['18','17','16','15','14','13','12','11','21','22','23','24','25','26','27','28']);teeth('down',['48','47','46','45','44','43','42','41','31','32','33','34','35','36','37','38']);choices('types',TYPES,x=>{type=x;problem='';choices('problems',P[x]||['سایر'],y=>problem=y)});choices('findings',['درد به پرکاشن','تورم / سینوس تراکت','درد خودبه‌خودی','حساسیت حرارتی','بی‌علامت'],x=>finding=x);choices('urgencies',['اورژانسی / درد شدید','امروز یا فردا','این هفته','روتین'],x=>urgency=x);$('doctor').value=localStorage.getItem('drlinqDoctor')||'';$('files').onchange=()=>{$('fn').textContent=[...$('files').files].map(f=>f.name).join('، ')};function show(n){step=n;document.querySelectorAll('.step').forEach(e=>e.classList.toggle('on',+e.dataset.n===n));document.querySelectorAll('#prog i').forEach((e,i)=>e.classList.toggle('on',i<n));$('back').classList.toggle('hide',n===1);$('next').classList.toggle('hide',n===3);$('send').classList.toggle('hide',n!==3);scrollTo(0,0)}$('next').onclick=()=>{if(step===1){if(!$('doctor').value.trim()||!$('patient').value.trim()||!$('phone').value.trim()||!tooth||!type){alert('موارد ستاره‌دار، دندان و علت ارجاع را کامل کنید.');return}localStorage.setItem('drlinqDoctor',$('doctor').value.trim())}show(step+1)};$('back').onclick=()=>show(step-1);$('form').onsubmit=async e=>{e.preventDefault();if(!urgency){alert('فوریت را انتخاب کنید.');return}if(!$('consent').checked){alert('تأیید رضایت بیمار لازم است.');return}let payload={patientName:$('patient').value.trim(),patientPhone:$('phone').value.trim(),referringDoctor:$('doctor').value.trim(),referringPhone:'',tooth,referralType:type,workingDiagnosis:$('dx').value.trim(),tests:finding,problem,problemDetail:'',radiographType:$('files').files.length?'فایل پیوست':'',urgency,instructions:$('note').value.trim(),consent:'true'},fd=new FormData();fd.append('payload',JSON.stringify(payload));[...$('files').files].slice(0,4).forEach(f=>fd.append('files',f));$('send').disabled=true;try{let r=await fetch(API+'/c/'+encodeURIComponent(slug)+'/submit',{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw 0;$('msg').innerHTML='<div class="ok">ارجاع با موفقیت برای متخصص ارسال شد ✓</div>';document.querySelector('.actions').classList.add('hide')}catch{$('msg').innerHTML='<div class="err">ارسال انجام نشد؛ دوباره تلاش کنید.</div>';$('send').disabled=false}};async function load(){try{let r=await fetch(API+'/c/'+encodeURIComponent(slug)),j=await r.json();if(!r.ok)throw 0;$('title').textContent='ارجاع به '+j.specialist.name;$('meta').textContent=[j.specialist.clinicName,'متخصص درمان ریشه',j.specialist.city].filter(Boolean).join(' • ')}catch{$('form').innerHTML='این لینک ارجاع پیدا نشد.'}}load();show(1);</script></body></html>
