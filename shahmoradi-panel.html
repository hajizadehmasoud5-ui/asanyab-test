<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1f38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/specialist-app.webmanifest">
<link rel="icon" href="/specialist-icon.svg" type="image/svg+xml">
<title>دکتر لینک | پنل متخصص</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#101828;font-family:Tahoma,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}button,select{font:inherit}.w{max-width:760px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand{font-size:20px;font-weight:900}.brand b{color:#1769e0}.topBtns{display:flex;gap:7px}.miniBtn{border:1px solid #d8dde5;background:#fff;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:800;color:#344054}.miniBtn.on{border-color:#8fd1b6;background:#ecfaf4;color:#126546}.hero{background:linear-gradient(145deg,#0f1f38,#1c355b);color:#fff;border-radius:20px;padding:18px;margin-bottom:10px;box-shadow:0 12px 34px rgba(16,24,40,.10)}.hero h1{margin:0 0 5px;font-size:21px;line-height:1.5}.hero p{margin:0;color:#d8e2ef;font-size:11px;line-height:1.8}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:13px;margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f8fafc;border-radius:12px;padding:11px}.stat span{display:block;font-size:9px;color:#667085}.stat b{font-size:21px}.ref{border:1px solid #e4e7ec;border-radius:13px;padding:12px;margin-top:9px;background:#fff}.ref.new{border-color:#9dc0f4;background:#f7fbff}.ref h3{font-size:14px;margin:0 0 6px}.ref p{font-size:11px;line-height:1.8;margin:4px 0;color:#475467}.status{width:100%;margin-top:8px;border:1px solid #d8dde5;border-radius:10px;padding:10px;background:#fff}.err{background:#fef3f2;color:#b42318;border-radius:12px;padding:12px;font-size:11px;line-height:1.8}.ok{background:#ecfaf4;color:#126546;border-radius:12px;padding:12px;font-size:11px}.btn{display:block;width:100%;border:0;border-radius:12px;background:#1769e0;color:#fff;padding:12px;font-weight:900;text-align:center;text-decoration:none}.install{display:none;margin-bottom:10px;background:#eef5ff;border:1px solid #c8dcf8;color:#14549a;border-radius:13px;padding:11px;font-size:11px;font-weight:900;width:100%}.mut{color:#667085;font-size:11px;line-height:1.8}.empty{text-align:center;padding:24px 10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#12b76a;margin-left:5px}.fileLink{display:inline-block;margin:5px 0 0 5px;padding:7px 9px;border-radius:9px;background:#eef5ff;color:#14549a;text-decoration:none;font-size:10px}.loading{padding:24px;text-align:center;color:#667085;font-size:11px}@media(max-width:600px){.w{padding:10px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:9px}.stat b{font-size:19px}.hero h1{font-size:18px}.topBtns{gap:4px}.miniBtn{padding:7px 8px;font-size:9px}}
</style>
</head>
<body>
<main class="w">
  <div class="top"><div class="brand">دکتر<b>لینک</b></div><div class="topBtns"><button class="miniBtn" id="notifyBtn">فعال‌کردن اعلان</button><button class="miniBtn" id="refreshBtn">تازه‌سازی</button></div></div>
  <button id="installBtn" class="install">نصب پنل متخصص روی گوشی</button>
  <div class="hero"><h1>پنل متخصص دکتر محسن شاهمرادی</h1><p><span class="dot"></span>ارجاع‌های درمان ریشه — Web App</p></div>
  <div id="app"><div class="card loading">در حال بارگذاری ارجاع‌ها...</div></div>
</main>
<script>
const API='/api/referral';
const app=document.getElementById('app');
const notifyBtn=document.getElementById('notifyBtn');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let auth=null;try{auth=JSON.parse(localStorage.getItem('drlinqReferralShahmoradi')||'null')}catch(e){}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block'});
document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'};
let swReady=null;
if('serviceWorker' in navigator){swReady=navigator.serviceWorker.register('/specialist-sw.js').then(async r=>{try{await r.update()}catch(_){ }return navigator.serviceWorker.ready}).then(()=>navigator.serviceWorker.ready).catch(()=>null)}
document.getElementById('refreshBtn').onclick=()=>load();
function b64ToBytes(v){const pad='='.repeat((4-v.length%4)%4),s=(v+pad).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(s),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function updateNotifyState(){if(!('Notification' in window)||!('PushManager' in window)||!swReady){notifyBtn.textContent='اعلان پشتیبانی نمی‌شود';notifyBtn.disabled=true;return}try{const reg=await swReady;if(!reg)return;const sub=await reg.pushManager.getSubscription();if(sub&&Notification.permission==='granted'){notifyBtn.textContent='اعلان روشن ✓';notifyBtn.classList.add('on')}else{notifyBtn.textContent='فعال‌کردن اعلان';notifyBtn.classList.remove('on')}}catch(_){}}
notifyBtn.onclick=async()=>{if(!auth?.specialistId||!auth?.accessToken){alert('اول پنل را فعال کن.');return}if(!('Notification' in window)||!('PushManager' in window)||!swReady){alert('این مرورگر اعلان وب را پشتیبانی نمی‌کند.');return}notifyBtn.disabled=true;notifyBtn.textContent='در حال فعال‌سازی...';try{let permission=Notification.permission;if(permission!=='granted')permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('permission');const reg=await swReady;if(!reg)throw new Error('sw');let sub=await reg.pushManager.getSubscription();if(!sub){const kr=await fetch(`${API}/push/public-key`,{cache:'no-store'}),kj=await kr.json();if(!kr.ok||!kj.publicKey)throw new Error('key');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(kj.publicKey)})}const r=await fetch(`${API}/push/subscribe/${encodeURIComponent(auth.specialistId)}?token=${encodeURIComponent(auth.accessToken)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())}),j=await r.json();if(!r.ok||!j.ok)throw new Error('subscribe');notifyBtn.textContent='اعلان روشن ✓';notifyBtn.classList.add('on');alert(j.testPushSent?'اعلان فعال شد؛ یک اعلان آزمایشی هم ارسال شد.':'اعلان فعال شد.')}catch(e){notifyBtn.textContent='فعال‌کردن اعلان';notifyBtn.classList.remove('on');alert(e.message==='permission'?'اجازه اعلان داده نشد.':'فعال‌سازی اعلان انجام نشد.')}finally{notifyBtn.disabled=false}};
async function load(){
  app.innerHTML='<div class="card loading">در حال بارگذاری ارجاع‌ها...</div>';
  if(!auth?.specialistId||!auth?.accessToken){app.innerHTML='<div class="card"><div class="err">این گوشی هنوز برای پنل متخصص فعال نشده است.</div><br><a class="btn" href="/activate-shahmoradi.html">فعال‌سازی پنل</a></div>';return}
  try{
    let r=await fetch(`${API}/specialists/${encodeURIComponent(auth.specialistId)}/dashboard?token=${encodeURIComponent(auth.accessToken)}`,{cache:'no-store'}),j=await r.json();
    if(!r.ok)throw new Error(j.error||'dashboard');
    let refs=j.referrals||[];
    app.innerHTML=`<div class="card"><div class="stats"><div class="stat"><span>کل ارجاع‌ها</span><b>${refs.length}</b></div><div class="stat"><span>جدید</span><b>${refs.filter(x=>x.status==='new').length}</b></div><div class="stat"><span>نوبت داده شده</span><b>${refs.filter(x=>x.status==='scheduled').length}</b></div></div></div><div class="card"><h2 style="font-size:16px;margin:0 0 5px">ارجاع‌ها</h2>${refs.length?refs.map(render).join(''):'<div class="empty mut">هنوز ارجاعی برای این پنل ثبت نشده است.</div>'}</div>`;
  }catch(e){app.innerHTML='<div class="card"><div class="err">پنل به حساب متخصص متصل نشد.</div><br><a class="btn" href="/activate-shahmoradi.html">فعال‌سازی دوباره</a></div>'}
}
function render(r){let p=r.payload||{},files=r.files||[];return `<div class="ref ${r.status==='new'?'new':''}"><h3>دندان ${esc(r.tooth)} — ${esc(r.referralType)}</h3><p><b>بیمار:</b> ${esc(r.patientName)} ${r.patientPhone?'• '+esc(r.patientPhone):''}</p><p><b>ارجاع‌دهنده:</b> ${esc(r.referringDoctor)} ${r.referringPhone?'• '+esc(r.referringPhone):''}</p>${p.problem?`<p><b>مشکل:</b> ${esc(p.problem)}</p>`:''}${p.workingDiagnosis?`<p><b>تشخیص/یافته:</b> ${esc(p.workingDiagnosis)}</p>`:''}${p.tests?`<p><b>یافته‌ها:</b> ${esc(p.tests)}</p>`:''}<p><b>فوریت:</b> ${esc(r.urgency)}</p>${p.instructions?`<p><b>توضیح:</b> ${esc(p.instructions)}</p>`:''}${files.map(f=>`<a class="fileLink" target="_blank" href="${API}/specialists/${encodeURIComponent(auth.specialistId)}/referrals/${encodeURIComponent(r.id)}/files/${encodeURIComponent(f.id)}?token=${encodeURIComponent(auth.accessToken)}">${esc(f.name)}</a>`).join('')}<select class="status" data-id="${esc(r.id)}"><option value="new" ${r.status==='new'?'selected':''}>جدید</option><option value="reviewed" ${r.status==='reviewed'?'selected':''}>بررسی شد</option><option value="contacted" ${r.status==='contacted'?'selected':''}>تماس گرفته شد</option><option value="scheduled" ${r.status==='scheduled'?'selected':''}>نوبت داده شد</option><option value="treated" ${r.status==='treated'?'selected':''}>درمان شد</option><option value="closed" ${r.status==='closed'?'selected':''}>بسته شد</option></select></div>`}
document.addEventListener('change',async e=>{if(!e.target.matches('.status'))return;const el=e.target;el.disabled=true;try{let r=await fetch(`${API}/specialists/${encodeURIComponent(auth.specialistId)}/referrals/${encodeURIComponent(el.dataset.id)}/status?token=${encodeURIComponent(auth.accessToken)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:el.value})});if(!r.ok)throw 0}catch(_){alert('وضعیت ذخیره نشد')}finally{el.disabled=false}});
load();updateNotifyState();
</script>
</body>
</html>
