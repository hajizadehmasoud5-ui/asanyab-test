<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پنل ارجاع دکتر شاهمرادی</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#101828;font-family:Tahoma,Arial,sans-serif}.w{max-width:760px;margin:auto;padding:18px}.hero{background:#0f1f38;color:#fff;border-radius:20px;padding:20px;margin-bottom:12px}.hero h1{margin:0 0 5px;font-size:22px}.hero p{margin:0;color:#d8e2ef;font-size:11px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:14px;margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:12px;padding:12px}.stat span{display:block;font-size:10px;color:#667085}.stat b{font-size:22px}.ref{border:1px solid #e4e7ec;border-radius:13px;padding:12px;margin-top:9px}.ref h3{font-size:14px;margin:0 0 6px}.ref p{font-size:11px;line-height:1.8;margin:4px 0;color:#475467}.status{width:100%;margin-top:8px;border:1px solid #d8dde5;border-radius:10px;padding:9px;background:#fff}.err{background:#fef3f2;color:#b42318;border-radius:12px;padding:12px}.ok{background:#ecfaf4;color:#126546;border-radius:12px;padding:12px}.btn{display:block;width:100%;border:0;border-radius:12px;background:#1769e0;color:#fff;padding:12px;font-weight:900;text-align:center;text-decoration:none}.mut{color:#667085;font-size:11px;line-height:1.8}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="hero"><h1>پنل ارجاع دکتر محسن شاهمرادی</h1><p>ارجاع‌های ثبت‌شده برای درمان ریشه</p></div><div id="app"><div class="card">در حال بارگذاری...</div></div></main><script>const API='/api/referral';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let auth=null;try{auth=JSON.parse(localStorage.getItem('drlinqReferralShahmoradi')||'null')}catch(e){};async function load(){if(!auth?.specialistId||!auth?.accessToken){app.innerHTML='<div class="card"><div class="err">پنل هنوز روی این مرورگر فعال نشده است.</div><br><a class="btn" href="/activate-shahmoradi.html">فعال‌سازی پنل</a></div>';return}try{let r=await fetch(`${API}/specialists/${encodeURIComponent(auth.specialistId)}/dashboard?token=${encodeURIComponent(auth.accessToken)}`,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'dashboard');let refs=j.referrals||[];app.innerHTML=`<div class="card"><div class="stats"><div class="stat"><span>کل ارجاع‌ها</span><b>${refs.length}</b></div><div class="stat"><span>جدید</span><b>${refs.filter(x=>x.status==='new').length}</b></div><div class="stat"><span>نوبت داده شده</span><b>${refs.filter(x=>x.status==='scheduled').length}</b></div></div></div><div class="card"><h2 style="font-size:17px;margin-top:0">ارجاع‌ها</h2>${refs.length?refs.map(render).join(''):'<p class="mut">هنوز ارجاعی ثبت نشده است.</p>'}</div>`}catch(e){app.innerHTML='<div class="card"><div class="err">پنل باز نشد. فعال‌سازی این مرورگر معتبر نیست.</div><br><a class="btn" href="/activate-shahmoradi.html">فعال‌سازی دوباره</a></div>'}}function render(r){let p=r.payload||{};return `<div class="ref"><h3>دندان ${esc(r.tooth)} — ${esc(r.referralType)}</h3><p><b>بیمار:</b> ${esc(r.patientName)} ${r.patientPhone?'• '+esc(r.patientPhone):''}</p><p><b>ارجاع‌دهنده:</b> ${esc(r.referringDoctor)}</p>${p.problem?`<p><b>مشکل:</b> ${esc(p.problem)}</p>`:''}${p.workingDiagnosis?`<p><b>تشخیص/یافته:</b> ${esc(p.workingDiagnosis)}</p>`:''}<p><b>فوریت:</b> ${esc(r.urgency)}</p><select class="status" data-id="${esc(r.id)}"><option value="new" ${r.status==='new'?'selected':''}>جدید</option><option value="reviewed" ${r.status==='reviewed'?'selected':''}>بررسی شد</option><option value="contacted" ${r.status==='contacted'?'selected':''}>تماس گرفته شد</option><option value="scheduled" ${r.status==='scheduled'?'selected':''}>نوبت داده شد</option><option value="treated" ${r.status==='treated'?'selected':''}>درمان شد</option><option value="closed" ${r.status==='closed'?'selected':''}>بسته شد</option></select></div>`}document.addEventListener('change',async e=>{if(!e.target.matches('.status'))return;try{await fetch(`${API}/specialists/${encodeURIComponent(auth.specialistId)}/referrals/${encodeURIComponent(e.target.dataset.id)}/status?token=${encodeURIComponent(auth.accessToken)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:e.target.value})})}catch(_){alert('ذخیره نشد')}});load();</script></body></html>
