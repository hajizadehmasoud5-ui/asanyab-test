<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دکتر لینک | پیدا کردن مرکز درمانی</title>
<meta name="description" content="خدمت، بیمه و شهر را انتخاب کنید و مراکز درمانی مرتبط را پیدا کنید.">
<link rel="canonical" href="https://drlinq.ir/">
<style>
:root{--navy:#12213a;--blue:#1769e0;--green:#13875f;--ink:#172033;--mut:#68738a;--line:#e4e9f1;--bg:#f5f7fa;--white:#fff;--shadow:0 14px 40px rgba(22,39,70,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1080px)/2));position:sticky;top:0;z-index:10}.brand{font-size:25px;font-weight:900}.brand b{color:var(--blue)}.status{font-size:11px;color:var(--mut)}.dot{width:8px;height:8px;border-radius:50%;background:#c8ced7;display:inline-block;margin-left:6px}.dot.ok{background:#22a06b}
.hero{background:linear-gradient(145deg,var(--navy),#1c355c);color:#fff;padding:58px 18px 72px}.shell{max-width:1080px;margin:auto}.intro{text-align:center;margin-bottom:28px}.intro h1{font-size:36px;margin:0 0 10px}.intro p{margin:0;color:#d8e2f0;font-size:13px;line-height:2}
.search{background:#fff;border-radius:22px;padding:18px;box-shadow:0 22px 55px #0003;color:var(--ink)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{border:1px solid var(--line);border-radius:15px;padding:10px 12px;background:#fff}.field label{display:block;font-size:10px;font-weight:800;color:var(--mut);margin-bottom:6px}.field select{width:100%;border:0;background:transparent;outline:0;font:inherit;font-size:13px;color:var(--ink)}.go{margin-top:12px;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:14px;font-weight:900;cursor:pointer}.go:disabled{opacity:.55;cursor:not-allowed}.hint{font-size:10px;color:var(--mut);margin-top:9px;text-align:center}
.results{max-width:1080px;margin:26px auto 70px;padding:0 18px}.resultHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.resultHead h2{font-size:20px;margin:0}.count{font-size:11px;color:var(--mut)}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 5px 18px rgba(20,40,70,.04)}.name{font-size:16px;font-weight:900;margin-bottom:8px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}.pill{font-size:9px;padding:6px 8px;border-radius:999px;background:#f1f4f8;color:#4d5b70}.verified{background:#edf9f4;color:#08734c}.addr{font-size:11px;color:var(--mut);line-height:1.9}.actions{display:flex;gap:8px;margin-top:11px}.actions a{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 12px;font-size:10px;font-weight:800}.call{background:#eef5ff;color:#0c5dbe}.source{background:#f4f5f7;color:#475467}.empty,.loading,.error{background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px;text-align:center;color:var(--mut);font-size:12px}.error{color:#b42318}
@media(max-width:760px){.steps{grid-template-columns:1fr 1fr}.intro h1{font-size:29px}}
@media(max-width:480px){.steps{grid-template-columns:1fr}.hero{padding-top:38px}.top{height:60px}}
</style>
</head>
<body>
<header class="top"><div class="brand">دکتر<b>لینک</b></div><div class="status"><span id="dot" class="dot"></span><span id="apiStatus">در حال اتصال به بانک</span></div></header>
<section class="hero"><div class="shell"><div class="intro"><h1>کجا برای درمان بروم؟</h1><p>خدمت، بیمه و محل را انتخاب کنید؛ دکتر لینک مراکز ثبت‌شده در بانک واقعی را نشان می‌دهد.</p></div>
<div class="search"><div class="steps">
<div class="field"><label>۱. چه خدمتی می‌خواهید؟</label><select id="service"><option value="">انتخاب خدمت</option><option>دندانپزشکی</option><option>آزمایشگاه</option><option>داروخانه</option></select></div>
<div class="field"><label>۲. بیمه یا آزاد؟</label><select id="insurer"><option value="">انتخاب بیمه</option><option value="__free__">آزاد / بدون فیلتر بیمه</option></select></div>
<div class="field"><label>۳. استان</label><select id="province"><option value="">انتخاب استان</option></select></div>
<div class="field"><label>۴. شهر</label><select id="city" disabled><option value="">ابتدا استان را انتخاب کنید</option></select></div>
</div><button id="searchBtn" class="go">نمایش مراکز واقعی</button><div class="hint">اطلاعات بیمه‌ای از منابع ثبت‌شده در بانک DrLinq نمایش داده می‌شود.</div></div></div></section>
<main class="results"><div class="resultHead"><h2>نتایج</h2><div id="count" class="count"></div></div><div id="cards" class="cards"><div class="empty">چهار انتخاب بالا را انجام دهید.</div></div></main>
<script>
const API='https://n8n.drlinq.ir/bank';
const $=id=>document.getElementById(id);
function opt(select,value,text){const o=document.createElement('option');o.value=value;o.textContent=text;select.appendChild(o)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function jget(path){const r=await fetch(API+path,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function init(){try{const f=await jget('/filters');$('dot').classList.add('ok');$('apiStatus').textContent='بانک DrLinq متصل است';for(const x of f.insurers||[])opt($('insurer'),x,x);for(const x of f.provinces||[])opt($('province'),x,x)}catch(e){$('apiStatus').textContent='خطا در اتصال به بانک';$('cards').innerHTML='<div class="error">اتصال به بانک برقرار نشد. صفحه را دوباره بارگذاری کنید.</div>'}}
$('province').addEventListener('change',async()=>{const p=$('province').value;$('city').innerHTML='';if(!p){$('city').disabled=true;opt($('city'),'','ابتدا استان را انتخاب کنید');return}opt($('city'),'','در حال دریافت شهرها...');$('city').disabled=true;try{const f=await jget('/filters?province='+encodeURIComponent(p));$('city').innerHTML='';opt($('city'),'','انتخاب شهر');for(const x of f.cities||[])opt($('city'),x,x);$('city').disabled=false}catch(e){$('city').innerHTML='';opt($('city'),'','خطا در دریافت شهرها')}});
$('searchBtn').addEventListener('click',search);
async function search(){const service=$('service').value,ins=$('insurer').value,province=$('province').value,city=$('city').value;if(!service||!ins||!province||!city){$('cards').innerHTML='<div class="empty">لطفاً خدمت، بیمه/آزاد، استان و شهر را کامل انتخاب کنید.</div>';return}$('searchBtn').disabled=true;$('cards').innerHTML='<div class="loading">در حال جستجو در بانک واقعی DrLinq...</div>';$('count').textContent='';let q='?service='+encodeURIComponent(service)+'&province='+encodeURIComponent(province)+'&city='+encodeURIComponent(city)+'&limit=100';if(ins!=='__free__')q+='&insurer='+encodeURIComponent(ins);try{const d=await jget('/providers'+q);const raw=d.items||[];const map=new Map();for(const x of raw){const key=(x.id||'')+'|'+(x.address||'');if(!map.has(key))map.set(key,{...x,insurers:new Set()});if(x.insurer)map.get(key).insurers.add(x.insurer)}const rows=[...map.values()];$('count').textContent=rows.length+' مرکز';if(!rows.length){$('cards').innerHTML='<div class="empty">برای این ترکیب هنوز مرکز ثبت‌شده‌ای پیدا نشد.</div>';return}$('cards').innerHTML=rows.map(x=>{const verified=x.confidence==='official';const insText=[...x.insurers].join('، ');const phone=x.phone||'';return `<article class="card"><div class="name">${esc(x.name)}</div><div class="meta"><span class="pill">${esc(x.provider_type||service)}</span>${insText?`<span class="pill">${esc(insText)}</span>`:''}${verified?'<span class="pill verified">تأیید رسمی</span>':''}<span class="pill">${esc([x.province,x.city,x.district].filter(Boolean).join('، '))}</span></div><div class="addr">${esc(x.address||'آدرس در بانک ثبت نشده')}</div><div class="actions">${phone?`<a class="call" href="tel:${esc(phone)}">تماس: ${esc(phone)}</a>`:''}${x.source_url?`<a class="source" target="_blank" rel="noopener" href="${esc(x.source_url)}">منبع اطلاعات</a>`:''}</div></article>`}).join('')}catch(e){$('cards').innerHTML='<div class="error">خطا در دریافت نتایج واقعی. دوباره تلاش کنید.</div>'}finally{$('searchBtn').disabled=false}}
init();
</script>
</body></html>
