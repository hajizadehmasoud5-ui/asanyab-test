<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آسان‌یاب</title>
<style>body{font-family:Tahoma;background:#f5f5f5;margin:0;color:#222}.w{max-width:820px;margin:auto;padding:24px}.box,.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 4px 18px #0001}select,button{padding:13px;border-radius:10px;border:1px solid #ddd;font-size:16px;margin:4px}button{background:#111;color:#fff;border:0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.offer{font-weight:bold;background:#f0f0f0;padding:8px;border-radius:8px;display:inline-block}small{color:#777}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style></head>
<body><div class="w"><div class="box"><h1>آسان‌یاب</h1><p>نزدیک‌ترین رستوران و فست‌فود اطرافت را پیدا کن</p>
<select id="kind"><option value="همه">همه</option><option value="رستوران ایرانی">رستوران</option><option value="فست‌فود">فست‌فود</option></select>
<select><option>اهواز</option></select>
<select id="area"><option value="">منطقه</option><option>کیانپارس</option><option>کیانشهر</option><option>گلستان</option><option>زیتون کارمندی</option><option>پادادشهر</option><option>امانیه</option><option>لشکرآباد</option></select>
<button onclick="go()">جستجو</button></div><div id="out"></div><small>نسخه آزمایشی: نام، شماره، آدرس و آفرها ساختگی‌اند.</small></div>
<script>const d={"کیانپارس": [["رستوران نمونه آفتاب", "رستوران ایرانی", "کیانپارس، خیابان نمونه ۱", "061-00000001", "۱۰٪ تخفیف امروز"], ["فست‌فود نمونه تندیس", "فست‌فود", "کیانپارس، خیابان نمونه ۲", "061-00000002", "نوشیدنی رایگان"]], "کیانشهر": [["رستوران نمونه نخل", "رستوران ایرانی", "کیانشهر، خیابان نمونه ۱", "061-00000011", "۱۵٪ تخفیف پکیج دو نفره"], ["فست‌فود نمونه برگرینو", "فست‌فود", "کیانشهر، خیابان نمونه ۲", "061-00000012", "سیب‌زمینی رایگان"]], "گلستان": [["رستوران نمونه زعفران", "رستوران ایرانی", "گلستان، خیابان نمونه ۱", "061-00000021", "۱۰٪ تخفیف"], ["فست‌فود نمونه پاپریکا", "فست‌فود", "گلستان، خیابان نمونه ۲", "061-00000022", "غذای دوم ۳۰٪ ارزان‌تر"]], "زیتون کارمندی": [["رستوران نمونه چاشنی", "رستوران ایرانی", "زیتون کارمندی، خیابان نمونه ۱", "061-00000031", "دسر رایگان"], ["فست‌فود نمونه فایر", "فست‌فود", "زیتون کارمندی، خیابان نمونه ۲", "061-00000032", "۱۲٪ تخفیف امروز"]], "پادادشهر": [["رستوران نمونه دیگ", "رستوران ایرانی", "پادادشهر، خیابان نمونه ۱", "061-00000041", "ارسال رایگان"], ["فست‌فود نمونه بوم", "فست‌فود", "پادادشهر، خیابان نمونه ۲", "061-00000042", "نوشابه رایگان"]], "امانیه": [["رستوران نمونه سنتی کارون", "رستوران ایرانی", "امانیه، خیابان نمونه ۱", "061-00000051", "۱۰٪ تخفیف امروز"], ["فست‌فود نمونه هات‌چیکن", "فست‌فود", "امانیه، خیابان نمونه ۲", "061-00000052", "پیش‌غذا رایگان"]], "لشکرآباد": [["فلافل نمونه جنوب", "فست‌فود", "لشکرآباد، خیابان نمونه ۱", "061-00000061", "نوشیدنی رایگان"], ["رستوران نمونه اهواز", "رستوران ایرانی", "لشکرآباد، خیابان نمونه ۲", "061-00000062", "۱۵٪ تخفیف حضوری"]]};function go(){let a=document.getElementById('area').value,k=document.getElementById('kind').value,o=document.getElementById('out');if(!a){o.innerHTML='<div class="box">منطقه را انتخاب کن.</div>';return}let x=d[a]||[];if(k!='همه')x=x.filter(r=>r[1]==k);o.innerHTML='<div class="cards">'+x.map(r=>`<div class="card"><small>نمونه آزمایشی</small><h3>${r[0]}</h3><p>${r[1]}<br>${r[2]}<br>${r[3]}</p><span class="offer">آفر امروز: ${r[4]}</span><br><button style="margin-top:12px" onclick="alert('در نسخه بعدی آفر فعال می‌شود')">گرفتن آفر امروز</button></div>`).join('')+'</div>'}</script></body></html>
