<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlanOffer | ورود از نشان</title><style>body{margin:0;background:#f6f7f8;font-family:Tahoma,Arial,sans-serif;color:#171717}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;font-size:19px}.brand b{color:#ff6a00}.back{background:#111;color:#fff;text-decoration:none;padding:9px 11px;border-radius:11px;font-size:11px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:19px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}input,select,button{font:inherit;width:100%;min-height:45px;border-radius:11px}input,select{border:1px solid #ddd;padding:0 10px;background:#fff}button{border:0;background:#ff6a00;color:#fff;font-weight:900}.secondary{background:#111}.results{display:grid;gap:9px}.item{border:1px solid #e8e8e8;border-radius:14px;padding:12px}.item h3{margin:0 0 6px;font-size:15px}.meta{font-size:10px;color:#666;line-height:1.9}.actions{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:9px}.actions button:last-child{width:auto;padding:0 12px}.status{font-size:11px;background:#f3f3f3;border-radius:11px;padding:9px;margin-top:9px}.note{font-size:10px;color:#777;line-height:1.9}@media(max-width:650px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">الان<b>آفر</b> · ورود از نشان</div><a class="back" href="index.html">سایت</a></div><div class="card"><div class="note">این ابزار فقط بعد از فعال‌شدن Search API نشان و راه‌اندازی بک‌اند کار می‌کند. نتیجه‌های نشان خودکار منتشر نمی‌شوند؛ فقط با تأیید مدیر وارد بانک AlanOffer می‌شوند.</div><div class="grid" style="margin-top:10px"><input id="term" placeholder="مثلاً دندانپزشکی کیانپارس"><select id="topCat" onchange="renderSubs()"></select><select id="subCat"></select></div><div class="grid" style="margin-top:8px"><input id="lat" value="31.3183" inputmode="decimal"><input id="lng" value="48.6706" inputmode="decimal"><input id="token" type="password" placeholder="Admin Token"></div><button style="margin-top:9px" onclick="searchNeshan()">جست‌وجو در نشان</button><div id="statusBox" class="status">آماده جست‌وجو</div></div><div class="card"><b>نتایج نشان</b><div id="results" class="results" style="margin-top:10px"></div></div></div><script src="api-client.js"></script><script src="business-categories.js"></script><script>let found=[];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderTop(){topCat.innerHTML=AlanBiz.topOptions().map(x=>`<option value="${x.key}">${x.icon} ${x.label}</option>`).join('');topCat.value='health';renderSubs();subCat.value='dentist'}function renderSubs(){subCat.innerHTML=AlanBiz.subOptions(topCat.value).map(x=>`<option value="${x.key}">${x.label}</option>`).join('')}async function searchNeshan(){if(!AlanApi.configured()){statusBox.textContent='ابتدا بک‌اند را در صفحه دیتابیس مشترک تنظیم کن.';return}if(!term.value.trim()){statusBox.textContent='عبارت جست‌وجو را وارد کن.';return}statusBox.textContent='در حال جست‌وجو…';results.innerHTML='';try{const r=await AlanApi.neshanSearch({term:term.value.trim(),lat:lat.value,lng:lng.value});found=r.items||[];statusBox.textContent=`${found.length.toLocaleString('fa-IR')} نتیجه دریافت شد`;renderResults()}catch(e){statusBox.textContent=e.status===503?'Search API نشان هنوز روی سرور فعال نشده است.':'جست‌وجو انجام نشد.'}}function areaOf(x){return x.neighbourhood||x.region||'اهواز'}function renderResults(){results.innerHTML=found.length?found.map((x,i)=>`<div class="item"><h3>${esc(x.title||'بدون نام')}</h3><div class="meta">📍 ${esc(x.address||'آدرس ثبت نشده')}<br>${esc(x.neighbourhood||'')} ${x.category?' · '+esc(x.category):''}<br>${Number.isFinite(x.lat)?x.lat.toFixed(6):''}, ${Number.isFinite(x.lng)?x.lng.toFixed(6):''}</div><div class="actions"><button onclick="importOne(${i})">افزودن به بانک AlanOffer</button><button class="secondary" onclick="window.open('https://nshn.ir/?lat=${x.lat}&lng=${x.lng}','_blank')">نقشه</button></div></div>`).join(''):'<div class="note">نتیجه‌ای نیست.</div>'}async function importOne(i){const x=found[i];if(!x)return;const t=token.value.trim();if(!t){alert('Admin Token را وارد کن.');return}const rec={name:x.title,top:topCat.value,sub:subCat.value,city:'اهواز',area:areaOf(x),address:x.address||areaOf(x),lat:x.lat,lng:x.lng,source:'neshan',sourceRef:x.id||''};try{await AlanApi.adminAddBusiness(rec,t);statusBox.textContent='✓ '+x.title+' وارد بانک شد.'}catch(e){statusBox.textContent=e.status===401?'Admin Token نادرست است.':'ورود این کسب‌وکار انجام نشد.'}}renderTop();</script></body></html>
