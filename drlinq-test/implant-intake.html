<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دکترلینک | ارزیابی اولیه ایمپلنت</title>
<style>
:root{--p:#1558a6;--ink:#17202a;--mut:#667085;--line:#e4e9f0;--soft:#f5f9ff;--ok:#147a4b;--bg:#f5f7fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.app{max-width:680px;min-height:100svh;margin:auto;background:#fff}.top{position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:900}.brand b{color:var(--p)}.step{font-size:11px;color:var(--mut)}.progress{height:5px;background:#edf1f5;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--p);transition:.2s}.wrap{padding:14px 14px 118px}.stage{min-height:calc(100svh - 160px);display:flex;flex-direction:column;justify-content:center}.stage.long{justify-content:flex-start}.intro{text-align:center;margin-bottom:14px}.intro h1{font-size:25px;line-height:1.55;margin:0 0 8px}.intro p{font-size:14px;line-height:1.9;color:var(--mut);margin:0}.card{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff;margin:9px 0;box-shadow:0 4px 18px #00000007}.choice{width:100%;border:1px solid #d8dee7;background:#fff;border-radius:16px;padding:16px 13px;font:inherit;font-size:14px;line-height:1.65;text-align:right;cursor:pointer}.choice.on{border-color:#75a8db;background:#edf6ff;color:#0b4d95;font-weight:700}.choices{display:grid;gap:9px}.subchoices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.label{display:block;font-size:13px;font-weight:700;margin:13px 0 8px}.notice{border:1px solid #d8e7f7;background:#f7fbff;border-radius:16px;padding:12px;font-size:12px;line-height:1.9;margin:9px 0}.mut{font-size:11px;color:var(--mut);line-height:1.8}.jawmain{display:grid;grid-template-columns:1fr 1fr;gap:10px}.jawmain .choice{text-align:center;font-size:16px;padding:19px 8px}.jawparts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.jawparts .choice{text-align:center;padding:14px 5px}.mouthchart{margin-top:13px;border:1px solid var(--line);border-radius:18px;background:#fbfcfe;padding:12px}.mouthchart h3{font-size:12px;text-align:center;margin:0 0 7px}.arch{display:flex;justify-content:center;gap:3px;direction:ltr;margin:7px 0}.tooth{width:24px;height:36px;border:1px solid #cfd8e3;background:#fff;border-radius:10px 10px 14px 14px;cursor:pointer;transition:.15s}.tooth:nth-child(1),.tooth:nth-child(16){height:30px;margin-top:8px}.tooth:nth-child(2),.tooth:nth-child(15){height:32px;margin-top:6px}.tooth:nth-child(3),.tooth:nth-child(14){height:34px;margin-top:4px}.tooth:nth-child(4),.tooth:nth-child(13){height:35px;margin-top:2px}.tooth.on{background:#dceeff;border-color:#4f91d2;box-shadow:inset 0 0 0 2px #fff}.lower .tooth{border-radius:14px 14px 9px 9px}.healthgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.healthgrid .choice{font-size:12px;padding:13px 9px}.input,.text{width:100%;border:1px solid #d4dce6;border-radius:15px;padding:13px;font:inherit;font-size:13px;outline:0;background:#fff}.text{min-height:92px;resize:vertical}.upload-row{display:grid;grid-template-columns:42% 58%;gap:10px;align-items:stretch;border:1px solid var(--line);border-radius:18px;padding:9px;margin:10px 0;background:#fff;min-height:150px}.samplebox{border-radius:13px;overflow:hidden;background:#eef2f7;display:flex;align-items:center;justify-content:center;min-height:130px}.samplebox img{width:100%;height:100%;object-fit:cover;display:block}.samplebox svg{width:100%;height:100%;min-height:130px}.uploadside{display:flex;flex-direction:column;justify-content:center;gap:7px}.uploadside b{font-size:13px}.uploadside p{font-size:10px;color:var(--mut);line-height:1.6;margin:0}.fileinput{display:none}.uploadbtn{display:block;width:100%;border:1px solid #8ab3dd;background:#edf6ff;color:#0b4d95;border-radius:13px;padding:11px 8px;font:inherit;font-size:11px;font-weight:700;text-align:center;cursor:pointer}.secondary{border-color:#d8dee7;background:#fff;color:#344054}.statusopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{border:1px solid #d8dee7;background:#fff;border-radius:11px;padding:8px 4px;font:inherit;font-size:9px;cursor:pointer}.mini.on{border-color:#80acd9;background:#edf6ff;color:#0b4d95}.statusline{font-size:10px;color:var(--ok);font-weight:700}.summary{background:#fbfdff}.sumrow{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:11px;line-height:1.8}.sumrow:last-child{border:0}.done{border:1px solid #cfe8da;background:#f4fbf7;color:#165c3c;border-radius:16px;padding:13px;font-size:12px;line-height:1.9}.consent{display:flex;gap:8px;align-items:flex-start;font-size:10px;line-height:1.8;margin-top:12px}.sticky{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin:auto;padding:24px 14px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;background:linear-gradient(transparent,#fff 24%);z-index:9}.btn{border:0;border-radius:15px;padding:14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.primary{flex:1;background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:#344054}.hidden{display:none!important}@media(max-width:390px){.intro h1{font-size:23px}.choice{font-size:13px;padding:14px 11px}.healthgrid{grid-template-columns:1fr}.upload-row{grid-template-columns:41% 59%;gap:8px}.uploadside b{font-size:12px}.tooth{width:20px;height:33px}}
</style></head>
<body><div class="app"><header class="top"><div class="toprow"><div class="brand">دکتر<b>لینک</b></div><div id="step" class="step"></div></div><div class="progress"><i id="bar"></i></div></header><main class="wrap"><div id="root"></div></main><div class="sticky"><button id="back" class="btn ghost hidden">قبلی</button><button id="next" class="btn primary">ادامه</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),root=$('root'),stepEl=$('step'),bar=$('bar'),next=$('next'),back=$('back'),KEY='drlinq_implant_pilot_v2';
const fresh={problem:'',missingCount:'',jaw:'',jawPart:'',teeth:[],medical:{},diseaseText:'',medText:'',records:{opg:'',cbct:''},photos:{front:'',upper:'',lower:'',right:'',left:''},question:'',name:'',mobile:'',city:'اهواز',consent:false};let s=Object.assign({},fresh,JSON.parse(localStorage.getItem(KEY)||'{}'));s.medical=Object.assign({},fresh.medical,s.medical||{});s.records=Object.assign({},fresh.records,s.records||{});s.photos=Object.assign({},fresh.photos,s.photos||{});let n=0;
const steps=[['برای چه مشکلی می‌خواهید ایمپلنت انجام دهید؟','گزینه‌ای را انتخاب کنید که دقیق‌تر شبیه وضعیت شماست.'],['محل مشکل کجاست؟','اول فک را انتخاب کنید؛ اگر خواستید می‌توانید روی دندان هم علامت بزنید.'],['چند سؤال درباره سلامتی شما','نام بیماری و داروها را هم می‌توانید پایین صفحه بنویسید.'],['عکس‌های رادیوگرافی','برای بررسی دقیق‌تر، اگر OPG یا CBCT دارید ارسال کنید.'],['عکس‌های داخل دهان','نمونه را ببینید و همان زاویه را با دوربین بگیرید یا از گوشی انتخاب کنید.'],['سؤال اصلی و تماس','سؤال اصلی خودتان و اطلاعات تماس را وارد کنید.'],['خلاصه پرونده','این خلاصه برای مرور دندانپزشک آماده می‌شود.']];
const problems=['دندان از دست رفته دارم','دندان مصنوعی دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان لق دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان شکسته یا خراب دارم و می‌خواهم با ایمپلنت جایگزین کنم','ایمپلنت قبلی‌ام مشکل دارد و می‌خواهم بررسی شود'];const counts=['۱ دندان','۲ تا ۳ دندان','چند دندان','نیم‌فک','فک کامل'];const medical=[['diabetes','دیابت'],['heart','بیماری قلبی یا فشار خون'],['blood','داروی رقیق‌کننده خون'],['smoke','سیگار یا قلیان'],['osteo','پوکی استخوان'],['bone','داروی مربوط به استخوان/پوکی استخوان'],['cancer','سرطان یا شیمی‌درمانی'],['radiation','پرتودرمانی سر و گردن'],['allergy','حساسیت دارویی'],['other','بیماری مهم دیگر'],['regular','داروی دائمی مصرف می‌کنم']];
const OPG='https://imaging.heartofengland.nhs.uk/wp-content/uploads/2017/01/OPG.jpg',CBCT='https://www.smileolympia.com/wp-content/uploads/2022/10/CBCT-_Jaw_Scan.jpg';
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function choice(v,cur,key){return `<button class="choice ${cur===v?'on':''}" ${key}="${esc(v)}">${esc(v)}</button>`}function intro(){return `<div class="intro"><h1>${steps[n][0]}</h1><p>${steps[n][1]}</p></div>`}
function render(){stepEl.textContent=`مرحله ${n+1} از ${steps.length}`;bar.style.width=((n+1)/steps.length*100)+'%';back.classList.toggle('hidden',n===0);next.textContent=n===steps.length-1?'پایان':'ادامه';root.innerHTML=`<section class="stage ${n===3||n===4||n===6?'long':''}">${intro()}${[screenProblem,screenLocation,screenHealth,screenRecords,screenPhotos,screenContact,screenSummary][n]()}</section>`;bind()}
function screenProblem(){return `<div class="card"><div class="choices">${problems.map(v=>choice(v,s.problem,'data-problem')).join('')}</div>${s.problem==='دندان از دست رفته دارم'?`<label class="label">تقریباً چند دندان؟</label><div class="subchoices">${counts.map(v=>choice(v,s.missingCount,'data-count')).join('')}</div>`:''}</div>`}
function arch(cls){return `<div class="arch ${cls}">${Array.from({length:16},(_,i)=>`<button aria-label="دندان" class="tooth ${s.teeth.includes(cls+'-'+i)?'on':''}" data-tooth="${cls}-${i}"></button>`).join('')}</div>`}function screenLocation(){return `<div class="card"><div class="jawmain">${choice('فک بالا',s.jaw,'data-jaw')}${choice('فک پایین',s.jaw,'data-jaw')}</div>${s.jaw?`<div class="jawparts">${['کامل','سمت راست','سمت چپ'].map(v=>choice(v,s.jawPart,'data-part')).join('')}</div>`:''}</div><div class="mouthchart"><h3>انتخاب روی تصویر (اختیاری)</h3><div class="mut" style="text-align:center">اگر محل دقیق را می‌دانید، روی دندان موردنظر بزنید. لازم نیست شماره دندان را بدانید.</div>${arch('upper')}${arch('lower')}</div>`}
function screenHealth(){return `<div class="card"><div class="healthgrid">${medical.map(([k,t])=>`<button class="choice ${s.medical[k]?'on':''}" data-med="${k}">${t}</button>`).join('')}</div><label class="label">نام بیماری یا توضیح کوتاه</label><textarea id="diseaseText" class="text" placeholder="مثلاً دیابت دارم، فشار خون دارم...">${esc(s.diseaseText)}</textarea><label class="label">نام داروهایی که مصرف می‌کنید</label><textarea id="medText" class="text" placeholder="مثلاً متفورمین، آسپرین...">${esc(s.medText)}</textarea></div>`}
function evidence(k,title,desc,img){const st=s.records[k]||'';return `<div class="upload-row"><div class="samplebox"><img src="${img}" alt="نمونه ${title}" onerror="this.style.display='none';this.parentNode.innerHTML='<b style=&quot;font-size:12px&quot;>نمونه ${title}</b>'"></div><div class="uploadside"><b>${title}</b><p>${desc}</p><label class="uploadbtn" for="file-${k}">انتخاب فایل</label><input class="fileinput" id="file-${k}" type="file" accept="image/*,.pdf" data-record-file="${k}"><div class="statusopts"><button class="mini ${st==='ندارم'?'on':''}" data-record-status="${k}|ندارم">ندارم</button><button class="mini ${st==='الان در دسترسم نیست'?'on':''}" data-record-status="${k}|الان در دسترسم نیست">الان در دسترسم نیست</button></div>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}function screenRecords(){return `<div class="notice"><b>این تصاویر اجباری نیستند.</b><br>هرچه اطلاعات کامل‌تر باشد، امکان بررسی اولیه دقیق‌تر بیشتر می‌شود. اگر ندارید، بدون مشکل ادامه دهید.</div>${evidence('opg','OPG (عکس پانورامیک)','نمای کلی فک و دندان‌ها.',OPG)}${evidence('cbct','CBCT (عکس سه‌بعدی)','اگر قبلاً گرفته‌اید، ارسال کنید.',CBCT)}`}
function mouthSvg(kind){if(kind==='upper'||kind==='lower')return `<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="#f6d3d7"/><path d="M20 ${kind==='upper'?75:45} Q80 ${kind==='upper'?18:102} 140 ${kind==='upper'?75:45}" fill="none" stroke="#d28f97" stroke-width="20" stroke-linecap="round"/>${Array.from({length:9},(_,i)=>{const x=35+i*11,y=kind==='upper'?50+Math.abs(4-i)*3:70-Math.abs(4-i)*3;return `<rect x="${x}" y="${y}" width="10" height="18" rx="4" fill="white" stroke="#d5d9df"/>`}).join('')}</svg>`;if(kind==='right'||kind==='left')return `<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="#f7d8dc"/><path d="M16 60 Q80 ${kind==='right'?30:90} 145 60" stroke="#c77f88" stroke-width="22" fill="none"/><g fill="white" stroke="#d5d9df">${Array.from({length:7},(_,i)=>`<rect x="${32+i*15}" y="${kind==='right'?44+i%2*5:58-i%2*5}" width="14" height="23" rx="4"/>`).join('')}</g></svg>`;return `<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="#f6d3d7"/><rect x="12" y="35" width="136" height="50" rx="24" fill="#b94f5f"/><g fill="white" stroke="#d5d9df">${Array.from({length:8},(_,i)=>`<rect x="${31+i*12}" y="43" width="11" height="27" rx="4"/>`).join('')}</g></svg>`}function photoRow(k,titleTxt){const st=s.photos[k]||'';return `<div class="upload-row"><div class="samplebox">${mouthSvg(k)}</div><div class="uploadside"><b>${titleTxt}</b><p>عکس شما تا حد امکان شبیه نمونه باشد.</p><label class="uploadbtn" for="camera-${k}">📷 عکس بگیر</label><input class="fileinput" id="camera-${k}" type="file" accept="image/*" capture="environment" data-photo-file="${k}"><label class="uploadbtn secondary" for="gallery-${k}">انتخاب از گوشی</label><input class="fileinput" id="gallery-${k}" type="file" accept="image/*" data-photo-file="${k}"><button class="mini ${st==='الان نمی‌توانم'?'on':''}" data-photo-skip="${k}">الان نمی‌توانم</button>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}function screenPhotos(){return `<div class="notice"><b>برای پاسخ دقیق‌تر، این ۵ زاویه کمک زیادی می‌کنند.</b><br>هر تعداد که می‌توانید ارسال کنید؛ نداشتن عکس مانع ادامه نیست.</div>${photoRow('front','۱. روبه‌رو')}${photoRow('upper','۲. فک بالا')}${photoRow('lower','۳. فک پایین')}${photoRow('right','۴. سمت راست بیمار')}${photoRow('left','۵. سمت چپ بیمار')}`}
function screenContact(){return `<div class="card"><label class="label">مهم‌ترین سؤال شما از دندانپزشک چیست؟</label><textarea id="question" class="text" placeholder="مثلاً آیا برای ایمپلنت من استخوان کافی وجود دارد؟">${esc(s.question)}</textarea><label class="label">نام و نام خانوادگی</label><input id="name" class="input" value="${esc(s.name)}"><label class="label">شماره موبایل</label><input id="mobile" class="input" inputmode="tel" value="${esc(s.mobile)}"><label class="label">شهر</label><input id="city" class="input" value="${esc(s.city)}"></div>`}
function selectedMedical(){const a=medical.filter(([k])=>s.medical[k]).map(([,t])=>t);return a.length?a.join('، '):'موردی انتخاب نشده'}function fileCount(o){return Object.values(o).filter(v=>v&&v!=='الان نمی‌توانم').length}function screenSummary(){return `<div class="done">پرونده اولیه آماده مرور است.</div><div class="card summary"><div class="sumrow"><b>دلیل مراجعه</b><span>${esc(s.problem)}${s.missingCount?' · '+esc(s.missingCount):''}</span></div><div class="sumrow"><b>محل</b><span>${esc(s.jaw)}${s.jawPart?' · '+esc(s.jawPart):''}</span></div><div class="sumrow"><b>سلامتی</b><span>${esc(selectedMedical())}${s.diseaseText?'<br>'+esc(s.diseaseText):''}${s.medText?'<br>داروها: '+esc(s.medText):''}</span></div><div class="sumrow"><b>رادیوگرافی</b><span>OPG: ${esc(s.records.opg||'ثبت نشده')}<br>CBCT: ${esc(s.records.cbct||'ثبت نشده')}</span></div><div class="sumrow"><b>عکس‌های داخل دهان</b><span>${fileCount(s.photos)} مورد ثبت شده</span></div><div class="sumrow"><b>سؤال بیمار</b><span>${esc(s.question||'—')}</span></div><div class="sumrow"><b>تماس</b><span>${esc(s.name||'—')} · ${esc(s.mobile||'—')} · ${esc(s.city||'—')}</span></div></div><label class="consent"><input id="consent" type="checkbox" ${s.consent?'checked':''}><span>اجازه می‌دهم این اطلاعات برای بررسی اولیه در اختیار دندانپزشک قرار گیرد.</span></label><div class="notice">نسخه آزمایشی: فعلاً اطلاعات واقعاً برای پزشک ارسال نمی‌شود.</div>`}
function bind(){document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>{s.problem=b.dataset.problem;if(s.problem!=='دندان از دست رفته دارم')s.missingCount='';save();render()});document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{s.missingCount=b.dataset.count;save();render()});document.querySelectorAll('[data-jaw]').forEach(b=>b.onclick=()=>{s.jaw=b.dataset.jaw;s.jawPart='';save();render()});document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{s.jawPart=b.dataset.part;save();render()});document.querySelectorAll('[data-tooth]').forEach(b=>b.onclick=()=>{const v=b.dataset.tooth,i=s.teeth.indexOf(v);i>-1?s.teeth.splice(i,1):s.teeth.push(v);save();render()});document.querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>{s.medical[b.dataset.med]=!s.medical[b.dataset.med];save();render()});['diseaseText','medText','question','name','mobile','city'].forEach(id=>{const x=$(id);if(x)x.oninput=()=>{s[id]=x.value;save()}});document.querySelectorAll('[data-record-file]').forEach(i=>i.onchange=e=>{if(e.target.files[0]){s.records[i.dataset.recordFile]='فایل انتخاب شد';save();render()}});document.querySelectorAll('[data-record-status]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.recordStatus.split('|');s.records[k]=v;save();render()});document.querySelectorAll('[data-photo-file]').forEach(i=>i.onchange=e=>{if(e.target.files[0]){s.photos[i.dataset.photoFile]='عکس انتخاب شد';save();render()}});document.querySelectorAll('[data-photo-skip]').forEach(b=>b.onclick=()=>{s.photos[b.dataset.photoSkip]='الان نمی‌توانم';save();render()});const c=$('consent');if(c)c.onchange=()=>{s.consent=c.checked;save()}}
function valid(){if(n===0&&!s.problem){alert('لطفاً یک گزینه را انتخاب کنید.');return false}if(n===0&&s.problem==='دندان از دست رفته دارم'&&!s.missingCount){alert('لطفاً تعداد تقریبی دندان‌ها را انتخاب کنید.');return false}if(n===1&&(!s.jaw||!s.jawPart)){alert('لطفاً فک و محل را انتخاب کنید.');return false}if(n===5&&(!s.name.trim()||!s.mobile.trim())){alert('لطفاً نام و شماره موبایل را وارد کنید.');return false}if(n===6&&!s.consent){alert('برای پایان، اجازه بررسی اطلاعات را تأیید کنید.');return false}return true}
next.onclick=()=>{if(!valid())return;if(n<steps.length-1){n++;render();window.scrollTo({top:0,behavior:'smooth'})}else{next.textContent='ثبت شد';next.disabled=true}};back.onclick=()=>{if(n>0){n--;render();window.scrollTo({top:0,behavior:'smooth'})}};render();})();
</script></body></html>
