<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>دکترلینک | ارزیابی اولیه ایمپلنت</title><style>:root{--g:#119b70;--gd:#087d59;--gs:#edf9f5;--gl:#bfe7d8;--ink:#1c252b;--mut:#7b858d;--line:#e2e7e5;--bg:#f2f6f4}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}.app{width:100%;max-width:520px;min-height:100svh;margin:auto;background:#fff;position:relative}.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(14px);padding:17px 18px 13px;border-bottom:1px solid #edf1ef}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand b{color:var(--g)}.step{font-size:13px;font-weight:750;color:#7d878e}.progress{height:6px;margin-top:12px;background:#e8eeeb;border-radius:999px;overflow:hidden}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--g),#46b991);border-radius:999px}.wrap{padding:22px 18px 130px}.intro{margin:2px 0 22px}.intro h1{margin:0 0 9px;font-size:29px;line-height:1.42;font-weight:950}.intro p{margin:0;font-size:16px;line-height:1.9;color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 7px 28px #1c6a4c0b}.choices{display:grid;gap:10px}.choice{position:relative;width:100%;min-height:68px;border:1.5px solid #dde4e1;border-radius:17px;background:#fff;color:#263038;padding:15px 53px 15px 16px;text-align:right;font-size:17px;font-weight:720;line-height:1.6;cursor:pointer}.choice::after{content:"";position:absolute;right:17px;top:50%;transform:translateY(-50%);width:21px;height:21px;border:2px solid #b8c2bd;border-radius:50%;background:#fff}.choice.on{border-color:var(--g);background:var(--gs);color:var(--gd);font-weight:850}.choice.on::after{border-color:var(--g);background:var(--g);box-shadow:inset 0 0 0 4px #fff}.label{display:block;margin:20px 3px 10px;font-size:17px;font-weight:850}.subchoices,.healthgrid,.jawparts{display:grid;gap:8px}.subchoices{margin-top:10px;padding:11px;border-radius:16px;background:#f7fbf9}.subchoices .choice,.healthgrid .choice,.jawparts .choice{min-height:58px;font-size:16px}.jawmain{display:grid;grid-template-columns:1fr 1fr;gap:10px}.jawmain .choice{min-height:90px;text-align:center;font-size:19px;padding:16px 45px 16px 12px}.jawparts{margin-top:11px}.mouthchart{margin-top:14px;border:1px solid #dce7e2;border-radius:24px;padding:17px 10px 18px;background:linear-gradient(180deg,#fbfefd,#f1faf6)}.mouthchart h3{text-align:center;margin:0 0 5px}.mut{font-size:14px;line-height:1.8;color:#808b91}.arch{display:flex;justify-content:center;gap:3px;direction:ltr;margin:14px 0}.tooth{width:22px;height:38px;border:1.5px solid #d0d8d4;background:#fff;border-radius:10px 10px 14px 14px;padding:0}.tooth:nth-child(1),.tooth:nth-child(16){height:30px;margin-top:8px}.tooth:nth-child(2),.tooth:nth-child(15){height:33px;margin-top:6px}.tooth:nth-child(3),.tooth:nth-child(14){height:35px;margin-top:4px}.tooth.on{background:#b9ead9;border-color:var(--g)}.lower .tooth{border-radius:14px 14px 9px 9px}.healthgrid .choice::after{border-radius:6px}.input,.text{width:100%;border:1.5px solid #d9e1dd;border-radius:16px;background:#fff;color:#1c252b;font-size:17px;padding:15px 16px;outline:0}.text{min-height:110px;resize:vertical}.input:focus,.text:focus{border-color:var(--g);box-shadow:0 0 0 4px #e8f8f2}.notice{margin:0 0 15px;border:1px solid var(--gl);border-radius:18px;background:#f0faf6;color:#40665a;padding:14px 15px;font-size:14px;line-height:1.9}.upload-row{display:grid;grid-template-columns:42% 58%;gap:10px;align-items:stretch;margin:11px 0;border:1px solid #dfe6e3;border-radius:20px;background:#fff;padding:9px;min-height:164px;box-shadow:0 6px 20px #184c380b}.samplebox{border-radius:15px;overflow:hidden;background:#edf2f0;display:flex;align-items:center;justify-content:center;min-height:145px}.samplebox img{width:100%;height:100%;min-height:145px;object-fit:cover;display:block}.uploadside{display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0}.uploadside b{font-size:17px;font-weight:900}.uploadside p{margin:0;color:#89928f;font-size:12px;line-height:1.65}.fileinput{display:none}.uploadbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border:1.5px dashed #55b996;border-radius:13px;background:#f7fcfa;color:var(--gd);padding:9px 7px;font-size:14px;font-weight:850;cursor:pointer}.secondary{border-style:solid;border-color:#dde4e1;background:#fff;color:#596560}.statusopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{min-height:37px;border:1px solid #e0e5e3;border-radius:11px;background:#fff;padding:6px 4px;color:#616b67;font-size:11px;font-weight:700}.mini.on{border-color:var(--g);background:var(--gs);color:var(--gd)}.statusline{font-size:12px;font-weight:850;color:var(--gd)}.done{margin-bottom:13px;border:1px solid var(--gl);border-radius:18px;background:#edf9f5;color:#236b55;padding:15px;font-size:16px;font-weight:850}.summary{padding:15px 16px}.sumrow{display:grid;grid-template-columns:112px 1fr;gap:9px;padding:11px 0;border-bottom:1px solid #eef1f0;font-size:14px;line-height:1.8}.consent{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:14px;line-height:1.85}.consent input{width:21px;height:21px;accent-color:var(--g)}.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:520px;padding:26px 18px max(15px,env(safe-area-inset-bottom));display:flex;gap:9px;background:linear-gradient(transparent,#fff 25%)}.btn{min-height:59px;border-radius:17px;border:0;padding:13px 18px;font-size:17px;font-weight:900}.primary{flex:1;color:#fff;background:linear-gradient(135deg,var(--g),var(--gd))}.ghost{min-width:92px;background:#fff;color:#4c5953;border:1px solid #dfe5e2}.hidden{display:none!important}@media(max-width:390px){.wrap{padding:18px 14px 126px}.top{padding:15px 14px 12px}.intro h1{font-size:26px}.intro p{font-size:15px}.choice{font-size:16px;min-height:64px}.upload-row{grid-template-columns:40% 60%;gap:8px}.uploadside b{font-size:15px}.uploadbtn{font-size:12px}}</style></head><body><div class="app"><header class="top"><div class="toprow"><div class="brand">دکتر<b>لینک</b></div><div id="step" class="step"></div></div><div class="progress"><i id="bar"></i></div></header><main class="wrap"><div id="root"></div></main><div class="sticky"><button id="back" class="btn ghost hidden">قبلی</button><button id="next" class="btn primary">ادامه</button></div></div><script src="assets/opg-real.js"></script><script src="assets/cbct-real.js"></script><script src="assets/front-real.js"></script><script src="assets/upper-real.js"></script><script src="assets/lower-real.js"></script><script src="assets/right-real.js"></script><script src="assets/left-real.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),root=$('root'),stepEl=$('step'),bar=$('bar'),next=$('next'),back=$('back'),KEY='drlinq_implant_pilot_v4';const IMG={opg:window.DR_OPG,cbct:window.DR_CBCT,front:window.DR_FRONT,upper:window.DR_UPPER,lower:window.DR_LOWER,right:window.DR_RIGHT,left:window.DR_LEFT};const fresh={problem:'',missingCount:'',jaw:'',jawPart:'',teeth:[],medical:{},diseaseText:'',medText:'',records:{opg:'',cbct:''},photos:{front:'',upper:'',lower:'',right:'',left:''},question:'',name:'',mobile:'',city:'اهواز',consent:false};let s=Object.assign({},fresh,JSON.parse(localStorage.getItem(KEY)||'{}'));s.medical=Object.assign({},fresh.medical,s.medical||{});s.records=Object.assign({},fresh.records,s.records||{});s.photos=Object.assign({},fresh.photos,s.photos||{});let n=0;const steps=[['برای چه مشکلی می‌خواهید ایمپلنت انجام دهید؟','گزینه‌ای را انتخاب کنید که دقیق‌تر شبیه وضعیت شماست.'],['محل مشکل کجاست؟','اول فک را انتخاب کنید؛ در صورت تمایل روی دندان موردنظر هم علامت بزنید.'],['چند سؤال درباره سلامتی شما','اطلاعات بیماری‌ها و داروهای مصرفی را وارد کنید.'],['عکس‌های رادیوگرافی','اگر OPG یا CBCT دارید، برای بررسی دقیق‌تر ارسال کنید.'],['عکس‌های داخل دهان','نمونه واقعی را ببینید و همان زاویه را با دوربین بگیرید یا از گوشی انتخاب کنید.'],['سؤال اصلی و تماس','سؤال اصلی خودتان و اطلاعات تماس را وارد کنید.'],['خلاصه پرونده','این خلاصه برای مرور دندانپزشک آماده می‌شود.']];const problems=['دندان از دست رفته دارم','دندان مصنوعی دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان لق دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان شکسته یا خراب دارم و می‌خواهم با ایمپلنت جایگزین کنم','ایمپلنت قبلی‌ام مشکل دارد و می‌خواهم بررسی شود'];const counts=['۱ دندان','۲ تا ۳ دندان','چند دندان','نیم‌فک','فک کامل'];const medical=[['diabetes','دیابت'],['heart','بیماری قلبی یا فشار خون'],['blood','داروی رقیق‌کننده خون'],['smoke','سیگار یا قلیان'],['osteo','پوکی استخوان'],['bone','داروی مربوط به استخوان/پوکی استخوان'],['cancer','سرطان یا شیمی‌درمانی'],['radiation','پرتودرمانی سر و گردن'],['allergy','حساسیت دارویی'],['other','بیماری مهم دیگر'],['regular','داروی دائمی مصرف می‌کنم']];function save(){localStorage.setItem(KEY,JSON.stringify(s))}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function choice(v,cur,key){return `<button class="choice ${cur===v?'on':''}" ${key}="${esc(v)}">${esc(v)}</button>`}function intro(){return `<div class="intro"><h1>${steps[n][0]}</h1><p>${steps[n][1]}</p></div>`}function render(){stepEl.textContent=`مرحله ${n+1} از ${steps.length}`;bar.style.width=((n+1)/steps.length*100)+'%';back.classList.toggle('hidden',n===0);next.textContent=n===6?'پایان':'ادامه';root.innerHTML=`<section>${intro()}${[screenProblem,screenLocation,screenHealth,screenRecords,screenPhotos,screenContact,screenSummary][n]()}</section>`;bind()}function screenProblem(){return `<div class="card"><div class="choices">${problems.map(v=>choice(v,s.problem,'data-problem')).join('')}</div>${s.problem===problems[0]?`<label class="label">تقریباً چند دندان؟</label><div class="subchoices">${counts.map(v=>choice(v,s.missingCount,'data-count')).join('')}</div>`:''}</div>`}function arch(cls){return `<div class="arch ${cls}">${Array.from({length:16},(_,i)=>`<button aria-label="دندان" class="tooth ${s.teeth.includes(cls+'-'+i)?'on':''}" data-tooth="${cls}-${i}"></button>`).join('')}</div>`}function screenLocation(){return `<div class="card"><div class="jawmain">${choice('فک بالا',s.jaw,'data-jaw')}${choice('فک پایین',s.jaw,'data-jaw')}</div>${s.jaw?`<div class="jawparts">${['کامل','سمت راست','سمت چپ'].map(v=>choice(v,s.jawPart,'data-part')).join('')}</div>`:''}</div><div class="mouthchart"><h3>انتخاب روی تصویر (اختیاری)</h3><div class="mut" style="text-align:center">اگر محل دقیق را می‌دانید، روی دندان موردنظر بزنید.</div>${arch('upper')}${arch('lower')}</div>`}function screenHealth(){return `<div class="card"><div class="healthgrid">${medical.map(([k,t])=>`<button class="choice ${s.medical[k]?'on':''}" data-med="${k}">${t}</button>`).join('')}</div><label class="label">نام بیماری یا توضیح کوتاه</label><textarea id="diseaseText" class="text" placeholder="مثلاً دیابت دارم...">${esc(s.diseaseText)}</textarea><label class="label">نام داروهایی که مصرف می‌کنید</label><textarea id="medText" class="text" placeholder="مثلاً متفورمین، آسپرین...">${esc(s.medText)}</textarea></div>`}function evidence(k,title,desc){const st=s.records[k]||'';return `<div class="upload-row"><div class="samplebox"><img src="${IMG[k]}" alt="نمونه واقعی ${title}"></div><div class="uploadside"><b>${title}</b><p>${desc}</p><label class="uploadbtn" for="file-${k}">آپلود تصویر</label><input class="fileinput" id="file-${k}" type="file" accept="image/*,.pdf" data-record-file="${k}"><div class="statusopts"><button class="mini ${st==='ندارم'?'on':''}" data-record-status="${k}|ندارم">ندارم</button><button class="mini ${st==='الان در دسترسم نیست'?'on':''}" data-record-status="${k}|الان در دسترسم نیست">الان در دسترسم نیست</button></div>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}function screenRecords(){return `<div class="notice"><b>این تصاویر اجباری نیستند.</b><br>اگر دارید ارسال کنید؛ اگر ندارید بدون مشکل ادامه دهید.</div>${evidence('opg','OPG (عکس پانورامیک)','نمونه واقعی عکس پانورامیک.')}${evidence('cbct','CBCT (عکس سه‌بعدی)','اگر قبلاً گرفته‌اید، ارسال کنید.')}`}function photoRow(k,title){const st=s.photos[k]||'';return `<div class="upload-row"><div class="samplebox"><img src="${IMG[k]}" alt="نمونه واقعی ${title}"></div><div class="uploadside"><b>${title}</b><p>عکس شما تا حد امکان شبیه نمونه واقعی باشد.</p><label class="uploadbtn" for="camera-${k}">عکس بگیر</label><input class="fileinput" id="camera-${k}" type="file" accept="image/*" capture="environment" data-photo-file="${k}"><label class="uploadbtn secondary" for="gallery-${k}">انتخاب از گوشی</label><input class="fileinput" id="gallery-${k}" type="file" accept="image/*" data-photo-file="${k}"><button class="mini ${st==='الان نمی‌توانم'?'on':''}" data-photo-skip="${k}">الان نمی‌توانم</button>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}function screenPhotos(){return `<div class="notice"><b>برای پاسخ دقیق‌تر، این ۵ زاویه کمک زیادی می‌کنند.</b><br>نمونه‌های زیر همان عکس‌های واقعی آماده‌شده هستند.</div>${photoRow('front','۱. روبه‌رو')}${photoRow('upper','۲. فک بالا')}${photoRow('lower','۳. فک پایین')}${photoRow('right','۴. سمت راست بیمار')}${photoRow('left','۵. سمت چپ بیمار')}`}function screenContact(){return `<div class="card"><label class="label">مهم‌ترین سؤال شما از دندانپزشک چیست؟</label><textarea id="question" class="text">${esc(s.question)}</textarea><label class="label">نام و نام خانوادگی</label><input id="name" class="input" value="${esc(s.name)}"><label class="label">شماره موبایل</label><input id="mobile" class="input" inputmode="tel" value="${esc(s.mobile)}"><label class="label">شهر</label><input id="city" class="input" value="${esc(s.city)}"></div>`}function selectedMedical(){const a=medical.filter(([k])=>s.medical[k]).map(([,t])=>t);return a.length?a.join('، '):'موردی انتخاب نشده'}function fileCount(o){return Object.values(o).filter(v=>v&&v!=='الان نمی‌توانم').length}function screenSummary(){return `<div class="done">پرونده اولیه آماده مرور است.</div><div class="card summary"><div class="sumrow"><b>دلیل مراجعه</b><span>${esc(s.problem)}${s.missingCount?' · '+esc(s.missingCount):''}</span></div><div class="sumrow"><b>محل</b><span>${esc(s.jaw)}${s.jawPart?' · '+esc(s.jawPart):''}</span></div><div class="sumrow"><b>سلامتی</b><span>${esc(selectedMedical())}</span></div><div class="sumrow"><b>رادیوگرافی</b><span>OPG: ${esc(s.records.opg||'ثبت نشده')}<br>CBCT: ${esc(s.records.cbct||'ثبت نشده')}</span></div><div class="sumrow"><b>عکس‌های داخل دهان</b><span>${fileCount(s.photos)} مورد ثبت شده</span></div><div class="sumrow"><b>تماس</b><span>${esc(s.name||'—')} · ${esc(s.mobile||'—')}</span></div></div><label class="consent"><input id="consent" type="checkbox" ${s.consent?'checked':''}><span>اجازه می‌دهم این اطلاعات برای بررسی اولیه در اختیار دندانپزشک قرار گیرد.</span></label><div class="notice">نسخه آزمایشی: فعلاً اطلاعات واقعاً برای پزشک ارسال نمی‌شود.</div>`}function bind(){document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>{s.problem=b.dataset.problem;if(s.problem!==problems[0])s.missingCount='';save();render()});document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{s.missingCount=b.dataset.count;save();render()});document.querySelectorAll('[data-jaw]').forEach(b=>b.onclick=()=>{s.jaw=b.dataset.jaw;s.jawPart='';save();render()});document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{s.jawPart=b.dataset.part;save();render()});document.querySelectorAll('[data-tooth]').forEach(b=>b.onclick=()=>{const v=b.dataset.tooth,i=s.teeth.indexOf(v);i>-1?s.teeth.splice(i,1):s.teeth.push(v);save();render()});document.querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>{s.medical[b.dataset.med]=!s.medical[b.dataset.med];save();render()});['diseaseText','medText','question','name','mobile','city'].forEach(id=>{const x=$(id);if(x)x.oninput=()=>{s[id]=x.value;save()}});document.querySelectorAll('[data-record-file]').forEach(i=>i.onchange=e=>{if(e.target.files[0]){s.records[i.dataset.recordFile]='فایل انتخاب شد';save();render()}});document.querySelectorAll('[data-record-status]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.recordStatus.split('|');s.records[k]=v;save();render()});document.querySelectorAll('[data-photo-file]').forEach(i=>i.onchange=e=>{if(e.target.files[0]){s.photos[i.dataset.photoFile]='عکس انتخاب شد';save();render()}});document.querySelectorAll('[data-photo-skip]').forEach(b=>b.onclick=()=>{s.photos[b.dataset.photoSkip]='الان نمی‌توانم';save();render()});const c=$('consent');if(c)c.onchange=()=>{s.consent=c.checked;save()}}function valid(){if(n===0&&!s.problem){alert('لطفاً یک گزینه را انتخاب کنید.');return false}if(n===0&&s.problem===problems[0]&&!s.missingCount){alert('لطفاً تعداد تقریبی دندان‌ها را انتخاب کنید.');return false}if(n===1&&(!s.jaw||!s.jawPart)){alert('لطفاً فک و محل را انتخاب کنید.');return false}if(n===5&&(!s.name.trim()||!s.mobile.trim())){alert('لطفاً نام و شماره موبایل را وارد کنید.');return false}if(n===6&&!s.consent){alert('برای پایان، اجازه بررسی اطلاعات را تأیید کنید.');return false}return true}next.onclick=()=>{if(!valid())return;if(n<6){n++;render();window.scrollTo({top:0,behavior:'smooth'})}else{next.textContent='ثبت شد';next.disabled=true}};back.onclick=()=>{if(n>0){n--;render();window.scrollTo({top:0,behavior:'smooth'})}};render()})();</script></body></html>
