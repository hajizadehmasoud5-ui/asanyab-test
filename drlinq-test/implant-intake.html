<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دکترلینک | ارزیابی اولیه ایمپلنت</title>
<style>
:root{
  --green:#119b70;--green-dark:#087d59;--green-soft:#edf9f5;--green-line:#bfe7d8;
  --ink:#1c252b;--muted:#7b858d;--line:#e2e7e5;--bg:#f2f6f4;--white:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font-family:inherit}
.app{width:100%;max-width:520px;min-height:100svh;margin:0 auto;background:#fff;box-shadow:0 0 40px #0a5a3b0d;position:relative}
.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(14px);padding:17px 18px 13px;border-bottom:1px solid #edf1ef}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:24px;font-weight:900;letter-spacing:-.7px;color:#263038}
.brand b{color:var(--green)}
.step{font-size:13px;font-weight:750;color:#7d878e}
.progress{height:6px;margin-top:12px;background:#e8eeeb;border-radius:999px;overflow:hidden}
.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--green),#46b991);border-radius:999px;transition:width .25s ease}
.wrap{padding:22px 18px 130px}
.stage{width:100%}
.intro{margin:2px 0 22px;text-align:right}
.intro h1{margin:0 0 9px;font-size:29px;line-height:1.42;letter-spacing:-.7px;font-weight:950;color:#182126}
.intro p{margin:0;font-size:16px;line-height:1.9;color:var(--muted);font-weight:500}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 7px 28px #1c6a4c0b}
.choices{display:grid;gap:10px}
.choice{position:relative;width:100%;min-height:68px;border:1.5px solid #dde4e1;border-radius:17px;background:#fff;color:#263038;padding:15px 53px 15px 16px;text-align:right;font-size:17px;font-weight:720;line-height:1.6;cursor:pointer;box-shadow:0 3px 10px #263b3108;transition:.14s ease}
.choice:active{transform:scale(.992)}
.choice::after{content:"";position:absolute;right:17px;top:50%;transform:translateY(-50%);width:21px;height:21px;border:2px solid #b8c2bd;border-radius:50%;background:#fff}
.choice.on{border-color:var(--green);background:var(--green-soft);color:var(--green-dark);box-shadow:0 5px 18px #119b7016;font-weight:850}
.choice.on::after{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 4px #fff}
.label{display:block;margin:20px 3px 10px;font-size:17px;font-weight:850;color:#263038}
.subchoices{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px;padding:11px;border-radius:16px;background:#f7fbf9}
.subchoices .choice{min-height:56px;font-size:16px;background:#fff}
.jawmain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jawmain .choice{min-height:90px;padding:16px 12px 16px 45px;text-align:center;font-size:19px;font-weight:850}
.jawparts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:11px}
.jawparts .choice{min-height:58px;font-size:17px}
.mouthchart{margin-top:14px;border:1px solid #dce7e2;border-radius:24px;padding:17px 10px 18px;background:linear-gradient(180deg,#fbfefd,#f1faf6);box-shadow:0 8px 25px #116a490d}
.mouthchart h3{margin:0 0 5px;text-align:center;font-size:18px;font-weight:900}
.mut{font-size:14px;line-height:1.8;color:#808b91}
.arch{display:flex;justify-content:center;gap:3px;direction:ltr;margin:14px 0}
.tooth{width:22px;height:38px;border:1.5px solid #d0d8d4;background:#fff;border-radius:10px 10px 14px 14px;padding:0;cursor:pointer;box-shadow:0 2px 4px #00000009}
.tooth:nth-child(1),.tooth:nth-child(16){height:30px;margin-top:8px}.tooth:nth-child(2),.tooth:nth-child(15){height:33px;margin-top:6px}.tooth:nth-child(3),.tooth:nth-child(14){height:35px;margin-top:4px}.tooth:nth-child(4),.tooth:nth-child(13){margin-top:2px}
.tooth.on{background:#b9ead9;border-color:var(--green);box-shadow:inset 0 0 0 3px #fff,0 3px 8px #119b7020}.lower .tooth{border-radius:14px 14px 9px 9px}
.healthgrid{display:grid;grid-template-columns:1fr;gap:8px}
.healthgrid .choice{min-height:58px;font-size:16px}
.healthgrid .choice::after{border-radius:6px}
.input,.text{width:100%;border:1.5px solid #d9e1dd;border-radius:16px;background:#fff;color:#1c252b;font:inherit;font-size:17px;padding:15px 16px;outline:0;box-shadow:0 3px 10px #243d3207}
.input{min-height:58px}.text{min-height:110px;resize:vertical}
.input:focus,.text:focus{border-color:var(--green);box-shadow:0 0 0 4px #e8f8f2}
.notice{margin:0 0 15px;border:1px solid var(--green-line);border-radius:18px;background:#f0faf6;color:#40665a;padding:14px 15px;font-size:14px;line-height:1.9}
.upload-row{display:grid;grid-template-columns:42% 58%;gap:10px;align-items:stretch;margin:11px 0;border:1px solid #dfe6e3;border-radius:20px;background:#fff;padding:9px;min-height:164px;box-shadow:0 6px 20px #184c380b}
.samplebox{border-radius:15px;overflow:hidden;background:#edf2f0;display:flex;align-items:center;justify-content:center;min-height:145px}
.samplebox img,.samplebox svg{width:100%;height:100%;min-height:145px;object-fit:cover;display:block}
.uploadside{display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0}
.uploadside b{font-size:17px;font-weight:900;color:#222d31}
.uploadside p{margin:0;color:#89928f;font-size:12px;line-height:1.65}
.fileinput{display:none}
.uploadbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border:1.5px dashed #55b996;border-radius:13px;background:#f7fcfa;color:var(--green-dark);padding:9px 7px;font-size:14px;font-weight:850;text-align:center;cursor:pointer}
.uploadbtn::before{content:"↑";font-size:19px;margin-left:6px;font-weight:900}
.uploadbtn.secondary{border-style:solid;border-color:#dde4e1;background:#fff;color:#596560}.uploadbtn.secondary::before{content:"▣";font-size:14px}
.statusopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{min-height:37px;border:1px solid #e0e5e3;border-radius:11px;background:#fff;padding:6px 4px;color:#616b67;font-size:11px;font-weight:700;cursor:pointer}
.mini.on{border-color:var(--green);background:var(--green-soft);color:var(--green-dark)}
.statusline{font-size:12px;font-weight:850;color:var(--green-dark)}
.done{margin-bottom:13px;border:1px solid var(--green-line);border-radius:18px;background:#edf9f5;color:#236b55;padding:15px;font-size:16px;font-weight:850;line-height:1.85}
.summary{padding:15px 16px}
.sumrow{display:grid;grid-template-columns:112px 1fr;gap:9px;padding:11px 0;border-bottom:1px solid #eef1f0;font-size:14px;line-height:1.8}.sumrow:last-child{border-bottom:0}
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:14px;line-height:1.85}.consent input{width:21px;height:21px;accent-color:var(--green);margin-top:2px;flex:none}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:520px;padding:26px 18px max(15px,env(safe-area-inset-bottom));display:flex;gap:9px;background:linear-gradient(transparent,#fff 25%)}
.btn{min-height:59px;border-radius:17px;border:0;padding:13px 18px;font:inherit;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 6px 18px #173a2c12}
.primary{flex:1;color:#fff;background:linear-gradient(135deg,var(--green),var(--green-dark))}
.ghost{min-width:92px;background:#fff;color:#4c5953;border:1px solid #dfe5e2}.hidden{display:none!important}
@media(max-width:390px){.wrap{padding:18px 14px 126px}.top{padding:15px 14px 12px}.intro h1{font-size:26px}.intro p{font-size:15px}.choice{font-size:16px;min-height:64px}.upload-row{grid-template-columns:40% 60%;gap:8px}.uploadside b{font-size:15px}.uploadbtn{font-size:12px}.jawmain .choice{font-size:17px}.sticky{padding-left:14px;padding-right:14px}}
@media(min-width:700px){body{padding:22px 0}.app{border-radius:30px;overflow:hidden;min-height:calc(100svh - 44px)}.sticky{bottom:22px;border-radius:0 0 30px 30px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="toprow"><div class="brand">دکتر<b>لینک</b></div><div id="step" class="step"></div></div>
  <div class="progress"><i id="bar"></i></div>
</header>
<main class="wrap"><div id="root"></div></main>
<div class="sticky"><button id="back" class="btn ghost hidden">قبلی</button><button id="next" class="btn primary">ادامه</button></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),root=$('root'),stepEl=$('step'),bar=$('bar'),next=$('next'),back=$('back'),KEY='drlinq_implant_pilot_v3';
const fresh={problem:'',missingCount:'',jaw:'',jawPart:'',teeth:[],medical:{},diseaseText:'',medText:'',records:{opg:'',cbct:''},photos:{front:'',upper:'',lower:'',right:'',left:''},question:'',name:'',mobile:'',city:'اهواز',consent:false};
let s=Object.assign({},fresh,JSON.parse(localStorage.getItem(KEY)||'{}'));s.medical=Object.assign({},fresh.medical,s.medical||{});s.records=Object.assign({},fresh.records,s.records||{});s.photos=Object.assign({},fresh.photos,s.photos||{});let n=0;
const steps=[['برای چه مشکلی می‌خواهید ایمپلنت انجام دهید؟','گزینه‌ای را انتخاب کنید که دقیق‌تر شبیه وضعیت شماست.'],['محل مشکل کجاست؟','اول فک را انتخاب کنید؛ در صورت تمایل روی دندان موردنظر هم علامت بزنید.'],['چند سؤال درباره سلامتی شما','اطلاعات بیماری‌ها و داروهای مصرفی را وارد کنید.'],['عکس‌های رادیوگرافی','اگر OPG یا CBCT دارید، برای بررسی دقیق‌تر ارسال کنید.'],['عکس‌های داخل دهان','نمونه را ببینید و همان زاویه را با دوربین بگیرید یا از گوشی انتخاب کنید.'],['سؤال اصلی و تماس','سؤال اصلی خودتان و اطلاعات تماس را وارد کنید.'],['خلاصه پرونده','این خلاصه برای مرور دندانپزشک آماده می‌شود.']];
const problems=['دندان از دست رفته دارم','دندان مصنوعی دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان لق دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان شکسته یا خراب دارم و می‌خواهم با ایمپلنت جایگزین کنم','ایمپلنت قبلی‌ام مشکل دارد و می‌خواهم بررسی شود'];
const counts=['۱ دندان','۲ تا ۳ دندان','چند دندان','نیم‌فک','فک کامل'];
const medical=[['diabetes','دیابت'],['heart','بیماری قلبی یا فشار خون'],['blood','داروی رقیق‌کننده خون'],['smoke','سیگار یا قلیان'],['osteo','پوکی استخوان'],['bone','داروی مربوط به استخوان/پوکی استخوان'],['cancer','سرطان یا شیمی‌درمانی'],['radiation','پرتودرمانی سر و گردن'],['allergy','حساسیت دارویی'],['other','بیماری مهم دیگر'],['regular','داروی دائمی مصرف می‌کنم']];
const OPG='https://imaging.heartofengland.nhs.uk/wp-content/uploads/2017/01/OPG.jpg',CBCT='https://www.smileolympia.com/wp-content/uploads/2022/10/CBCT-_Jaw_Scan.jpg';
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function choice(v,cur,key){return `<button class="choice ${cur===v?'on':''}" ${key}="${esc(v)}">${esc(v)}</button>`}
function intro(){return `<div class="intro"><h1>${steps[n][0]}</h1><p>${steps[n][1]}</p></div>`}
function render(){stepEl.textContent=`مرحله ${n+1} از ${steps.length}`;bar.style.width=((n+1)/steps.length*100)+'%';back.classList.toggle('hidden',n===0);next.textContent=n===steps.length-1?'پایان':'ادامه';root.innerHTML=`<section class="stage">${intro()}${[screenProblem,screenLocation,screenHealth,screenRecords,screenPhotos,screenContact,screenSummary][n]()}</section>`;bind()}
function screenProblem(){return `<div class="card"><div class="choices">${problems.map(v=>choice(v,s.problem,'data-problem')).join('')}</div>${s.problem==='دندان از دست رفته دارم'?`<label class="label">تقریباً چند دندان؟</label><div class="subchoices">${counts.map(v=>choice(v,s.missingCount,'data-count')).join('')}</div>`:''}</div>`}
function arch(cls){return `<div class="arch ${cls}">${Array.from({length:16},(_,i)=>`<button aria-label="دندان" class="tooth ${s.teeth.includes(cls+'-'+i)?'on':''}" data-tooth="${cls}-${i}"></button>`).join('')}</div>`}
function screenLocation(){return `<div class="card"><div class="jawmain">${choice('فک بالا',s.jaw,'data-jaw')}${choice('فک پایین',s.jaw,'data-jaw')}</div>${s.jaw?`<div class="jawparts">${['کامل','سمت راست','سمت چپ'].map(v=>choice(v,s.jawPart,'data-part')).join('')}</div>`:''}</div><div class="mouthchart"><h3>انتخاب روی تصویر (اختیاری)</h3><div class="mut" style="text-align:center">اگر محل دقیق را می‌دانید روی دندان موردنظر بزنید؛ نیازی به دانستن شماره دندان نیست.</div>${arch('upper')}${arch('lower')}</div>`}
function screenHealth(){return `<div class="card"><div class="healthgrid">${medical.map(([k,t])=>`<button class="choice ${s.medical[k]?'on':''}" data-med="${k}">${t}</button>`).join('')}</div><label class="label">نام بیماری یا توضیح کوتاه</label><textarea id="diseaseText" class="text" placeholder="مثلاً دیابت دارم، فشار خون دارم...">${esc(s.diseaseText)}</textarea><label class="label">نام داروهایی که مصرف می‌کنید</label><textarea id="medText" class="text" placeholder="مثلاً متفورمین، آسپرین...">${esc(s.medText)}</textarea></div>`}
function evidence(k,title,desc,img){const st=s.records[k]||'';return `<div class="upload-row"><div class="samplebox"><img src="${img}" alt="نمونه ${title}" onerror="this.style.display='none';this.parentNode.innerHTML='<b style=&quot;font-size:13px&quot;>نمونه ${title}</b>'"></div><div class="uploadside"><b>${title}</b><p>${desc}</p><label class="uploadbtn" for="file-${k}">آپلود تصویر</label><input class="fileinput" id="file-${k}" type="file" accept="image/*,.pdf" data-record-file="${k}"><div class="statusopts"><button class="mini ${st==='ندارم'?'on':''}" data-record-status="${k}|ندارم">ندارم</button><button class="mini ${st==='الان در دسترسم نیست'?'on':''}" data-record-status="${k}|الان در دسترسم نیست">الان در دسترسم نیست</button></div>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}
function screenRecords(){return `<div class="notice"><b>این تصاویر اجباری نیستند.</b><br>اگر آن‌ها را دارید ارسال کنید؛ اگر ندارید یا الان در دسترستان نیست، می‌توانید ادامه دهید.</div>${evidence('opg','OPG (پانورامیک)','نمای کلی فک و دندان‌ها.',OPG)}${evidence('cbct','CBCT','اگر قبلاً گرفته‌اید، ارسال کنید.',CBCT)}`}
function mouthSvg(kind){if(kind==='upper'||kind==='lower')return `<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="#f6d3d7"/><path d="M20 ${kind==='upper'?75:45} Q80 ${kind==='upper'?18:102} 140 ${kind==='upper'?75:45}" fill="none" stroke="#d28f97" stroke-width="20" stroke-linecap="round"/>${Array.from({length:9},(_,i)=>{const x=35+i*11,y=kind==='upper'?50+Math.abs(4-i)*3:70-Math.abs(4-i)*3;return `<rect x="${x}" y="${y}" width="10" height="18" rx="4" fill="white" stroke="#d5d9df"/>`}).join('')}</svg>`;if(kind==='right'||kind==='left')return `<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="#f7d8dc"/><path d="M16 60 Q80 ${kind==='right'?30:90} 145 60" stroke="#c77f88" stroke-width="22" fill="none"/><g fill="white" stroke="#d5d9df">${Array.from({length:7},(_,i)=>`<rect x="${32+i*15}" y="${kind==='right'?44+i%2*5:58-i%2*5}" width="14" height="23" rx="4"/>`).join('')}</g></svg>`;return `<svg viewBox="0 0 160 120" aria-hidden="true"><rect width="160" height="120" fill="#f6d3d7"/><rect x="12" y="35" width="136" height="50" rx="24" fill="#b94f5f"/><g fill="white" stroke="#d5d9df">${Array.from({length:8},(_,i)=>`<rect x="${31+i*12}" y="43" width="11" height="27" rx="4"/>`).join('')}</g></svg>`}
function photoRow(k,titleTxt){const st=s.photos[k]||'';return `<div class="upload-row"><div class="samplebox">${mouthSvg(k)}</div><div class="uploadside"><b>${titleTxt}</b><p>عکس شما تا حد امکان شبیه نمونه باشد.</p><label class="uploadbtn" for="camera-${k}">عکس بگیر</label><input class="fileinput" id="camera-${k}" type="file" accept="image/*" capture="environment" data-photo-file="${k}"><label class="uploadbtn secondary" for="gallery-${k}">انتخاب از گوشی</label><input class="fileinput" id="gallery-${k}" type="file" accept="image/*" data-photo-file="${k}"><button class="mini ${st==='الان نمی‌توانم'?'on':''}" data-photo-skip="${k}">الان نمی‌توانم</button>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}
function screenPhotos(){return `<div class="notice"><b>برای پاسخ دقیق‌تر، این ۵ زاویه کمک زیادی می‌کنند.</b><br>هر تعداد که می‌توانید ارسال کنید؛ نداشتن عکس مانع ادامه نیست.</div>${photoRow('front','۱. روبه‌رو')}${photoRow('upper','۲. فک بالا')}${photoRow('lower','۳. فک پایین')}${photoRow('right','۴. سمت راست بیمار')}${photoRow('left','۵. سمت چپ بیمار')}`}
function screenContact(){return `<div class="card"><label class="label">مهم‌ترین سؤال شما از دندانپزشک چیست؟</label><textarea id="question" class="text" placeholder="مثلاً آیا برای ایمپلنت من استخوان کافی وجود دارد؟">${esc(s.question)}</textarea><label class="label">نام و نام خانوادگی</label><input id="name" class="input" value="${esc(s.name)}"><label class="label">شماره موبایل</label><input id="mobile" class="input" inputmode="tel" value="${esc(s.mobile)}"><label class="label">شهر</label><input id="city" class="input" value="${esc(s.city)}"></div>`}
function selectedMedical(){const a=medical.filter(([k])=>s.medical[k]).map(([,t])=>t);return a.length?a.join('، '):'موردی انتخاب نشده'}
function fileCount(o){return Object.values(o).filter(v=>v&&v!=='الان نمی‌توانم').length}
function screenSummary(){return `<div class="done">پرونده اولیه آماده مرور است.</div><div class="card summary"><div class="sumrow"><b>دلیل مراجعه</b><span>${esc(s.problem)}${s.missingCount?' · '+esc(s.missingCount):''}</span></div><div class="sumrow"><b>محل</b><span>${esc(s.jaw)}${s.jawPart?' · '+esc(s.jawPart):''}</span></div><div class="sumrow"><b>سلامتی</b><span>${esc(selectedMedical())}${s.diseaseText?'<br>'+esc(s.diseaseText):''}${s.medText?'<br>داروها: '+esc(s.medText):''}</span></div><div class="sumrow"><b>رادیوگرافی</b><span>OPG: ${esc(s.records.opg||'ثبت نشده')}<br>CBCT: ${esc(s.records.cbct||'ثبت نشده')}</span></div><div class="sumrow"><b>عکس‌های داخل دهان</b><span>${fileCount(s.photos)} مورد ثبت شده</span></div><div class="sumrow"><b>سؤال بیمار</b><span>${esc(s.question||'—')}</span></div><div class="sumrow"><b>تماس</b><span>${esc(s.name||'—')} · ${esc(s.mobile||'—')} · ${esc(s.city||'—')}</span></div></div><label class="consent"><input id="consent" type="checkbox" ${s.consent?'checked':''}><span>اجازه می‌دهم این اطلاعات برای بررسی اولیه در اختیار دندانپزشک قرار گیرد.</span></label><div class="notice" style="margin-top:14px">نسخه آزمایشی: فعلاً اطلاعات واقعاً برای پزشک ارسال نمی‌شود.</div>`}
function bind(){document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>{s.problem=b.dataset.problem;if(s.problem!=='دندان از دست رفته دارم')s.missingCount='';save();render()});document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{s.missingCount=b.dataset.count;save();render()});document.querySelectorAll('[data-jaw]').forEach(b=>b.onclick=()=>{s.jaw=b.dataset.jaw;s.jawPart='';save();render()});document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{s.jawPart=b.dataset.part;save();render()});document.querySelectorAll('[data-tooth]').forEach(b=>b.onclick=()=>{const v=b.dataset.tooth,i=s.teeth.indexOf(v);i>-1?s.teeth.splice(i,1):s.teeth.push(v);save();render()});document.querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>{s.medical[b.dataset.med]=!s.medical[b.dataset.med];save();render()});['diseaseText','medText','question','name','mobile','city'].forEach(id=>{const x=$(id);if(x)x.oninput=()=>{s[id]=x.value;save()}});document.querySelectorAll('[data-record-file]').forEach(i=>i.onchange=e=>{if(e.target.files[0]){s.records[i.dataset.recordFile]='فایل انتخاب شد';save();render()}});document.querySelectorAll('[data-record-status]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.recordStatus.split('|');s.records[k]=v;save();render()});document.querySelectorAll('[data-photo-file]').forEach(i=>i.onchange=e=>{if(e.target.files[0]){s.photos[i.dataset.photoFile]='عکس انتخاب شد';save();render()}});document.querySelectorAll('[data-photo-skip]').forEach(b=>b.onclick=()=>{s.photos[b.dataset.photoSkip]='الان نمی‌توانم';save();render()});const c=$('consent');if(c)c.onchange=()=>{s.consent=c.checked;save()}}
function valid(){if(n===0&&!s.problem){alert('لطفاً یک گزینه را انتخاب کنید.');return false}if(n===0&&s.problem==='دندان از دست رفته دارم'&&!s.missingCount){alert('لطفاً تعداد تقریبی دندان‌ها را انتخاب کنید.');return false}if(n===1&&(!s.jaw||!s.jawPart)){alert('لطفاً فک و محل را انتخاب کنید.');return false}if(n===5&&(!s.name.trim()||!s.mobile.trim())){alert('لطفاً نام و شماره موبایل را وارد کنید.');return false}if(n===6&&!s.consent){alert('برای پایان، اجازه بررسی اطلاعات را تأیید کنید.');return false}return true}
next.onclick=()=>{if(!valid())return;if(n<steps.length-1){n++;render();window.scrollTo({top:0,behavior:'smooth'})}else{next.textContent='ثبت شد';next.disabled=true}};
back.onclick=()=>{if(n>0){n--;render();window.scrollTo({top:0,behavior:'smooth'})}};
render();})();
</script>
</body>
</html>
