<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دکترلینک | ارزیابی اولیه ایمپلنت</title>
<style>
:root{--b:#1558a6;--ink:#17202a;--mut:#667085;--line:#e4e9f0;--soft:#f5f9ff;--ok:#147a4b}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Tahoma,Arial,sans-serif}.app{max-width:680px;min-height:100vh;margin:auto;background:#fff}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 15px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:21px;font-weight:900}.brand b{color:var(--b)}.step{font-size:10px;color:var(--mut)}.bar{height:4px;background:#edf1f5;margin-top:9px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b);width:10%}.wrap{padding:18px 14px 110px}h1{font-size:21px;margin:0 0 6px;line-height:1.5}.sub{font-size:11px;color:var(--mut);line-height:1.9;margin-bottom:12px}.card{border:1px solid var(--line);border-radius:17px;padding:13px;margin:10px 0;background:#fff}.notice{border:1px solid #d7e7f7;background:#f7fbff;border-radius:14px;padding:10px 11px;font-size:10px;line-height:1.9;margin:10px 0}.label{display:block;font-size:12px;font-weight:700;margin:12px 0 7px}.input,.text{width:100%;border:1px solid #d5dce5;border-radius:13px;padding:12px;font:inherit;font-size:12px}.text{min-height:85px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{border:1px solid #d8dee7;background:#fff;border-radius:13px;padding:11px 8px;font:inherit;font-size:11px;line-height:1.6;cursor:pointer;text-align:right}.choice.on{border-color:#77a9dd;background:#edf6ff;color:#0b4d95;font-weight:700}.center{text-align:center}.yn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.small{font-size:9px;color:var(--mut);line-height:1.8}.teeth{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;direction:ltr;margin:5px 0}.tooth{min-height:32px;border:1px solid #dce3eb;background:#fff;border-radius:8px;font-size:9px}.tooth.on{background:#e9f4ff;border-color:#5d9dde;color:#07498b;font-weight:800}.med{padding:10px 0;border-bottom:1px solid #eef1f5}.med:last-child{border-bottom:0}.med b{font-size:11px}.sample{width:100%;max-height:290px;object-fit:contain;border:1px solid var(--line);border-radius:14px;background:#fafafa;margin:8px 0}.evidence{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}.evidence h3{font-size:12px;margin:0 0 5px}.evidence p{font-size:9px;color:var(--mut);line-height:1.7;margin:0 0 7px}.file{width:100%;font-size:10px}.skip{border:0;background:transparent;text-decoration:underline;color:var(--mut);font:inherit;font-size:9px;padding:7px 2px;cursor:pointer}.ok{font-size:9px;color:var(--ok);margin-top:4px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:7px}.photo{border:1px solid var(--line);border-radius:13px;padding:9px}.photo b{display:block;font-size:10px;margin-bottom:6px}.sum{background:#fbfdff}.sumrow{display:grid;grid-template-columns:110px 1fr;gap:7px;padding:8px 0;border-bottom:1px solid #edf1f5;font-size:10px;line-height:1.7}.sumrow:last-child{border:0}.done{border:1px solid #cfe8da;background:#f4fbf7;color:#165c3c;border-radius:14px;padding:11px;font-size:11px;line-height:1.8}.consent{display:flex;gap:7px;align-items:flex-start;font-size:9px;line-height:1.8;margin-top:11px}.sticky{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:auto;padding:22px 14px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;background:linear-gradient(transparent,#fff 24%);z-index:6}.btn{border:0;border-radius:13px;padding:13px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}.primary{flex:1;background:var(--b);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:500px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.sumrow{grid-template-columns:95px 1fr}}
</style></head>
<body><div class="app"><header class="top"><div class="row"><div class="brand">دکتر<b>لینک</b></div><div id="step" class="step"></div></div><div class="bar"><i id="bar"></i></div></header><main class="wrap"><h1 id="title"></h1><div id="sub" class="sub"></div><div id="root"></div></main><div class="sticky"><button id="back" class="btn ghost hidden">قبلی</button><button id="next" class="btn primary">ادامه</button></div></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),root=$('root'),title=$('title'),sub=$('sub'),st=$('step'),bar=$('bar'),next=$('next'),back=$('back'),KEY='drlinq_implant_pilot_v1';
const fresh={problem:'',other:'',regions:[],teeth:[],present:'unknown',since:'',symptoms:[],pain:'no',painLevel:'',swelling:'no',prior:[],medical:{},details:{},records:{opg:'',cbct:'',other:''},photos:{front:'',upper:'',lower:'',right:'',left:''},question:'',name:'',mobile:'',city:'اهواز',consent:false};let s=Object.assign({},fresh,JSON.parse(localStorage.getItem(KEY)||'{}'));s.medical=Object.assign({},fresh.medical,s.medical||{});s.details=Object.assign({},fresh.details,s.details||{});s.records=Object.assign({},fresh.records,s.records||{});s.photos=Object.assign({},fresh.photos,s.photos||{});let n=0;
const steps=[['مشکل اصلی شما چیست؟','یکی از گزینه‌ها را انتخاب کنید یا با زبان خودتان بنویسید.'],['محل مشکل کجاست؟','ناحیه کلی کافی است؛ اگر می‌دانید دندان دقیق را هم انتخاب کنید.'],['وضعیت فعلی دندان','چند سؤال کوتاه برای کامل‌تر شدن پرونده.'],['درمان‌های قبلی همین ناحیه','هر موردی که قبلاً انجام شده انتخاب کنید.'],['چند سؤال درباره سلامتی شما','فقط اطلاعاتی که برای دندانپزشک مهم است.'],['عکس و رادیوگرافی','اگر دارید بفرستید؛ اگر ندارید، بدون مشکل ادامه دهید.'],['عکس‌های داخل دهان','برای بررسی بهتر، هر تعداد که می‌توانید ارسال کنید.'],['سؤال اصلی و تماس','آخرین بخش؛ مهم‌ترین سؤال خودتان را هم بنویسید.'],['خلاصه پرونده','این خلاصه چیزی است که دندانپزشک می‌بیند.']];
const problems=['یک دندان از دست داده‌ام','چند دندان از دست داده‌ام','دندانم شکسته یا خراب شده','دندان لق دارم','دندان مصنوعی دارم','ایمپلنت قبلی مشکل دارد','درد یا عفونت دارم','نمی‌دانم چه درمانی لازم دارم'];const regions=['فک بالا کامل','بالا راست','بالا جلو','بالا چپ','فک پایین کامل','پایین راست','پایین جلو','پایین چپ','چند ناحیه','نمی‌دانم'];const symptoms=['درد','لق شدن','شکستگی','تورم یا عفونت','ترشح','گفته‌اند احتمالاً باید کشیده شود','علامت دیگری ندارم','نمی‌دانم'];const prior=['کشیدن دندان','عصب‌کشی','جراحی','پیوند استخوان','ایمپلنت','درمان دیگر','هیچ‌کدام','نمی‌دانم'];const meds=[['diabetes','دیابت'],['heart','بیماری قلبی یا فشار خون'],['blood','داروی رقیق‌کننده خون'],['smoke','سیگار یا قلیان'],['cancer','سرطان یا شیمی‌درمانی'],['radiation','پرتودرمانی سر و گردن'],['osteo','پوکی استخوان'],['bone','داروی خاص برای استخوان/پوکی استخوان'],['allergy','حساسیت دارویی'],['disease','بیماری مهم دیگر'],['regular','داروی دائمی']];
const OPG='https://imaging.heartofengland.nhs.uk/wp-content/uploads/2017/01/OPG.jpg',CBCT='https://www.smileolympia.com/wp-content/uploads/2022/10/CBCT-_Jaw_Scan.jpg',INTRA='https://www.shinshikai.com/sogo/img/haguki/haguki_img_10.png';
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function e(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function tog(a,v){const i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);save();render()}function one(v,c,a){return `<button class="choice ${c===v?'on':''}" ${a}="${e(v)}">${e(v)}</button>`}function many(v,a,k){return `<button class="choice ${a.includes(v)?'on':''}" ${k}="${e(v)}">${e(v)}</button>`}
function render(){title.textContent=steps[n][0];sub.textContent=steps[n][1];st.textContent=`مرحله ${n+1} از ${steps.length}`;bar.style.width=((n+1)/steps.length*100)+'%';back.classList.toggle('hidden',n===0);next.textContent=n===steps.length-1?'پایان':'ادامه';root.innerHTML=[p0,p1,p2,p3,p4,p5,p6,p7,p8][n]();bind()}
function p0(){return `<div class="card"><label class="label">جست‌وجو یا توضیح مشکل</label><input id="other" class="input" placeholder="مثلاً دندانم شکسته، ایمپلنت می‌خواهم..." value="${e(s.other)}"><div class="grid" style="margin-top:9px">${problems.map(v=>one(v,s.problem,'data-problem')).join('')}</div><p class="small">اگر گزینه مناسب نیست، همان بالا مشکل را بنویسید.</p></div>`}
function teeth(arr){return arr.map(x=>`<button class="tooth ${s.teeth.includes(String(x))?'on':''}" data-tooth="${x}">${x}</button>`).join('')}function p1(){return `<div class="card"><div class="grid">${regions.map(v=>many(v,s.regions,'data-region')).join('')}</div></div><div class="card"><b class="label">شماره دندان (اختیاری)</b><div class="small">اگر شماره را نمی‌دانید، لازم نیست چیزی انتخاب کنید.</div><div class="small row"><span>راست بیمار</span><span>چپ بیمار</span></div><div class="teeth">${teeth([18,17,16,15,14,13,12,11])}${teeth([21,22,23,24,25,26,27,28])}</div><div class="teeth">${teeth([48,47,46,45,44,43,42,41])}${teeth([31,32,33,34,35,36,37,38])}</div></div>`}
function yn(cur,k){return `<div class="yn">${[['yes','بله'],['no','خیر'],['unknown','نمی‌دانم']].map(x=>`<button class="choice center ${cur===x[0]?'on':''}" ${k}="${x[0]}">${x[1]}</button>`).join('')}</div>`}function p2(){return `<div class="card"><label class="label">دندان در محل موردنظر هنوز وجود دارد؟</label>${yn(s.present,'data-present')}${s.present==='no'?`<label class="label">تقریباً چه مدت از کشیدن یا از دست دادن آن می‌گذرد؟</label><div class="grid">${['کمتر از ۳ ماه','۳ تا ۶ ماه','۶ تا ۱۲ ماه','۱ تا ۳ سال','بیشتر از ۳ سال','نمی‌دانم'].map(v=>one(v,s.since,'data-since')).join('')}</div>`:''}<label class="label">الان چه علائمی دارید؟</label><div class="grid">${symptoms.map(v=>many(v,s.symptoms,'data-symptom')).join('')}</div><label class="label">درد دارید؟</label>${yn(s.pain,'data-pain')}${s.pain==='yes'?`<label class="label">شدت درد</label><div class="grid">${['خفیف','متوسط','شدید'].map(v=>one(v,s.painLevel,'data-level')).join('')}</div>`:''}<label class="label">تورم، چرک یا ترشح دارید؟</label>${yn(s.swelling,'data-swelling')}</div>`}
function p3(){return `<div class="card"><div class="grid">${prior.map(v=>many(v,s.prior,'data-prior')).join('')}</div><p class="small">می‌توانید چند مورد را انتخاب کنید.</p></div>`}function med(k,l){const v=s.medical[k]||'';return `<div class="med"><b>${l}</b>${yn(v,`data-med-${k}`)}${v==='yes'?`<input class="input" style="margin-top:7px" data-detail="${k}" placeholder="اگر لازم است نام دارو یا توضیح کوتاه بنویسید" value="${e(s.details[k]||'')}">`:''}</div>`}function p4(){return `<div class="card">${meds.map(x=>med(x[0],x[1])).join('')}</div><div class="notice">دکترلینک خودش تشخیص یا تجویز انجام نمی‌دهد؛ این اطلاعات برای دندانپزشک آماده می‌شود.</div>`}
function ev(k,t,d,img){const v=s.records[k]||'';return `<div class="evidence">${img?`<img class="sample" src="${img}" alt="نمونه ${t}">`:''}<h3>${t}</h3><p>${d}</p><input class="file" type="file" accept="image/*,.pdf" data-record="${k}"><div><button class="skip" data-rskip="${k}" data-v="ندارم">ندارم</button> · <button class="skip" data-rskip="${k}" data-v="الان در دسترسم نیست">الان در دسترسم نیست</button></div>${v?`<div class="ok">${e(v)}</div>`:''}</div>`}function p5(){return `<div class="notice"><b>برای بررسی دقیق‌تر، اگر این تصاویر را دارید ارسال کنید.</b><br>نداشتن آن‌ها مانع ادامه نیست.</div>${ev('opg','OPG (پانورامیک)','نمونه این نوع عکس را ببینید.',OPG)}${ev('cbct','CBCT (سه‌بعدی)','اگر قبلاً گرفته‌اید، ارسال کنید.',CBCT)}${ev('other','رادیوگرافی یا گزارش دیگر','هر مدرک قبلی مرتبط با همین ناحیه.','')}`}
function ph(k,t){const v=s.photos[k]||'';return `<div class="photo"><b>${t}</b><input class="file" type="file" accept="image/*" capture="environment" data-photo="${k}"><button class="skip" data-pskip="${k}">الان نمی‌توانم</button>${v?`<div class="ok">${e(v)}</div>`:''}</div>`}function p6(){return `<div class="notice"><b>برای جواب بهتر، این ۵ زاویه کمک زیادی می‌کنند.</b><br>اگر بعضی را نمی‌توانید بگیرید، مشکلی نیست.</div><img class="sample" src="${INTRA}" alt="نمونه پنج نمای داخل دهان"><div class="photos">${ph('front','۱. روبه‌رو')}${ph('upper','۲. فک بالا')}${ph('lower','۳. فک پایین')}${ph('right','۴. سمت راست بیمار')}${ph('left','۵. سمت چپ بیمار')}</div>`}
function p7(){return `<div class="card"><label class="label">اگر همین الان روبه‌روی دندانپزشک بودید، مهم‌ترین سؤال شما چیست؟</label><textarea id="question" class="text" placeholder="مثلاً آیا با شرایط من امکان ایمپلنت وجود دارد؟">${e(s.question)}</textarea><label class="label">نام</label><input id="name" class="input" value="${e(s.name)}"><label class="label">شماره موبایل</label><input id="mobile" class="input" inputmode="tel" value="${e(s.mobile)}"><label class="label">شهر</label><input id="city" class="input" value="${e(s.city)}"><label class="consent"><input id="consent" type="checkbox" ${s.consent?'checked':''}><span>اجازه می‌دهم این اطلاعات برای بررسی اولیه در اختیار دندانپزشک/مرکز درمانی همکار دکترلینک قرار بگیرد.</span></label></div>`}
function list(a){return a&&a.length?a.join('، '):'—'}function medsum(){return meds.filter(x=>s.medical[x[0]]==='yes').map(x=>x[1]+(s.details[x[0]]?` (${s.details[x[0]]})`:'' )).join('، ')||'مورد مهمی ثبت نشده'}function p8(){const prob=s.problem||s.other||'—';const pc=Object.values(s.photos).filter(v=>v&&v!=='الان نمی‌توانم').length;return `<div class="done">پرونده آماده مرور است. این خلاصه برای دندانپزشک سریع‌خوان طراحی شده.</div><div class="card sum"><div class="sumrow"><b>مشکل اصلی</b><span>${e(prob)}</span></div><div class="sumrow"><b>محل</b><span>${e(list(s.regions))}${s.teeth.length?'<br>دندان: '+e(s.teeth.join('، ')):''}</span></div><div class="sumrow"><b>علائم</b><span>${e(list(s.symptoms))}</span></div><div class="sumrow"><b>درد</b><span>${s.pain==='yes'?'بله '+e(s.painLevel):s.pain==='unknown'?'نمی‌دانم':'خیر'}</span></div><div class="sumrow"><b>درمان قبلی</b><span>${e(list(s.prior))}</span></div><div class="sumrow"><b>پزشکی/دارو</b><span>${e(medsum())}</span></div><div class="sumrow"><b>OPG</b><span>${e(s.records.opg||'ثبت نشده')}</span></div><div class="sumrow"><b>CBCT</b><span>${e(s.records.cbct||'ثبت نشده')}</span></div><div class="sumrow"><b>عکس دهان</b><span>${pc} از ۵</span></div><div class="sumrow"><b>سؤال بیمار</b><span>${e(s.question||'—')}</span></div><div class="sumrow"><b>تماس</b><span>${e(s.name)} · ${e(s.mobile)} · ${e(s.city)}</span></div></div><div class="notice">نسخه فعلی برای بررسی مسیر و ظاهر است؛ هنوز اطلاعات واقعاً برای پزشک ارسال نمی‌شود.</div>`}
function bind(){document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>{s.problem=b.dataset.problem;s.other='';save();render()});const o=$('other');if(o)o.oninput=x=>{s.other=x.target.value;if(s.other.trim())s.problem='';save()};document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>tog(s.regions,b.dataset.region));document.querySelectorAll('[data-tooth]').forEach(b=>b.onclick=()=>tog(s.teeth,b.dataset.tooth));document.querySelectorAll('[data-present]').forEach(b=>b.onclick=()=>{s.present=b.dataset.present;save();render()});document.querySelectorAll('[data-since]').forEach(b=>b.onclick=()=>{s.since=b.dataset.since;save();render()});document.querySelectorAll('[data-symptom]').forEach(b=>b.onclick=()=>tog(s.symptoms,b.dataset.symptom));document.querySelectorAll('[data-pain]').forEach(b=>b.onclick=()=>{s.pain=b.dataset.pain;save();render()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{s.painLevel=b.dataset.level;save();render()});document.querySelectorAll('[data-swelling]').forEach(b=>b.onclick=()=>{s.swelling=b.dataset.swelling;save();render()});document.querySelectorAll('[data-prior]').forEach(b=>b.onclick=()=>tog(s.prior,b.dataset.prior));meds.forEach(x=>document.querySelectorAll(`[data-med-${x[0]}]`).forEach(b=>b.onclick=()=>{s.medical[x[0]]=b.getAttribute(`data-med-${x[0]}`);save();render()}));document.querySelectorAll('[data-detail]').forEach(i=>i.oninput=x=>{s.details[i.dataset.detail]=x.target.value;save()});document.querySelectorAll('[data-record]').forEach(i=>i.onchange=x=>{if(x.target.files[0]){s.records[i.dataset.record]='فایل انتخاب شد: '+x.target.files[0].name;save();render()}});document.querySelectorAll('[data-rskip]').forEach(b=>b.onclick=()=>{s.records[b.dataset.rskip]=b.dataset.v;save();render()});document.querySelectorAll('[data-photo]').forEach(i=>i.onchange=x=>{if(x.target.files[0]){s.photos[i.dataset.photo]='عکس انتخاب شد';save();render()}});document.querySelectorAll('[data-pskip]').forEach(b=>b.onclick=()=>{s.photos[b.dataset.pskip]='الان نمی‌توانم';save();render()});['question','name','mobile','city'].forEach(k=>{const x=$(k);if(x)x.oninput=v=>{s[k]=v.target.value;save()}});const c=$('consent');if(c)c.onchange=x=>{s.consent=x.target.checked;save()}}
function valid(){if(n===0&&!s.problem&&!s.other.trim()){alert('لطفاً مشکل را انتخاب کنید یا بنویسید.');return false}if(n===1&&!s.regions.length&&!s.teeth.length){alert('لطفاً یک ناحیه یا «نمی‌دانم» را انتخاب کنید.');return false}if(n===7&&(!s.name.trim()||!s.mobile.trim()||!s.consent)){alert('نام، موبایل و اجازه ارسال اطلاعات لازم است.');return false}return true}next.onclick=()=>{if(n===8){alert('نسخه آزمایشی پایان یافت.');return}if(!valid())return;n++;render();scrollTo(0,0)};back.onclick=()=>{if(n){n--;render();scrollTo(0,0)}};render()})();
</script></body></html>
