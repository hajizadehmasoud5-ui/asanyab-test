<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دکترلینک | ارزیابی اولیه ایمپلنت</title>
<style>
:root{--g:#119b70;--gd:#087d59;--gs:#edf9f5;--gl:#bfe7d8;--ink:#1c252b;--mut:#7b858d;--line:#e2e7e5;--bg:#f2f6f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,textarea{font:inherit}
.app{width:100%;max-width:520px;min-height:100svh;margin:auto;background:#fff;position:relative}
.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(14px);padding:17px 18px 13px;border-bottom:1px solid #edf1ef}
.toprow{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:900}.brand b{color:var(--g)}
.step{font-size:13px;font-weight:750;color:#7d878e}
.progress{height:6px;margin-top:12px;background:#e8eeeb;border-radius:999px;overflow:hidden}
.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--g),#46b991);border-radius:999px}
.wrap{padding:22px 18px 130px}
.intro{margin:2px 0 22px}.intro h1{margin:0 0 9px;font-size:29px;line-height:1.42;font-weight:950}
.intro p{margin:0;font-size:16px;line-height:1.9;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 7px 28px #1c6a4c0b}
.choices{display:grid;gap:10px}
.choice{position:relative;width:100%;min-height:68px;border:1.5px solid #dde4e1;border-radius:17px;background:#fff;color:#263038;padding:15px 53px 15px 16px;text-align:right;font-size:17px;font-weight:720;line-height:1.6;cursor:pointer}
.choice::after{content:"";position:absolute;right:17px;top:50%;transform:translateY(-50%);width:21px;height:21px;border:2px solid #b8c2bd;border-radius:50%;background:#fff}
.choice.on{border-color:var(--g);background:var(--gs);color:var(--gd);font-weight:850}
.choice.on::after{border-color:var(--g);background:var(--g);box-shadow:inset 0 0 0 4px #fff}
.choice.multi::after{border-radius:6px}
.label{display:block;margin:20px 3px 10px;font-size:17px;font-weight:850}
.subchoices,.healthgrid,.jawparts{display:grid;gap:8px}
.subchoices{margin-top:10px;padding:11px;border-radius:16px;background:#f7fbf9}
.subchoices .choice,.healthgrid .choice,.jawparts .choice{min-height:58px;font-size:16px}
.jawmain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jawmain .choice{min-height:90px;text-align:center;font-size:19px;padding:16px 45px 16px 12px}
.jaw-block{margin-top:12px;padding:12px;border:1px solid #e1e8e5;border-radius:18px;background:#fafdfc}
.jaw-block-title{font-size:14px;font-weight:900;color:#4f625a;margin:0 2px 8px}
.jawparts{grid-template-columns:repeat(3,1fr)}
.jawparts .choice{min-height:52px;padding:10px 39px 10px 8px;font-size:14px}
.mouthchart{margin-top:14px;border:1px solid #dce7e2;border-radius:24px;padding:17px 9px 18px;background:linear-gradient(180deg,#fbfefd,#f1faf6)}
.mouthchart h3{text-align:center;margin:0 0 5px}
.mut{font-size:14px;line-height:1.8;color:#808b91}
.patient-side{display:flex;justify-content:space-between;gap:10px;margin:14px 3px 5px;color:#89948f;font-size:11px;font-weight:800}
.archline{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:1px;direction:ltr;align-items:end;margin:8px 0 12px}
.toothbtn{min-width:0;border:0;background:transparent;padding:0 1px;cursor:pointer;color:#6f7b76;display:flex;flex-direction:column;align-items:center;gap:2px}
.toothbtn svg{display:block;width:100%;max-width:25px;height:39px;overflow:visible}
.toothbtn path{fill:#fff;stroke:#aeb9b4;stroke-width:1.55;vector-effect:non-scaling-stroke;transition:.15s}
.toothbtn.on path{fill:#b9ead9;stroke:var(--g);stroke-width:2}
.toothbtn .num{font-size:9px;line-height:1;font-weight:850;direction:ltr}
.toothbtn.on .num{color:var(--gd)}
.archline.lower{align-items:start;margin-top:15px}
.archline.lower .toothbtn{flex-direction:column-reverse}
.archline.lower svg{transform:scaleY(-1)}
.archline .toothbtn:nth-child(1),.archline .toothbtn:nth-child(16){transform:translateY(6px)}
.archline .toothbtn:nth-child(2),.archline .toothbtn:nth-child(15){transform:translateY(4px)}
.archline .toothbtn:nth-child(3),.archline .toothbtn:nth-child(14){transform:translateY(2px)}
.chart-hint{text-align:center;margin-top:5px;font-size:11px;color:#8b9591;line-height:1.7}
.healthgrid .choice::after{border-radius:6px}
.input,.text{width:100%;border:1.5px solid #d9e1dd;border-radius:16px;background:#fff;color:#1c252b;font-size:17px;padding:15px 16px;outline:0}
.text{min-height:110px;resize:vertical}
.input:focus,.text:focus{border-color:var(--g);box-shadow:0 0 0 4px #e8f8f2}
.notice{margin:0 0 15px;border:1px solid var(--gl);border-radius:18px;background:#f0faf6;color:#40665a;padding:14px 15px;font-size:14px;line-height:1.9}
.upload-row{display:grid;grid-template-columns:42% 58%;gap:10px;align-items:stretch;margin:11px 0;border:1px solid #dfe6e3;border-radius:20px;background:#fff;padding:9px;min-height:164px;box-shadow:0 6px 20px #184c380b}
.samplebox{border-radius:15px;overflow:hidden;background:#edf2f0;display:flex;align-items:center;justify-content:center;min-height:145px}
.samplebox img{width:100%;height:100%;min-height:145px;object-fit:cover;display:block}
.uploadside{display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0}
.uploadside b{font-size:17px;font-weight:900}.uploadside p{margin:0;color:#89928f;font-size:12px;line-height:1.65}
.fileinput{display:none}
.uploadbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border:1.5px dashed #55b996;border-radius:13px;background:#f7fcfa;color:var(--gd);padding:9px 7px;font-size:14px;font-weight:850;cursor:pointer}
.secondary{border-style:solid;border-color:#dde4e1;background:#fff;color:#596560}
.statusopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{min-height:37px;border:1px solid #e0e5e3;border-radius:11px;background:#fff;padding:6px 4px;color:#616b67;font-size:11px;font-weight:700}
.mini.on{border-color:var(--g);background:var(--gs);color:var(--gd)}
.statusline{font-size:12px;font-weight:850;color:var(--gd)}
.question-guide{margin-bottom:12px;border:1px solid var(--gl);border-radius:17px;background:#f1faf6;padding:13px 14px;color:#355f52}
.question-guide b{display:block;font-size:15px;line-height:1.8}
.question-guide p{margin:5px 0 0;font-size:12px;line-height:1.8;color:#658078}
.question-options{display:grid;gap:9px}
.question-option{position:relative;width:100%;min-height:64px;border:1.5px solid #dde4e1;border-radius:16px;background:#fff;color:#263038;padding:12px 48px 12px 12px;text-align:right;font-size:15px;font-weight:720;line-height:1.75;cursor:pointer}
.question-option::before{content:"";position:absolute;right:16px;top:50%;transform:translateY(-50%);width:21px;height:21px;border:2px solid #b8c2bd;border-radius:6px;background:#fff}
.question-option.on{border-color:var(--g);background:var(--gs);color:var(--gd);font-weight:820}
.question-option.on::before{content:"✓";display:flex;align-items:center;justify-content:center;border-color:var(--g);background:var(--g);color:#fff;font-size:14px;font-weight:950}
.question-limit{margin:8px 3px 2px;color:#7b858d;font-size:12px;line-height:1.8}
.custom-question-toggle{width:100%;min-height:52px;margin-top:13px;border:1.5px dashed #78bca4;border-radius:15px;background:#f8fcfa;color:var(--gd);font-size:14px;font-weight:850;cursor:pointer}
.custom-question-box{margin-top:4px}
.done{margin-bottom:13px;border:1px solid var(--gl);border-radius:18px;background:#edf9f5;color:#236b55;padding:15px;font-size:16px;font-weight:850}
.done strong{display:block;font-size:21px;margin-bottom:6px}.case-id{display:inline-block;direction:ltr;margin-top:8px;padding:7px 10px;border-radius:10px;background:#fff;border:1px solid var(--gl);font-weight:950}.submit-error{margin-top:13px;border:1px solid #efc3bf;border-radius:14px;background:#fff4f2;color:#a52a20;padding:12px;font-size:13px;line-height:1.8}.new-case{width:100%;margin-top:14px}
.summary{padding:15px 16px}
.sumrow{display:grid;grid-template-columns:112px 1fr;gap:9px;padding:11px 0;border-bottom:1px solid #eef1f0;font-size:14px;line-height:1.8}
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:14px;line-height:1.85}
.consent input{width:21px;height:21px;accent-color:var(--g)}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:520px;padding:26px 18px max(15px,env(safe-area-inset-bottom));display:flex;gap:9px;background:linear-gradient(transparent,#fff 25%)}
.btn{min-height:59px;border-radius:17px;border:0;padding:13px 18px;font-size:17px;font-weight:900}
.primary{flex:1;color:#fff;background:linear-gradient(135deg,var(--g),var(--gd))}
.ghost{min-width:92px;background:#fff;color:#4c5953;border:1px solid #dfe5e2}
.hidden{display:none!important}
@media(max-width:390px){
  .wrap{padding:18px 14px 126px}.top{padding:15px 14px 12px}.intro h1{font-size:26px}.intro p{font-size:15px}
  .choice{font-size:16px;min-height:64px}.upload-row{grid-template-columns:40% 60%;gap:8px}.uploadside b{font-size:15px}.uploadbtn{font-size:12px}
  .mouthchart{padding-left:5px;padding-right:5px}.toothbtn{padding:0}.toothbtn svg{height:34px}.toothbtn .num{font-size:8px}.jawparts .choice{font-size:12px;padding-right:31px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="toprow"><div class="brand">دکتر<b>لینک</b></div><div id="step" class="step"></div></div><div class="progress"><i id="bar"></i></div></header>
  <main class="wrap"><div id="root"></div></main>
  <div class="sticky"><button id="back" class="btn ghost hidden">قبلی</button><button id="next" class="btn primary">ادامه</button></div>
</div>
<script src="assets/opg-real.js"></script>
<script src="assets/cbct-real.js"></script>
<script src="assets/front-real.js"></script>
<script src="assets/upper-real.js"></script>
<script src="assets/lower-real.js"></script>
<script src="assets/right-real.js"></script>
<script src="assets/left-real.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),root=$('root'),stepEl=$('step'),bar=$('bar'),next=$('next'),back=$('back'),KEY='drlinq_implant_pilot_v5',API='implant-api';
const IMG={opg:window.DR_OPG,cbct:window.DR_CBCT,front:window.DR_FRONT,upper:window.DR_UPPER,lower:window.DR_LOWER,right:window.DR_RIGHT,left:window.DR_LEFT};
const newId=()=>{if(crypto.randomUUID)return crypto.randomUUID();const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=[...bytes].map(value=>value.toString(16).padStart(2,'0')).join('');return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`};
const fresh={submissionKey:newId(),completedCaseId:'',problem:'',missingCount:'',jaws:[],jawParts:{upper:'',lower:''},teeth:[],medical:{},diseaseText:'',medText:'',records:{opg:'',cbct:''},photos:{front:'',upper:'',lower:'',right:'',left:''},suggestedQuestions:[],questionContext:'',customQuestionOpen:false,question:'',name:'',mobile:'',city:'اهواز',consent:false};
let s=Object.assign({},fresh,JSON.parse(localStorage.getItem(KEY)||'{}'));
s.jaws=Array.isArray(s.jaws)?s.jaws:[];
s.jawParts=Object.assign({},fresh.jawParts,s.jawParts||{});
s.teeth=Array.isArray(s.teeth)?s.teeth:[];
s.medical=Object.assign({},fresh.medical,s.medical||{});
s.records=Object.assign({},fresh.records,s.records||{});
s.photos=Object.assign({},fresh.photos,s.photos||{});
s.suggestedQuestions=Array.isArray(s.suggestedQuestions)?s.suggestedQuestions:[];
s.customQuestionOpen=Boolean(s.customQuestionOpen||s.question);
if(!s.submissionKey)s.submissionKey=newId();
const selectedFiles={};
for(const group of [s.records,s.photos])for(const key of Object.keys(group))if(String(group[key]).startsWith('فایل انتخاب شد')||String(group[key]).startsWith('عکس انتخاب شد'))group[key]='فایل را دوباره انتخاب کنید';
let n=s.completedCaseId?6:0,submitError='',submitting=false;
const steps=[
['برای چه مشکلی می‌خواهید ایمپلنت انجام دهید؟','گزینه‌ای را انتخاب کنید که دقیق‌تر شبیه وضعیت شماست.'],
['محل مشکل کجاست؟','فک بالا، فک پایین یا هر دو را انتخاب کنید؛ اگر دندان دقیق را می‌دانید روی چارت هم علامت بزنید.'],
['چند سؤال درباره سلامتی شما','اطلاعات بیماری‌ها و داروهای مصرفی را وارد کنید.'],
['عکس‌های رادیوگرافی','اگر OPG یا CBCT دارید، برای بررسی دقیق‌تر ارسال کنید.'],
['عکس‌های داخل دهان','نمونه واقعی را ببینید و همان زاویه را با دوربین بگیرید یا از گوشی انتخاب کنید.'],
['سؤال اصلی و تماس','یک یا دو سؤال پیشنهادی را انتخاب کنید؛ اگر سؤال دیگری دارید، خودتان بنویسید.'],
['خلاصه پرونده','این خلاصه برای مرور دندانپزشک آماده می‌شود.']
];
const problems=['دندان از دست رفته دارم','دندان مصنوعی دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان لق دارم و می‌خواهم با ایمپلنت جایگزین کنم','دندان شکسته یا خراب دارم و می‌خواهم با ایمپلنت جایگزین کنم','ایمپلنت قبلی‌ام مشکل دارد و می‌خواهم بررسی شود'];
const counts=['۱ دندان','۲ تا ۳ دندان','چند دندان','نیم‌فک','فک کامل'];
const questionSets={
  single:[
    'آیا ممکن است برای این ناحیه به پیوند استخوان یا سینوس‌لیفت نیاز داشته باشم؟',
    'آیا ایمپلنت فوری برای من امکان‌پذیر است؟',
    'چند جلسه و چه مدت تا تحویل روکش نهایی طول می‌کشد؟',
    'هزینه کامل ایمپلنت همراه با روکش حدوداً چقدر می‌شود؟'
  ],
  multiple:[
    'برای جایگزینی این دندان‌ها تقریباً چند پایه ایمپلنت لازم است؟',
    'ایمپلنت‌های جداگانه بهتر است یا بریج روی ایمپلنت؟',
    'آیا در مدت درمان می‌توانم دندان موقت داشته باشم؟',
    'هزینه و مدت کامل درمان تقریباً چقدر می‌شود؟'
  ],
  full:[
    'برای شرایط من پروتز ثابت روی ایمپلنت بهتر است یا اوردنچر؟',
    'تقریباً چند پایه ایمپلنت برای هر فک لازم است؟',
    'آیا می‌توانم روز جراحی دندان موقت دریافت کنم؟',
    'هزینه و مدت کامل درمان هر فک تقریباً چقدر می‌شود؟'
  ],
  salvage:[
    'آیا این دندان قابل نگهداری است یا واقعاً باید با ایمپلنت جایگزین شود؟',
    'اگر دندان کشیده شود، امکان ایمپلنت فوری وجود دارد؟',
    'آیا ممکن است قبل از ایمپلنت به پیوند استخوان نیاز داشته باشم؟',
    'مراحل، مدت و هزینه کامل درمان تقریباً چقدر می‌شود؟'
  ],
  existing:[
    'آیا ایمپلنت قبلی قابل نگهداری و درمان است یا باید خارج شود؟',
    'آیا اطراف ایمپلنت تحلیل استخوان ایجاد شده است؟',
    'اگر ایمپلنت خارج شود، امکان کاشت مجدد در همان جلسه وجود دارد؟',
    'مراحل، مدت و هزینه درمان مجدد تقریباً چقدر می‌شود؟'
  ]
};
const medical=[['diabetes','دیابت'],['heart','بیماری قلبی یا فشار خون'],['blood','داروی رقیق‌کننده خون'],['smoke','سیگار یا قلیان'],['osteo','پوکی استخوان'],['bone','داروی مربوط به استخوان/پوکی استخوان'],['cancer','سرطان یا شیمی‌درمانی'],['radiation','پرتودرمانی سر و گردن'],['allergy','حساسیت دارویی'],['other','بیماری مهم دیگر'],['regular','داروی دائمی مصرف می‌کنم']];
const upperTeeth=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const lowerTeeth=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];

function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function choice(v,cur,key,extra=''){return `<button class="choice ${extra} ${cur===v?'on':''}" ${key}="${esc(v)}">${esc(v)}</button>`}
function multiChoice(v,on,key,label,extra='multi'){return `<button class="choice ${extra} ${on?'on':''}" ${key}="${esc(v)}">${esc(label)}</button>`}
function intro(){return `<div class="intro"><h1>${steps[n][0]}</h1><p>${steps[n][1]}</p></div>`}
function render(){const complete=Boolean(s.completedCaseId);stepEl.textContent=`مرحله ${n+1} از ${steps.length}`;bar.style.width=((n+1)/steps.length*100)+'%';back.classList.toggle('hidden',n===0||complete);next.classList.toggle('hidden',complete);next.disabled=submitting;next.textContent=submitting?'در حال ثبت…':n===6?'ثبت پرونده':'ادامه';root.innerHTML=`<section>${intro()}${[screenProblem,screenLocation,screenHealth,screenRecords,screenPhotos,screenContact,screenSummary][n]()}</section>`;bind()}
function screenProblem(){return `<div class="card"><div class="choices">${problems.map(v=>choice(v,s.problem,'data-problem')).join('')}</div>${s.problem===problems[0]?`<label class="label">تقریباً چند دندان؟</label><div class="subchoices">${counts.map(v=>choice(v,s.missingCount,'data-count')).join('')}</div>`:''}</div>`}

function toothPath(num){
  const d=num%10;
  if(d===1||d===2) return 'M8 3 Q15 0 22 3 L21 13 Q20 17 18 20 L18 36 Q18 40 15 40 Q12 40 12 36 L12 20 Q10 17 9 13 Z';
  if(d===3) return 'M7 7 Q10 2 15 1 Q20 2 23 7 L21 15 Q20 18 18 20 L18 36 Q18 40 15 40 Q12 40 12 36 L12 20 Q10 18 9 15 Z';
  if(d===4||d===5) return 'M6 6 Q9 2 12 4 Q15 1 18 4 Q21 2 24 6 L22 16 Q21 19 19 21 L19 35 Q19 40 16 40 Q14 38 15 32 Q15 38 13 40 Q10 40 11 35 L11 21 Q9 19 8 16 Z';
  return 'M4 7 Q7 2 10 5 Q13 1 16 5 Q19 1 22 5 Q25 2 27 7 L24 17 Q23 20 20 22 L20 34 Q20 40 17 40 Q15 37 16 31 Q15 38 13 40 Q10 40 11 34 L11 22 Q8 20 7 17 Z';
}
function toothButton(num,lower=false){
  const on=s.teeth.includes(String(num));
  return `<button type="button" aria-label="دندان ${num}" class="toothbtn ${on?'on':''}" data-tooth="${num}">
    <svg viewBox="0 0 30 42" aria-hidden="true"><path d="${toothPath(num)}"></path></svg><span class="num">${num}</span>
  </button>`;
}
function chart(){
  return `<div class="mouthchart">
    <h3>انتخاب دندان دقیق (اختیاری)</h3>
    <div class="mut" style="text-align:center">شماره‌ها بر اساس سیستم رایج FDI هستند. روی یک یا چند دندان بزنید.</div>
    <div class="patient-side"><span>راست بیمار</span><span>چپ بیمار</span></div>
    <div class="archline upper">${upperTeeth.map(n=>toothButton(n)).join('')}</div>
    <div class="archline lower">${lowerTeeth.map(n=>toothButton(n,true)).join('')}</div>
    <div class="chart-hint">انتخاب دندان، جای انتخاب فک و ناحیه را نمی‌گیرد؛ فقط پرونده را دقیق‌تر می‌کند.</div>
  </div>`;
}
function jawPartBlock(key,title){
  const cur=s.jawParts[key]||'';
  return `<div class="jaw-block"><div class="jaw-block-title">${title}: کدام بخش؟</div><div class="jawparts">${['کامل','سمت راست','سمت چپ'].map(v=>choice(v,cur,`data-part-${key}`,'')).join('')}</div></div>`;
}
function screenLocation(){
  return `<div class="card">
    <div class="jawmain">
      ${multiChoice('upper',s.jaws.includes('upper'),'data-jaw','فک بالا')}
      ${multiChoice('lower',s.jaws.includes('lower'),'data-jaw','فک پایین')}
    </div>
    ${s.jaws.includes('upper')?jawPartBlock('upper','فک بالا'):''}
    ${s.jaws.includes('lower')?jawPartBlock('lower','فک پایین'):''}
  </div>${chart()}`;
}

function screenHealth(){return `<div class="card"><div class="healthgrid">${medical.map(([k,t])=>`<button class="choice ${s.medical[k]?'on':''}" data-med="${k}">${t}</button>`).join('')}</div><label class="label">نام بیماری یا توضیح کوتاه</label><textarea id="diseaseText" class="text" placeholder="مثلاً دیابت دارم...">${esc(s.diseaseText)}</textarea><label class="label">نام داروهایی که مصرف می‌کنید</label><textarea id="medText" class="text" placeholder="مثلاً متفورمین، آسپرین...">${esc(s.medText)}</textarea></div>`}
function evidence(k,title,desc){const st=s.records[k]||'';return `<div class="upload-row"><div class="samplebox"><img src="${IMG[k]}" alt="نمونه واقعی ${title}"></div><div class="uploadside"><b>${title}</b><p>${desc}</p><label class="uploadbtn" for="file-${k}">آپلود تصویر</label><input class="fileinput" id="file-${k}" type="file" accept="image/jpeg,image/png,image/webp,.pdf" data-record-file="${k}"><div class="statusopts"><button class="mini ${st==='ندارم'?'on':''}" data-record-status="${k}|ندارم">ندارم</button><button class="mini ${st==='الان در دسترسم نیست'?'on':''}" data-record-status="${k}|الان در دسترسم نیست">الان در دسترسم نیست</button></div>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}
function screenRecords(){return `<div class="notice"><b>این تصاویر اجباری نیستند.</b><br>اگر دارید ارسال کنید؛ اگر ندارید بدون مشکل ادامه دهید.</div>${evidence('opg','OPG (عکس پانورامیک)','نمونه واقعی عکس پانورامیک.')}${evidence('cbct','CBCT (عکس سه‌بعدی)','اگر قبلاً گرفته‌اید، ارسال کنید.')}`}
function photoRow(k,title){const st=s.photos[k]||'';return `<div class="upload-row"><div class="samplebox"><img src="${IMG[k]}" alt="نمونه واقعی ${title}"></div><div class="uploadside"><b>${title}</b><p>عکس شما تا حد امکان شبیه نمونه واقعی باشد.</p><label class="uploadbtn" for="camera-${k}">عکس بگیر</label><input class="fileinput" id="camera-${k}" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" data-photo-file="${k}"><label class="uploadbtn secondary" for="gallery-${k}">انتخاب از گوشی</label><input class="fileinput" id="gallery-${k}" type="file" accept="image/jpeg,image/png,image/webp" data-photo-file="${k}"><button class="mini ${st==='الان نمی‌توانم'?'on':''}" data-photo-skip="${k}">الان نمی‌توانم</button>${st?`<div class="statusline">${esc(st)}</div>`:''}</div></div>`}
function screenPhotos(){return `<div class="notice"><b>برای پاسخ دقیق‌تر، این ۵ زاویه کمک زیادی می‌کنند.</b><br>نمونه‌های زیر همان عکس‌های واقعی آماده‌شده هستند.</div>${photoRow('front','۱. روبه‌رو')}${photoRow('upper','۲. فک بالا')}${photoRow('lower','۳. فک پایین')}${photoRow('right','۴. سمت راست بیمار')}${photoRow('left','۵. سمت چپ بیمار')}`}
function questionContextKey(){
  if(s.problem===problems[4])return 'existing';
  if(s.problem===problems[2]||s.problem===problems[3])return 'salvage';
  if(s.problem===problems[1]){
    if(s.teeth.length===1)return 'single';
    if(s.teeth.length>1&&s.teeth.length<=3)return 'multiple';
    return 'full';
  }
  if(s.missingCount==='۱ دندان'||(!s.missingCount&&s.teeth.length===1))return 'single';
  if(s.missingCount==='نیم‌فک'||s.missingCount==='فک کامل')return 'full';
  return 'multiple';
}
function currentQuestionSet(){
  const key=questionContextKey();
  if(s.questionContext!==key){s.questionContext=key;s.suggestedQuestions=[];save()}
  return questionSets[key];
}
function screenContact(){
  const suggestions=currentQuestionSet();
  return `<div class="card"><div class="question-guide"><b>براساس وضعیت شما، معمولاً این سؤال‌ها مهم‌اند.</b><p>حداکثر دو مورد را انتخاب کنید. پاسخ نهایی پس از بررسی مدارک و معاینه مشخص می‌شود.</p></div><div class="question-options">${suggestions.map(q=>`<button type="button" class="question-option ${s.suggestedQuestions.includes(q)?'on':''}" data-suggested-question="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="question-limit">${s.suggestedQuestions.length} از ۲ سؤال انتخاب شده</div><button type="button" class="custom-question-toggle" data-custom-question>${s.customQuestionOpen?'بستن سؤال شخصی':'سؤال دیگری دارم'}</button>${s.customQuestionOpen?`<div class="custom-question-box"><label class="label">سؤال خودتان را بنویسید</label><textarea id="question" class="text" placeholder="مثلاً درباره شرایط خاص خودتان بپرسید...">${esc(s.question)}</textarea></div>`:''}<label class="label">نام و نام خانوادگی</label><input id="name" class="input" value="${esc(s.name)}"><label class="label">شماره موبایل</label><input id="mobile" class="input" inputmode="tel" value="${esc(s.mobile)}"><label class="label">شهر</label><input id="city" class="input" value="${esc(s.city)}"></div>`
}
function selectedMedical(){const a=medical.filter(([k])=>s.medical[k]).map(([,t])=>t);return a.length?a.join('، '):'موردی انتخاب نشده'}
function fileCount(group){return Object.keys(selectedFiles).filter(key=>(group===s.records?['opg','cbct']:['front','upper','lower','right','left']).includes(key)).length}
function locationSummary(){
  const parts=[];
  if(s.jaws.includes('upper')) parts.push(`فک بالا${s.jawParts.upper?' · '+s.jawParts.upper:''}`);
  if(s.jaws.includes('lower')) parts.push(`فک پایین${s.jawParts.lower?' · '+s.jawParts.lower:''}`);
  if(s.teeth.length) parts.push(`دندان‌ها: ${s.teeth.join('، ')}`);
  return parts.join(' | ')||'—';
}
function questionsSummary(){
  const items=s.suggestedQuestions.map(q=>`• ${esc(q)}`);
  if(s.question.trim())items.push(`• ${esc(s.question.trim())}`);
  return items.length?items.join('<br>'):'سؤالی ثبت نشده';
}
function screenSummary(){if(s.completedCaseId)return `<div class="done"><strong>پرونده شما ثبت شد</strong>اطلاعات و تصاویر شما برای پزشک ارسال شد.<br><span class="case-id" data-case-id>${esc(s.completedCaseId)}</span></div><div class="notice">این شناسه را برای پیگیری پرونده نگه دارید.</div><button type="button" class="btn secondary new-case" data-new-case>ثبت پرونده جدید</button>`;return `<div class="done">پرونده اولیه آماده مرور است.</div><div class="card summary"><div class="sumrow"><b>دلیل مراجعه</b><span>${esc(s.problem)}${s.missingCount?' · '+esc(s.missingCount):''}</span></div><div class="sumrow"><b>محل</b><span>${esc(locationSummary())}</span></div><div class="sumrow"><b>سلامتی</b><span>${esc(selectedMedical())}</span></div><div class="sumrow"><b>رادیوگرافی</b><span>OPG: ${esc(s.records.opg||'ارسال نشده')}<br>CBCT: ${esc(s.records.cbct||'ارسال نشده')}</span></div><div class="sumrow"><b>عکس‌های داخل دهان</b><span>${fileCount(s.photos)} مورد ثبت شده</span></div><div class="sumrow"><b>سؤال‌های بیمار</b><span>${questionsSummary()}</span></div><div class="sumrow"><b>تماس</b><span>${esc(s.name||'—')} · ${esc(s.mobile||'—')}</span></div></div><label class="consent"><input id="consent" type="checkbox" ${s.consent?'checked':''}><span>اجازه می‌دهم این اطلاعات برای بررسی اولیه در اختیار دندانپزشک قرار گیرد.</span></label>${submitError?`<div class="submit-error">${esc(submitError)}</div>`:''}`}

function bind(){
  document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>{s.problem=b.dataset.problem;if(s.problem!==problems[0])s.missingCount='';s.questionContext='';s.suggestedQuestions=[];save();render()});
  document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{s.missingCount=b.dataset.count;s.questionContext='';s.suggestedQuestions=[];save();render()});
  document.querySelectorAll('[data-jaw]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.jaw, i=s.jaws.indexOf(key);
    if(i>-1){
      s.jaws.splice(i,1);s.jawParts[key]='';
      const allowed=key==='upper'?upperTeeth:lowerTeeth;
      s.teeth=s.teeth.filter(t=>!allowed.includes(Number(t)));
    }else s.jaws.push(key);
    save();render()
  });
  document.querySelectorAll('[data-part-upper]').forEach(b=>b.onclick=()=>{s.jawParts.upper=b.dataset.partUpper;save();render()});
  document.querySelectorAll('[data-part-lower]').forEach(b=>b.onclick=()=>{s.jawParts.lower=b.dataset.partLower;save();render()});
  document.querySelectorAll('[data-tooth]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.tooth,i=s.teeth.indexOf(v),num=Number(v),jaw=upperTeeth.includes(num)?'upper':'lower';
    if(i>-1)s.teeth.splice(i,1);else{s.teeth.push(v);if(!s.jaws.includes(jaw))s.jaws.push(jaw)}
    save();render()
  });
  document.querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>{s.medical[b.dataset.med]=!s.medical[b.dataset.med];save();render()});
  document.querySelectorAll('[data-suggested-question]').forEach(b=>b.onclick=()=>{
    const q=b.dataset.suggestedQuestion,i=s.suggestedQuestions.indexOf(q);
    if(i>-1)s.suggestedQuestions.splice(i,1);
    else if(s.suggestedQuestions.length>=2){alert('حداکثر دو سؤال را انتخاب کنید.');return}
    else s.suggestedQuestions.push(q);
    save();render()
  });
  const custom=document.querySelector('[data-custom-question]');
  if(custom)custom.onclick=()=>{s.customQuestionOpen=!s.customQuestionOpen;save();render()};
  ['diseaseText','medText','question','name','mobile','city'].forEach(id=>{const x=$(id);if(x)x.oninput=()=>{s[id]=x.value;save()}});
  document.querySelectorAll('[data-record-file]').forEach(i=>i.onchange=e=>{const file=e.target.files[0],key=i.dataset.recordFile;if(file&&acceptFile(file,true)){selectedFiles[key]=file;s.records[key]=`فایل انتخاب شد: ${file.name}`;save();render()}});
  document.querySelectorAll('[data-record-status]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.recordStatus.split('|');delete selectedFiles[k];s.records[k]=v;save();render()});
  document.querySelectorAll('[data-photo-file]').forEach(i=>i.onchange=e=>{const file=e.target.files[0],key=i.dataset.photoFile;if(file&&acceptFile(file,false)){selectedFiles[key]=file;s.photos[key]=`عکس انتخاب شد: ${file.name}`;save();render()}});
  document.querySelectorAll('[data-photo-skip]').forEach(b=>b.onclick=()=>{const key=b.dataset.photoSkip;delete selectedFiles[key];s.photos[key]='الان نمی‌توانم';save();render()});
  const c=$('consent');if(c)c.onchange=()=>{s.consent=c.checked;save()}
  const reset=document.querySelector('[data-new-case]');if(reset)reset.onclick=resetCase;
}
function acceptFile(file,allowPdf){
  const allowed=['image/jpeg','image/png','image/webp'],extension=(file.name.split('.').pop()||'').toLowerCase();if(allowPdf)allowed.push('application/pdf');
  const validType=allowed.includes(file.type)||['jpg','jpeg','png','webp'].includes(extension)||(allowPdf&&extension==='pdf');
  if(!validType){alert('فرمت فایل مجاز نیست. فقط JPEG، PNG، WebP و برای رادیوگرافی PDF مجاز است.');return false}
  if(file.size>12*1024*1024){alert('حجم هر فایل باید حداکثر ۱۲ مگابایت باشد.');return false}
  return true
}
function mobileValid(value){const digits=String(value).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s()+-]/g,'');return /^\d{10,15}$/.test(digits)}
function valid(){
  if(n===0&&!s.problem){alert('لطفاً یک گزینه را انتخاب کنید.');return false}
  if(n===0&&s.problem===problems[0]&&!s.missingCount){alert('لطفاً تعداد تقریبی دندان‌ها را انتخاب کنید.');return false}
  if(n===1&&!s.jaws.length){alert('لطفاً فک بالا، فک پایین یا هر دو را انتخاب کنید.');return false}
  if(n===1&&s.jaws.some(j=>!s.jawParts[j])){alert('برای هر فک انتخاب‌شده، کامل، سمت راست یا سمت چپ را مشخص کنید.');return false}
  if(n===5&&(!s.name.trim()||!s.mobile.trim()||!s.city.trim())){alert('لطفاً نام، شماره موبایل و شهر را وارد کنید.');return false}
  if(n===5&&!mobileValid(s.mobile)){alert('شماره موبایل معتبر وارد کنید.');return false}
  if(n===6&&!s.consent){alert('برای پایان، اجازه بررسی اطلاعات را تأیید کنید.');return false}
  return true
}
async function submitCase(){
  if(submitting||s.completedCaseId)return;
  const total=Object.values(selectedFiles).reduce((sum,file)=>sum+file.size,0);if(total>50*1024*1024){alert('حجم مجموع فایل‌ها باید حداکثر ۵۰ مگابایت باشد.');return}
  submitting=true;submitError='';render();
  const form=new FormData();
  form.append('payload',JSON.stringify({submission_key:s.submissionKey,name:s.name,mobile:s.mobile,city:s.city,problem:s.problem,missingCount:s.missingCount,jaws:s.jaws,jawParts:s.jawParts,teeth:s.teeth,medical:s.medical,diseaseText:s.diseaseText,medText:s.medText,suggestedQuestions:s.suggestedQuestions,question:s.question,records:s.records,photos:s.photos,consent:s.consent}));
  for(const [slot,file] of Object.entries(selectedFiles))form.append(slot,file,file.name);
  try{const response=await fetch(`${API}/cases`,{method:'POST',body:form,cache:'no-store'});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.detail||'ثبت پرونده انجام نشد.');s.completedCaseId=data.case_id;save()}catch(error){submitError=error.message==='Failed to fetch'?'ارتباط با سرور برقرار نشد. اینترنت را بررسی و دوباره تلاش کنید.':String(error.message||'ثبت پرونده انجام نشد.')}finally{submitting=false;render();window.scrollTo({top:0,behavior:'smooth'})}
}
function resetCase(){for(const key of Object.keys(selectedFiles))delete selectedFiles[key];s=JSON.parse(JSON.stringify(fresh));s.submissionKey=newId();n=0;submitError='';localStorage.setItem(KEY,JSON.stringify(s));render();window.scrollTo({top:0,behavior:'smooth'})}
next.onclick=()=>{if(!valid())return;if(n<6){n++;render();window.scrollTo({top:0,behavior:'smooth'})}else submitCase()};
back.onclick=()=>{if(n>0){n--;render();window.scrollTo({top:0,behavior:'smooth'})}};
render()
})();
</script>
</body>
</html>
