<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>گزارش درمان | دکتر لینک</title><link rel="stylesheet" href="assets/treatment-report.css"></head><body><main class="shell"><header class="top"><div class="brand">دکتر<b>لینک</b></div><span class="badge">گزارش امن بیمار</span></header><div id="app"></div></main><script type="module">
import{findCase,authorizeDoctor,authorizePatient,patientView,totalEstimate}from'./assets/treatment-report.js';const app=document.getElementById('app'),q=new URLSearchParams(location.search),report=findCase(q.get('case')||''),preview=q.get('preview')==='1',doctorPreview=preview&&authorizeDoctor(report,q.get('token')||''),patientAllowed=authorizePatient(report,q.get('token')||''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=v=>new Intl.NumberFormat('fa-IR').format(Number(v)||0)+' تومان',priority={high:'بالا',medium:'متوسط',low:'پایین'};
if(!patientAllowed&&!doctorPreview)app.innerHTML='<div class="card empty"><h2>لینک امن معتبر نیست</h2></div>';else if(report.status!=='published'&&!doctorPreview)app.innerHTML='<div class="card empty notice"><h2>پرونده شما در حال بررسی است.</h2></div>';else{const view=doctorPreview?patientView({...report,status:'published'}):patientView(report),total=totalEstimate(view.items);app.innerHTML=`${doctorPreview?'<div class="notice">پیش‌نمایش پزشک — این گزارش هنوز برای بیمار منتشر نشده است.</div>':''}<section class="card"><h1>گزارش درمان شما</h1><p>${esc(view.overallSummary)}</p></section><section class="card"><h2>درمان‌های پیشنهادی</h2>${view.items.map(x=>`<article class="report-item"><span class="priority">اولویت ${priority[x.priority]||esc(x.priority)}</span><h3>${esc(x.treatmentLabel)} · ${esc(x.area)}</h3><p>${esc(x.patientExplanation)}</p><p class="price">حدود هزینه: ${money(x.priceMin)} تا ${money(x.priceMax)}</p>${x.condition?`<p class="mut">شرط: ${esc(x.condition)}</p>`:''}</article>`).join('')}</section><section class="card"><h2>برآورد هزینه کل</h2><p class="total">${money(total.min)} تا ${money(total.max)}</p><p class="mut">مبلغ نهایی پس از معاینه و بررسی مدارک مشخص می‌شود.</p></section>${view.offer?`<section class="offer"><h2>پیشنهاد ویژه: ${esc(view.offer.label)}</h2><p>${esc(view.offer.description)}</p></section>`:''}<section class="card"><h2>قدم بعدی</h2><p>${esc(view.nextStep)}</p><a class="btn primary cta" href="tel:02100000000">رزرو معاینه</a></section>`}
</script></body></html>
