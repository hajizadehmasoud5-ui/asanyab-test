<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مرور پزشک | دکتر لینک</title><link rel="stylesheet" href="assets/treatment-report.css"></head><body><main class="shell"><header class="top"><div class="brand">دکتر<b>لینک</b></div><span class="badge">Treatment Report V1 · Doctor</span></header><div id="app"></div></main><script type="module">
import{findCase,saveCase,authorizeDoctor,treatmentLibrary,offerLibrary,totalEstimate,validateReport}from'./assets/treatment-report.js';
const app=document.getElementById('app'),q=new URLSearchParams(location.search),token=q.get('token')||'';let report=findCase(q.get('case')||'');const treatments=treatmentLibrary(),offers=offerLibrary(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=v=>new Intl.NumberFormat('fa-IR').format(Number(v)||0)+' تومان';
if(!authorizeDoctor(report,token))app.innerHTML='<div class="card empty"><h2>دسترسی معتبر نیست</h2><p class="mut">لینک پزشک ناقص یا نامعتبر است.</p></div>';else render();
function blank(){const x=treatments[0];return{id:crypto.randomUUID(),area:'',treatmentId:x.id,treatmentLabel:x.label,patientExplanation:'',priority:'medium',priceMin:x.priceMin,priceMax:x.priceMax,condition:'',internalNote:''}}
function itemHtml(x,i){return`<section class="treatment" data-item="${esc(x.id)}"><div class="treatment-head"><h3>درمان ${i+1}</h3><button class="btn danger" data-remove="${esc(x.id)}">حذف</button></div><div class="row"><div class="field"><label>دندان / ناحیه</label><input class="input" data-k="area" value="${esc(x.area)}" placeholder="مثلاً دندان ۲۱ یا فک بالا"></div><div class="field"><label>درمان</label><select class="select" data-k="treatmentId">${treatments.map(t=>`<option value="${t.id}" ${t.id===x.treatmentId?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div></div><div class="field"><label>توضیح ساده برای بیمار</label><textarea class="textarea" data-k="patientExplanation">${esc(x.patientExplanation)}</textarea></div><div class="row"><div class="field"><label>اولویت</label><select class="select" data-k="priority"><option value="high" ${x.priority==='high'?'selected':''}>بالا</option><option value="medium" ${x.priority==='medium'?'selected':''}>متوسط</option><option value="low" ${x.priority==='low'?'selected':''}>پایین</option></select></div><div class="field"><label>شرط درمان</label><input class="input" data-k="condition" value="${esc(x.condition)}" placeholder="مثلاً پس از معاینه یا CBCT"></div></div><div class="row"><div class="field"><label>حداقل قیمت (تومان)</label><input class="input" type="number" min="0" data-k="priceMin" value="${esc(x.priceMin)}"></div><div class="field"><label>حداکثر قیمت (تومان)</label><input class="input" type="number" min="0" data-k="priceMax" value="${esc(x.priceMax)}"></div></div><div class="field internal"><label>یادداشت داخلی پزشک — هرگز به بیمار نمایش داده نمی‌شود</label><textarea class="textarea" data-k="internalNote">${esc(x.internalNote)}</textarea></div></section>`}
function render(){const i=report.intake||{},t=totalEstimate(report.items);app.innerHTML=`<div class="grid"><div><section class="card"><h2>مرور پرونده بیمار</h2><p class="mut">${esc(i.name||'بیمار')} · ${esc(i.mobile||'—')} · ${esc(i.city||'—')}</p><p>${esc(i.problem||'درخواست ایمپلنت')}</p><p class="mut">ناحیه: ${esc(i.location||'—')}</p></section><section class="card"><h2>اقلام درمان</h2>${report.items.map(itemHtml).join('')}<button id="add" class="btn">+ افزودن درمان</button></section><section class="card"><div class="field"><label>خلاصه کلی برای بیمار</label><textarea id="summary" class="textarea">${esc(report.overallSummary)}</textarea></div><div class="field"><label>قدم بعدی</label><input id="nextStep" class="input" value="${esc(report.nextStep)}"></div><div class="field internal"><label>یادداشت داخلی کلی — محرمانه</label><textarea id="internalNote" class="textarea">${esc(report.internalNote)}</textarea></div></section></div><aside><section class="card"><h2>قیمت و پیشنهاد</h2><p>برآورد فعلی: <span class="price">${money(t.min)} تا ${money(t.max)}</span></p><div class="field"><label>پیشنهاد ویژه</label><select id="offer" class="select"><option value="">بدون پیشنهاد</option>${offers.map(o=>`<option value="${o.id}" ${report.offer?.id===o.id?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div><div class="field"><label>جزئیات پیشنهاد</label><textarea id="offerDescription" class="textarea">${esc(report.offer?.description||'')}</textarea></div></section><section class="card"><div class="actions"><button id="save" class="btn">Save Draft</button><button id="preview" class="btn">Preview</button><button id="publish" class="btn primary">Publish</button></div><div id="msg" class="mut"></div></section>${report.status==='published'?`<section class="card success"><b>گزارش منتشر شده است.</b><p class="mut">لینک امن بیمار:</p><div class="linkbox">${esc(patientUrl())}</div></section>`:''}</aside></div>`;bind()}
function pull(){report.overallSummary=document.getElementById('summary').value;report.nextStep=document.getElementById('nextStep').value;report.internalNote=document.getElementById('internalNote').value;const oid=document.getElementById('offer').value;report.offer=oid?{...offers.find(x=>x.id===oid),description:document.getElementById('offerDescription').value}:null;document.querySelectorAll('[data-item]').forEach(el=>{const x=report.items.find(v=>v.id===el.dataset.item);el.querySelectorAll('[data-k]').forEach(y=>x[y.dataset.k]=['priceMin','priceMax'].includes(y.dataset.k)?Number(y.value):y.value);const lib=treatments.find(t=>t.id===x.treatmentId);x.treatmentLabel=lib?.label||x.treatmentId})}
function patientUrl(viewToken=report.patientToken){return new URL(`patient-report.html?case=${encodeURIComponent(report.id)}&token=${encodeURIComponent(viewToken)}`,location.href).href}function persist(s='draft'){pull();report.status=s;report=saveCase(report);document.getElementById('msg').textContent='پیش‌نویس ذخیره شد.'}
function bind(){document.getElementById('add').onclick=()=>{pull();report.items.push(blank());render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{pull();report.items=report.items.filter(x=>x.id!==b.dataset.remove);render()});document.querySelectorAll('[data-k="treatmentId"]').forEach(s=>s.onchange=()=>{pull();const x=report.items.find(v=>v.id===s.closest('[data-item]').dataset.item),lib=treatments.find(v=>v.id===s.value);Object.assign(x,{treatmentId:lib.id,treatmentLabel:lib.label,priceMin:lib.priceMin,priceMax:lib.priceMax});render()});document.getElementById('offer').onchange=e=>document.getElementById('offerDescription').value=offers.find(x=>x.id===e.target.value)?.description||'';document.getElementById('save').onclick=()=>persist('draft');document.getElementById('preview').onclick=()=>{persist(report.status);open(patientUrl(report.doctorToken)+'&preview=1','_blank')};document.getElementById('publish').onclick=()=>{pull();const e=validateReport(report);if(e.length){document.getElementById('msg').textContent=e.join(' ');return}report.status='published';report.publishedAt=new Date().toISOString();report=saveCase(report);render()}}
</script></body></html>
