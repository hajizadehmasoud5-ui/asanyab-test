<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>دکترلینک | پرونده‌های ایمپلنت</title>
<style>
:root{--green:#119b70;--green-dark:#087d59;--green-soft:#edf9f5;--ink:#17221e;--muted:#6f7b76;--line:#dfe7e3;--bg:#f3f7f5;--danger:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,textarea,select{font:inherit}.hidden{display:none!important}
.shell{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:28px 0 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-size:23px;font-weight:950}.brand b{color:var(--green)}
.top-actions{display:flex;gap:9px}.btn{border:0;border-radius:12px;min-height:44px;padding:10px 17px;font-weight:850;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#43504a}.danger{color:var(--danger)}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:5px 0 20px}.page-head h1{font-size:30px;margin:0 0 6px}.sub{margin:0;color:var(--muted);line-height:1.8}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #1d5d450c;overflow:hidden}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:right;padding:15px 16px;border-bottom:1px solid #edf1ef;vertical-align:middle}.table th{font-size:13px;color:#61706a;background:#f9fbfa}.table td{font-size:14px;line-height:1.7}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fbfdfc}
.name{font-weight:900}.case-code{display:block;color:#83908a;font-size:11px;direction:ltr;text-align:right}.phone{direction:ltr;text-align:right;display:inline-block}.status{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:850;background:#f1f4f3;color:#51605a}.status.ready_for_consult,.status.reviewed{background:var(--green-soft);color:var(--green-dark)}.status.needs_more_info,.status.needs_visit_cbct{background:#fff4e5;color:#8a4b08}
.empty,.loading,.error{padding:46px 24px;text-align:center;color:var(--muted);line-height:1.9}.error{color:var(--danger)}
.login-wrap{min-height:75vh;display:grid;place-items:center}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 22px 55px #123c2d18}.login-card h1{margin:0 0 8px}.label{display:block;margin:20px 0 8px;font-weight:850}.input,.textarea,.select{width:100%;border:1.5px solid #d7e0dc;border-radius:13px;background:#fff;padding:13px 14px;outline:0}.input:focus,.textarea:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 4px #e8f8f2}.login-card .btn{width:100%;margin-top:14px}.login-error{min-height:24px;color:var(--danger);font-size:13px;margin-top:9px}
.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.detail-top h1{margin:0 0 4px;font-size:27px}.detail-code{direction:ltr;text-align:right;color:var(--muted);font-size:13px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}.section.full{grid-column:1/-1}.section h2{font-size:19px;margin:0 0 16px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fact{background:#f8faf9;border-radius:12px;padding:12px}.fact b{display:block;color:#66736d;font-size:12px;margin-bottom:5px}.fact span{line-height:1.8;overflow-wrap:anywhere}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:var(--green-soft);color:var(--green-dark);font-size:13px;font-weight:800}.prose{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}.muted{color:var(--muted)}
.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.media-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fafcfb}.media-title{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;font-size:13px;font-weight:900}.media-stage{min-height:170px;display:grid;place-items:center;background:#edf2f0;color:#7d8984}.media-stage img{width:100%;height:220px;object-fit:contain;background:#16201c;cursor:zoom-in}.media-stage iframe{width:100%;height:250px;border:0}.media-missing{font-weight:800;color:#8a9490}.media-link{color:var(--green-dark);font-size:12px}.review-grid{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}.textarea{min-height:135px;resize:vertical}.save-row{display:flex;align-items:center;gap:12px;margin-top:14px}.save-message{font-size:13px;color:var(--green-dark);font-weight:800}
.lightbox{position:fixed;inset:0;z-index:100;background:#07100ddd;display:grid;place-items:center;padding:30px}.lightbox img{max-width:96vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;top:20px;left:20px;background:#fff;border:0;border-radius:999px;width:46px;height:46px;font-size:24px;cursor:pointer}
@media(max-width:900px){.shell{width:min(100% - 24px,760px)}.table thead{display:none}.table,.table tbody,.table tr,.table td{display:block}.table tr{padding:13px;border-bottom:1px solid var(--line)}.table td{border:0;padding:5px 8px}.table td::before{content:attr(data-label);display:inline-block;min-width:95px;color:var(--muted);font-size:12px}.detail-grid{grid-template-columns:1fr}.section.full{grid-column:auto}.facts{grid-template-columns:1fr}.media-grid{grid-template-columns:1fr 1fr}.review-grid{grid-template-columns:1fr}}
@media(max-width:560px){.shell{width:calc(100% - 20px);padding-top:16px}.topbar,.page-head,.detail-top{align-items:stretch;flex-direction:column}.media-grid{grid-template-columns:1fr}.page-head h1{font-size:26px}}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="brand">دکتر<b>لینک</b> · پنل پزشک</div>
    <div id="topActions" class="top-actions hidden"><button id="refreshBtn" class="btn secondary">به‌روزرسانی</button><button id="logoutBtn" class="btn secondary danger">خروج</button></div>
  </div>
  <div id="app"></div>
</main>
<div id="lightbox" class="lightbox hidden"><button type="button" aria-label="بستن">×</button><img alt="نمای بزرگ تصویر پرونده"></div>
<script>
(()=>{
'use strict';
const API='implant-api',TOKEN_KEY='drlinq_implant_doctor_session',app=document.getElementById('app'),topActions=document.getElementById('topActions'),objectUrls=new Set();
const statusLabels={unreviewed:'بررسی نشده',needs_more_info:'نیاز به اطلاعات بیشتر',ready_for_consult:'آماده مشاوره',needs_visit_cbct:'نیاز به ویزیت/CBCT',reviewed:'بررسی شد'};
const medicalLabels={diabetes:'دیابت',heart:'بیماری قلبی یا فشار خون',blood:'داروی رقیق‌کننده خون',smoke:'سیگار یا قلیان',osteo:'پوکی استخوان',bone:'داروی مربوط به استخوان/پوکی استخوان',cancer:'سرطان یا شیمی‌درمانی',radiation:'پرتودرمانی سر و گردن',allergy:'حساسیت دارویی',other:'بیماری مهم دیگر',regular:'داروی دائمی'};
const slotLabels={opg:'OPG',cbct:'CBCT',front:'Front · روبه‌رو',upper:'Upper · فک بالا',lower:'Lower · فک پایین',right:'Right · سمت راست',left:'Left · سمت چپ'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function token(){return sessionStorage.getItem(TOKEN_KEY)||''}
function clearObjects(){for(const url of objectUrls)URL.revokeObjectURL(url);objectUrls.clear()}
function fmtTime(value){if(!value)return '—';try{return new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}catch{return value}}
function statusBadge(value){return `<span class="status ${esc(value)}">${esc(statusLabels[value]||value)}</span>`}
async function api(path,options={}){
  const headers=new Headers(options.headers||{});if(token())headers.set('Authorization',`Bearer ${token()}`);
  const response=await fetch(`${API}${path}`,{...options,headers,cache:'no-store'});
  if(response.status===401&&path!=='/doctor/login'){sessionStorage.removeItem(TOKEN_KEY);renderLogin('نشست شما پایان یافته است. دوباره وارد شوید.');throw new Error('unauthorized')}
  if(!response.ok){let detail='خطا در ارتباط با سرور';try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}
  return response;
}
function renderLogin(message=''){
  clearObjects();topActions.classList.add('hidden');
  app.innerHTML=`<div class="login-wrap"><form id="loginForm" class="login-card"><h1>ورود پزشک</h1><p class="sub">برای مشاهده پرونده‌های آزمایشی، کد دسترسی را وارد کنید.</p><label class="label" for="accessCode">کد دسترسی</label><input id="accessCode" name="accessCode" class="input" type="password" autocomplete="current-password" required><button class="btn primary" type="submit">ورود به پرونده‌ها</button><div id="loginError" class="login-error">${esc(message)}</div></form></div>`;
  document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();const button=event.submitter,error=document.getElementById('loginError');button.disabled=true;error.textContent='';try{const response=await api('/doctor/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('accessCode').value})});const data=await response.json();sessionStorage.setItem(TOKEN_KEY,data.token);await loadCases()}catch(err){error.textContent=err.message==='doctor_code_invalid'?'کد دسترسی نادرست است.':'ورود انجام نشد. دوباره تلاش کنید.'}finally{button.disabled=false}};
}
async function loadCases(){
  clearObjects();topActions.classList.remove('hidden');app.innerHTML='<div class="loading">در حال دریافت پرونده‌ها…</div>';
  try{const data=await (await api('/cases')).json();renderCases(data.items||[])}catch(err){if(err.message!=='unauthorized')app.innerHTML=`<div class="panel error">دریافت پرونده‌ها انجام نشد.<br>${esc(err.message)}</div>`}
}
function renderCases(items){
  app.innerHTML=`<div class="page-head"><div><h1>پرونده‌های ایمپلنت</h1><p class="sub">جدیدترین پرونده‌ها در ابتدای فهرست قرار دارند.</p></div><div>${items.length} پرونده</div></div><div class="panel">${items.length?`<table class="table"><thead><tr><th>بیمار</th><th>شهر و موبایل</th><th>مشکل اصلی</th><th>تعداد / ناحیه</th><th>زمان ثبت</th><th>وضعیت</th><th></th></tr></thead><tbody>${items.map(item=>`<tr data-case-row="${esc(item.case_id)}"><td data-label="بیمار"><span class="name">${esc(item.patient_name)}</span><span class="case-code">${esc(item.case_id)}</span></td><td data-label="تماس">${esc(item.city)} · <span class="phone">${esc(item.mobile)}</span></td><td data-label="مشکل">${esc(item.problem)}</td><td data-label="ناحیه">${esc(item.missing_count||'—')}<br><span class="muted">${esc(item.area)}</span></td><td data-label="زمان">${esc(fmtTime(item.created_at))}</td><td data-label="وضعیت">${statusBadge(item.status)}</td><td><button class="btn secondary" data-open-case="${esc(item.case_id)}">مشاهده پرونده</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">هنوز پرونده‌ای ثبت نشده است.</div>'}</div>`;
  document.querySelectorAll('[data-open-case]').forEach(button=>button.onclick=()=>loadCase(button.dataset.openCase));
}
async function loadCase(caseId){
  clearObjects();app.innerHTML='<div class="loading">در حال دریافت پرونده…</div>';
  try{const data=await (await api(`/cases/${encodeURIComponent(caseId)}`)).json();renderCase(data);await loadMedia(data)}catch(err){if(err.message!=='unauthorized')app.innerHTML=`<div class="panel error">پرونده باز نشد.<br>${esc(err.message)}</div>`}
}
function fact(label,value,extra=''){return `<div class="fact"><b>${esc(label)}</b><span class="${extra}">${esc(value||'—')}</span></div>`}
function renderCase(data){
  const selectedMedical=Object.entries(data.medical||{}).filter(([,yes])=>yes).map(([key])=>medicalLabels[key]||key);
  const questions=[...(data.suggested_questions||[]),data.patient_question].filter(Boolean);
  app.innerHTML=`<div class="detail-top"><div><button id="backToList" class="btn secondary">بازگشت به فهرست</button><h1 style="margin-top:16px">${esc(data.patient_name)}</h1><div class="detail-code">${esc(data.case_id)}</div></div>${statusBadge(data.status)}</div><div class="detail-grid">
    <section class="section"><h2>۱. خلاصه بیمار</h2><div class="facts">${fact('نام',data.patient_name)}${fact('موبایل',data.mobile,'phone')}${fact('شهر',data.city)}${fact('زمان ثبت',fmtTime(data.created_at))}</div></section>
    <section class="section"><h2>۲. مشکل ایمپلنت</h2><div class="facts">${fact('دلیل مراجعه',data.problem)}${fact('تعداد دندان',data.missing_count||'مشخص نشده')}${fact('فک و ناحیه',data.area)}${fact('شماره دندان‌ها',(data.teeth||[]).join('، ')||'انتخاب نشده')}</div></section>
    <section class="section full"><h2>۳. Medical History</h2><div class="chips">${selectedMedical.length?selectedMedical.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="muted">موردی انتخاب نشده</span>'}</div><div class="facts" style="margin-top:14px">${fact('شرح بیماری',data.disease_text||'ثبت نشده')}${fact('داروهای مصرفی',data.medication_text||'ثبت نشده')}</div></section>
    <section class="section full"><h2>۴. Radiographs</h2><div class="media-grid" id="radiographs">${mediaCard('opg',data)}${mediaCard('cbct',data)}</div></section>
    <section class="section full"><h2>۵. Intraoral Photos</h2><div class="media-grid" id="photos">${['front','upper','lower','right','left'].map(slot=>mediaCard(slot,data)).join('')}</div></section>
    <section class="section full"><h2>۶. سؤال بیمار</h2>${questions.length?questions.map(q=>`<p class="prose">• ${esc(q)}</p>`).join(''):'<p class="muted">سؤالی ثبت نشده است.</p>'}</section>
    <section class="section full"><h2>بررسی پزشک</h2><div class="review-grid"><div><label class="label" for="reviewStatus">وضعیت پرونده</label><select id="reviewStatus" class="select">${Object.entries(statusLabels).map(([value,label])=>`<option value="${value}" ${data.status===value?'selected':''}>${esc(label)}</option>`).join('')}</select></div><div><label class="label" for="doctorNote">یادداشت پزشک</label><textarea id="doctorNote" class="textarea" placeholder="یادداشت فقط در پرونده پزشک ذخیره می‌شود.">${esc(data.doctor_note||'')}</textarea></div></div><div class="save-row"><button id="saveReview" class="btn primary">ذخیره وضعیت و یادداشت</button><span id="saveMessage" class="save-message"></span></div></section>
  </div>`;
  document.getElementById('backToList').onclick=loadCases;
  document.getElementById('saveReview').onclick=()=>saveReview(data.case_id);
}
function mediaCard(slot,data){
  const file=(data.files||[]).find(item=>item.slot===slot);
  const stated=((slot==='opg'||slot==='cbct')?data.radiograph_status:data.photo_status)||{};
  return `<article class="media-card" data-file-slot="${slot}"><div class="media-title"><span>${esc(slotLabels[slot])}</span>${file?`<span>${Math.max(1,Math.round(file.size_bytes/1024))} KB</span>`:''}</div><div class="media-stage">${file?'<span>در حال بارگذاری…</span>':`<span class="media-missing">ارسال نشده${stated[slot]?` · ${esc(stated[slot])}`:''}</span>`}</div></article>`;
}
async function loadMedia(data){
  await Promise.all((data.files||[]).map(async file=>{const card=document.querySelector(`[data-file-slot="${file.slot}"]`),stage=card?.querySelector('.media-stage');if(!stage)return;try{const response=await api(file.content_path);const blob=await response.blob();const url=URL.createObjectURL(blob);objectUrls.add(url);if(file.media_type==='application/pdf'){stage.innerHTML=`<iframe title="${esc(slotLabels[file.slot])}" src="${url}"></iframe><a class="media-link" href="${url}" target="_blank" rel="noopener">باز کردن PDF</a>`}else{stage.innerHTML=`<img src="${url}" alt="${esc(slotLabels[file.slot])}" data-zoom-image>`;stage.querySelector('img').onclick=()=>openLightbox(url)}}catch{stage.innerHTML='<span class="media-missing">فایل باز نشد</span>'}}));
}
async function saveReview(caseId){
  const button=document.getElementById('saveReview'),message=document.getElementById('saveMessage');button.disabled=true;message.textContent='در حال ذخیره…';
  try{await api(`/cases/${encodeURIComponent(caseId)}/review`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.getElementById('reviewStatus').value,note:document.getElementById('doctorNote').value})});message.textContent='ذخیره شد.'}catch(err){message.textContent=`ذخیره نشد: ${err.message}`}finally{button.disabled=false}
}
function openLightbox(url){const box=document.getElementById('lightbox');box.querySelector('img').src=url;box.classList.remove('hidden')}
document.getElementById('lightbox').onclick=event=>{if(event.target.tagName!=='IMG')document.getElementById('lightbox').classList.add('hidden')};
document.getElementById('refreshBtn').onclick=loadCases;document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem(TOKEN_KEY);renderLogin()};
if(token())loadCases();else renderLogin();
})();
</script>
</body>
</html>
