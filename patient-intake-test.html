<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دکترلینک | تست فرم بیمار</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f5f7fa;color:#18202a}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;padding:20px}.brand{font-size:24px;font-weight:900;margin-bottom:20px}.brand b{color:#1565c0}.card{border:1px solid #e4e8ee;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #d7dde5;background:#fff;border-radius:12px;padding:12px;font:inherit}.primary{background:#1565c0;color:#fff;border:0;width:100%;margin-top:16px}.input{width:100%;box-sizing:border-box;border:1px solid #d7dde5;border-radius:12px;padding:12px;font:inherit;margin-top:8px}.mut{color:#6f7a88;font-size:12px;line-height:1.8}</style></head><body><div class="app"><div class="brand">دکتر<b>لینک</b></div><h1>برای چه کسی دنبال خدمات درمانی هستید؟</h1><p class="mut">این صفحه فقط برای تست نمایش نسخه جدید است.</p><div class="card"><div class="grid"><button class="btn">خودم</button><button class="btn">فرزندم</button><button class="btn">والدین/همسر</button><button class="btn">فرد دیگری</button></div><input class="input" placeholder="سن بیمار"><select class="input"><option>جنسیت (اختیاری)</option><option>زن</option><option>مرد</option></select></div><button class="btn primary" onclick="document.getElementById('ok').style.display='block'">ادامه</button><div id="ok" class="card" style="display:none">نسخه جدید لود شده ✅</div></div></body></html>
