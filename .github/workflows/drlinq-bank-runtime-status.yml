name: DrLinq Bank Runtime Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-bank-runtime-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Read bank runtime
        id: probe
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=20 -o BatchMode=no -o PasswordAuthentication=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/status.txt 2>/tmp/status.err <<'REMOTE'
          set +e
          echo "BANK_DIR=$([ -d /opt/drlinq/bank-api ] && echo yes || echo no)"
          echo "BANK_COMPOSE=$([ -f /opt/drlinq/bank-compose.yml ] && echo yes || echo no)"
          echo "CADDY_ROUTE=$(grep -c 'handle_path /bank/\*' /opt/drlinq/Caddyfile 2>/dev/null || true)"
          docker ps --format '{{.Names}}|{{.Status}}' | grep 'drlinq-bank-api' || true
          curl -L -sS --max-time 15 -o /tmp/h -w 'HEALTH_HTTP=%{http_code}\n' https://n8n.drlinq.ir/bank/health || true
          cat /tmp/h 2>/dev/null | head -c 300 || true
          echo
          curl -L -sS --max-time 15 -o /tmp/v -w 'VIEW_HTTP=%{http_code}\n' https://n8n.drlinq.ir/bank/view || true
          grep -o '<title>[^<]*</title>' /tmp/v 2>/dev/null | head -n1 || true
          grep -o 'بانک مراکز دکترلینک' /tmp/v 2>/dev/null | head -n1 || true
          echo
          REMOTE
      - name: Write status
        env:
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,datetime
          def r(p):
            x=pathlib.Path(p); return x.read_text(errors='ignore').strip() if x.exists() else ''
          pathlib.Path('DRLINQ_BANK_RUNTIME_STATUS.json').write_text(json.dumps({
            'connected': os.environ.get('OUTCOME')=='success',
            'report': r('/tmp/status.txt'),
            'error': r('/tmp/status.err')[-1200:],
            'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_BANK_RUNTIME_STATUS.json
          git commit -m "Record DrLinq bank runtime status" || exit 0
          git push
