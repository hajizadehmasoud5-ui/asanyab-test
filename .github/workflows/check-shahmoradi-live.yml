name: Check Shahmoradi referral link
on:
  push:
    paths:
      - '.github/workflows/check-shahmoradi-live.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check specialist record
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          u='https://python-0jatcc.cldv.dev/alanoffer/api/referral/c/dr-shahmoradi-endodontist'
          try:
              with urllib.request.urlopen(u, timeout=20) as r:
                  d=json.load(r)
                  out={'ok': bool(d.get('ok')), 'status': r.status, 'name': (d.get('specialist') or {}).get('name','')}
          except urllib.error.HTTPError as e:
              out={'ok':False,'status':e.code}
          except Exception as e:
              out={'ok':False,'status':0,'error':type(e).__name__}
          json.dump(out,open('shahmoradi-link-check.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Save result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shahmoradi-link-check.json
          git commit -m 'Record Shahmoradi referral link check'
          git push
