name: VPS ChatGPT Scale Fix Temp

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/workflows/vps-ssh-key-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Set ChatGPT app scale
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "sed -i 's#^Exec=/usr/bin/chatgpt.*#Exec=/usr/bin/chatgpt --force-device-scale-factor=0.85#' /home/drlinqdesk/Desktop/ChatGPT-App.desktop; mkdir -p /home/drlinqdesk/.local/share/applications; cp /usr/share/applications/chatgpt.desktop /home/drlinqdesk/.local/share/applications/chatgpt.desktop; sed -i 's#^Exec=chatgpt %U#Exec=/usr/bin/chatgpt --force-device-scale-factor=0.85 %U#' /home/drlinqdesk/.local/share/applications/chatgpt.desktop; chown -R drlinqdesk:drlinqdesk /home/drlinqdesk/.local/share/applications /home/drlinqdesk/Desktop/ChatGPT-App.desktop; echo DESKTOP; grep '^Exec=' /home/drlinqdesk/Desktop/ChatGPT-App.desktop; echo MENU; grep '^Exec=' /home/drlinqdesk/.local/share/applications/chatgpt.desktop"
