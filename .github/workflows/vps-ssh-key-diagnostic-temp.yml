name: VPS XRDP Diagnostic Temp

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/workflows/vps-ssh-key-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Inspect XRDP logs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "systemctl is-active xrdp; systemctl is-active xrdp-sesman; tail -n 80 /var/log/xrdp.log; tail -n 120 /var/log/xrdp-sesman.log; getent passwd drlinqdesk; ls -la /home/drlinqdesk; cat /home/drlinqdesk/.xsession 2>/dev/null || true; tail -n 80 /home/drlinqdesk/.xsession-errors 2>/dev/null || true"
