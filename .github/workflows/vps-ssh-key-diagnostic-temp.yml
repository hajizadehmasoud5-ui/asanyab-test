name: VPS ChatGPT Launcher Inspect Temp

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/workflows/vps-ssh-key-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Inspect launchers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "sed -n '1,80p' /home/drlinqdesk/Desktop/ChatGPT.desktop; echo SECOND; sed -n '1,80p' /home/drlinqdesk/Desktop/ChatGPT-App.desktop; echo THIRD; sed -n '1,80p' /usr/share/applications/chatgpt.desktop"
