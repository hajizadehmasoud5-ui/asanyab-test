name: VPS SSH Key Diagnostic Temp

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/workflows/vps-ssh-key-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Inspect SSH configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "echo HOST=\$(hostname); /usr/sbin/sshd -T | grep -E '^(pubkeyauthentication|authorizedkeysfile|permitrootlogin|authenticationmethods) '; stat -c 'ROOT=%a:%U:%G' /root; stat -c 'SSH=%a:%U:%G' /root/.ssh; stat -c 'AUTH=%a:%U:%G' /root/.ssh/authorized_keys; grep -c 'rayandika@DESKTOP-9027PMF1' /root/.ssh/authorized_keys"
