name: VPS Initial Password Change

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-password-change.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  change-password:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect sshpass

      - name: Change expired root password
        id: change
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          OLD_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
          NEW_PASSWORD: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          cat > /tmp/change-password.exp <<'EXP'
          log_user 0
          set timeout 30
          set host $env(VPS_HOST)
          set user $env(VPS_USER)
          set port $env(VPS_PORT)
          set old $env(OLD_PASSWORD)
          set new $env(NEW_PASSWORD)

          spawn ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p $port $user@$host

          expect {
            -re "(?i)password:" { send -- "$old\r" }
            timeout { exit 11 }
            eof { exit 12 }
          }

          set current_done 0
          expect {
            -re "(?i)current.*password:" { send -- "$old\r"; set current_done 1 }
            -re "(?i)new.*password:" { send -- "$new\r"; set current_done 2 }
            timeout { exit 13 }
            eof { exit 14 }
          }

          if {$current_done == 1} {
            expect {
              -re "(?i)new.*password:" { send -- "$new\r" }
              timeout { exit 15 }
              eof { exit 16 }
            }
          }

          expect {
            -re "(?i)retype.*password:" { send -- "$new\r" }
            timeout { exit 17 }
            eof { exit 18 }
          }

          expect {
            -re "(?i)password updated successfully" { send -- "exit\r"; exp_continue }
            -re {[#>$] $} { send -- "exit\r"; exp_continue }
            eof { exit 0 }
            timeout { exit 0 }
          }
          EXP
          expect /tmp/change-password.exp

      - name: Verify new password
        id: verify
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=15 -p "$VPS_PORT" -o BatchMode=no -o PasswordAuthentication=yes "$VPS_USER@$VPS_HOST" 'uname -srm' > /tmp/vps_os.txt

      - name: Write sanitized result
        env:
          CHANGE_OUTCOME: ${{ steps.change.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          changed = os.environ.get('CHANGE_OUTCOME') == 'success'
          verified = os.environ.get('VERIFY_OUTCOME') == 'success'
          os_text = ''
          p = pathlib.Path('/tmp/vps_os.txt')
          if verified and p.exists():
              os_text = p.read_text().strip()[:200]
          data = {
              'password_change_step_ok': changed,
              'ssh_with_new_password_ok': verified,
              'os': os_text,
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('vps-password-result.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit sanitized result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vps-password-result.json
          git commit -m "Record VPS password change result" || exit 0
          git push
