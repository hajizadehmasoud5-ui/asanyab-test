name: VPS Initial Password Change

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-password-change.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  change-password:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect sshpass

      - name: Change expired root password
        id: change
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          OLD_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
          NEW_PASSWORD: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          cat > /tmp/change-password.exp <<'EXP'
          log_user 0
          set timeout 30
          set host $env(VPS_HOST)
          set user $env(VPS_USER)
          set port $env(VPS_PORT)
          set old $env(OLD_PASSWORD)
          set new $env(NEW_PASSWORD)

          proc writefile {path value} {
            set f [open $path w]
            puts $f $value
            close $f
          }
          proc stage {s} { writefile "/tmp/change_stage.txt" $s }
          proc reason {s} { writefile "/tmp/change_reason.txt" $s }

          reason ""
          stage "connect"
          spawn ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p $port $user@$host

          stage "login_password"
          expect {
            -re "(?i)password:" { send -- "$old\r" }
            timeout { reason "login_timeout"; exit 11 }
            eof { reason "login_eof"; exit 12 }
          }

          stage "forced_change_prompt"
          set need_new 1
          expect {
            -nocase "Current password:" { send -- "$old\r"; set need_new 1 }
            -nocase "New password:" { send -- "$new\r"; set need_new 0 }
            timeout { reason "forced_change_timeout"; exit 13 }
            eof { reason "forced_change_eof"; exit 14 }
          }

          if {$need_new == 1} {
            stage "new_password"
            expect {
              -nocase "New password:" { send -- "$new\r" }
              -nocase "BAD PASSWORD" { reason "password_policy_rejected"; exit 31 }
              -nocase "password unchanged" { reason "password_unchanged"; exit 32 }
              timeout { reason "new_password_timeout"; exit 15 }
              eof { reason "new_password_eof"; exit 16 }
            }
          }

          stage "retype_password"
          expect {
            -nocase "Retype new password:" { send -- "$new\r" }
            -nocase "BAD PASSWORD" { reason "password_policy_rejected"; exit 33 }
            -nocase "password unchanged" { reason "password_unchanged"; exit 34 }
            timeout { reason "retype_timeout"; exit 17 }
            eof { reason "retype_eof"; exit 18 }
          }

          stage "finish"
          expect {
            -nocase "password updated successfully" { reason "success"; exp_continue }
            -nocase "password unchanged" { reason "password_unchanged"; exit 35 }
            -nocase "BAD PASSWORD" { reason "password_policy_rejected"; exit 36 }
            eof { exit 0 }
            timeout { exit 0 }
          }
          EXP
          set +e
          expect /tmp/change-password.exp
          code=$?
          echo "$code" > /tmp/change_code.txt
          exit "$code"

      - name: Verify new password
        id: verify
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=15 -p "$VPS_PORT" -o BatchMode=no -o PasswordAuthentication=yes "$VPS_USER@$VPS_HOST" 'uname -srm' > /tmp/vps_os.txt 2>/tmp/verify_err.txt

      - name: Write sanitized result
        env:
          CHANGE_OUTCOME: ${{ steps.change.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime, os
          def read(path):
              p=pathlib.Path(path)
              return p.read_text(errors='ignore').strip() if p.exists() else ''
          data = {
              'password_change_step_ok': os.environ.get('CHANGE_OUTCOME') == 'success',
              'ssh_with_new_password_ok': os.environ.get('VERIFY_OUTCOME') == 'success',
              'os': read('/tmp/vps_os.txt')[:200],
              'stage': read('/tmp/change_stage.txt'),
              'reason': read('/tmp/change_reason.txt'),
              'exit_code': read('/tmp/change_code.txt'),
              'verify_error': read('/tmp/verify_err.txt')[-250:],
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('vps-password-result.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit sanitized result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vps-password-result.json
          git commit -m "Record VPS password change result" || exit 0
          git push
