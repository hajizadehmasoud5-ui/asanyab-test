name: DrLinq Mellat Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-mellat-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Mellat official centers page
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,datetime
          url='https://www.mellatinsurance.com/marakez'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 DrLinqDiscovery/1.0'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              final=r.geturl(); status=r.status; html=r.read().decode('utf-8','ignore')
            out={'ok':True,'url':url,'final_url':final,'status':status,'bytes':len(html)}
            out['title']=(re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S) else '')
            tables=[]
            for ti,t in enumerate(re.findall(r'<table\b.*?</table>',html,re.I|re.S)):
              rows=re.findall(r'<tr\b.*?</tr>',t,re.I|re.S)
              sample=[]
              for tr in rows[:5]:
                cells=[re.sub(r'<[^>]+>',' ',x) for x in re.findall(r'<t[dh]\b.*?</t[dh]>',tr,re.I|re.S)]
                cells=[re.sub(r'\s+',' ',c).strip() for c in cells]
                if cells: sample.append(cells)
              tables.append({'index':ti,'rows':len(rows),'sample':sample})
            out['tables']=tables[:20]
            scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
            out['scripts']=scripts[:100]
            forms=[]
            for m in re.finditer(r'<form\b([^>]*)>(.*?)</form>',html,re.I|re.S):
              attrs=m.group(1); body=m.group(2)
              action=re.search(r'action=["\']([^"\']*)',attrs,re.I)
              method=re.search(r'method=["\']([^"\']*)',attrs,re.I)
              fields=sorted(set(re.findall(r'(?:name|id)=["\']([^"\']+)',body,re.I)))
              forms.append({'action':action.group(1) if action else '', 'method':method.group(1) if method else '', 'fields':fields[:100]})
            out['forms']=forms[:20]
            strings=sorted(set(re.findall(r'["\']([^"\']{3,250})["\']',html)))
            out['candidates']=[x for x in strings if any(k in x.lower() for k in ['ajax','api','marakez','center','province','city','ostan','shahr'])][:200]
          except Exception as e:
            out={'ok':False,'url':url,'error':repr(e)}
          out['checked_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('DRLINQ_MELLAT_DISCOVERY.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_MELLAT_DISCOVERY.json
          git commit -m "Record Mellat official centers discovery" || exit 0
          git push
