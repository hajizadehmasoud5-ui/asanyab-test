name: VPS Password After-New Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-password-after-new-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect
      - name: Probe response after new password
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          OLD_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
          NEW_PASSWORD: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          cat > /tmp/probe.exp <<'EXP'
          log_user 1
          set timeout 25
          set host $env(VPS_HOST)
          set user $env(VPS_USER)
          set port $env(VPS_PORT)
          set old $env(OLD_PASSWORD)
          set new $env(NEW_PASSWORD)
          proc writefile {p v} { set f [open $p w]; puts $f $v; close $f }
          spawn ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p $port $user@$host
          expect {
            -re "(?i)password:" { send -- "$old\r" }
            timeout { writefile "/tmp/probe_result.txt" "login_timeout"; exit 11 }
            eof { writefile "/tmp/probe_result.txt" "login_eof"; exit 12 }
          }
          expect {
            -re "(?i)new.*password:" { send -- "$new\r" }
            -re "(?i)current.*password:" { writefile "/tmp/probe_result.txt" "unexpected_current_password"; exit 21 }
            timeout { writefile "/tmp/probe_result.txt" "new_prompt_timeout"; exit 13 }
            eof { writefile "/tmp/probe_result.txt" "eof_before_new"; exit 14 }
          }
          expect {
            -re "(?i)retype.*password:" { writefile "/tmp/probe_result.txt" "retype_password"; exit 0 }
            -re "(?i)bad password" { writefile "/tmp/probe_result.txt" "bad_password"; exit 0 }
            -re "(?i)password.*unchanged" { writefile "/tmp/probe_result.txt" "password_unchanged"; exit 0 }
            -re "(?i)authentication token manipulation" { writefile "/tmp/probe_result.txt" "pam_token_error"; exit 0 }
            -re "(?i)new.*password:" { writefile "/tmp/probe_result.txt" "new_password_reprompt"; exit 0 }
            timeout { writefile "/tmp/probe_result.txt" "after_new_timeout"; exit 15 }
            eof { writefile "/tmp/probe_result.txt" "after_new_eof"; exit 0 }
          }
          EXP
          set +e
          expect /tmp/probe.exp > /tmp/session.log 2>&1
          echo $? > /tmp/probe_code.txt
          exit 0
      - name: Write sanitized result
        env:
          OLD_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
          NEW_PASSWORD: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          python3 - <<'PY'
          import pathlib,json,datetime,os,re
          def read(p):
              x=pathlib.Path(p)
              return x.read_text(errors='ignore').strip() if x.exists() else ''
          detail=read('/tmp/session.log')
          for s in [os.environ.get('OLD_PASSWORD',''),os.environ.get('NEW_PASSWORD','')]:
              if s: detail=detail.replace(s,'[secret]')
          detail=re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b','[host]',detail)
          data={
            'after_new':read('/tmp/probe_result.txt'),
            'exit_code':read('/tmp/probe_code.txt'),
            'detail':detail[-900:],
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('vps-password-after-new-probe-result.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vps-password-after-new-probe-result.json
          git commit -m "Record VPS after-new password probe" || exit 0
          git push
