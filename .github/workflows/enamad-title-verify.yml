name: Enamad verification

on:
  push:
    branches: [main]
    paths:
      - enamad-title-request.json

permissions:
  contents: write

jobs:
  update-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Enamad verification marker
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          req = json.loads(Path('enamad-title-request.json').read_text())
          mode = req.get('mode')
          p = Path('index.html')
          text = p.read_text()
          original = 'دکترلینک | انتخاب درمان بر اساس شرایط تو'
          code = '20460348'
          meta = f'<meta name="enamad" content="{code}"/>'

          if mode == 'set':
              text, n = re.subn(r'<title>.*?</title>', f'<title>{code}</title>', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('title tag not found exactly once')
          elif mode == 'meta':
              if 'name="enamad"' in text:
                  text, n = re.subn(r'<meta\s+name="enamad"\s+content="20460348"\s*/?>', meta, text, count=1)
                  if n != 1:
                      raise SystemExit('existing enamad tag could not be normalized')
              else:
                  text, n = re.subn(r'(<title>.*?</title>)', r'\1\n' + meta, text, count=1, flags=re.S)
                  if n != 1:
                      raise SystemExit('title tag not found exactly once')
          elif mode == 'restore':
              text, n = re.subn(r'<title>.*?</title>', f'<title>{original}</title>', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('title tag not found exactly once')
              text = re.sub(r'\n?<meta\s+name="enamad"\s+content="20460348"\s*/?>', '', text, count=1)
          else:
              raise SystemExit('invalid mode')

          p.write_text(text)
          PY

      - name: Commit verification change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Enamad verification marker' || true
          git push
