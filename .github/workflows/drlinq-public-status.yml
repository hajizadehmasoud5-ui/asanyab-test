name: DrLinq Public Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-public-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Check public routing from VPS
        id: probe
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=20 -o BatchMode=no -o PasswordAuthentication=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/public.txt 2>/tmp/public.err <<'REMOTE'
          set +e
          echo "--- caddy routes ---"
          if [ -f /opt/drlinq/Caddyfile ]; then
            grep -E '^[^[:space:]#].*\{|reverse_proxy|handle|redir|respond|root \*|file_server' /opt/drlinq/Caddyfile | head -n 120
          fi
          echo "--- local caddy ---"
          curl -sS -o /tmp/local_body -w 'HTTP=%{http_code}\n' -H 'Host: drlinq.ir' http://127.0.0.1:80/ || true
          head -c 700 /tmp/local_body 2>/dev/null | tr '\n' ' ' || true
          echo
          echo "--- public https ---"
          curl -L -sS --max-time 20 -o /tmp/public_body -w 'HTTP=%{http_code}\nURL=%{url_effective}\n' https://drlinq.ir/ || true
          head -c 700 /tmp/public_body 2>/dev/null | tr '\n' ' ' || true
          echo
          echo "--- enamad path ---"
          curl -L -sS --max-time 20 -o /tmp/enamad_body -w 'HTTP=%{http_code}\n' https://drlinq.ir/20460348.txt || true
          head -c 200 /tmp/enamad_body 2>/dev/null | tr '\n' ' ' || true
          echo
          REMOTE
      - name: Write status
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python3 - <<'PY'
          import json, pathlib, os, datetime
          def r(p):
            x=pathlib.Path(p)
            return x.read_text(errors='ignore').strip() if x.exists() else ''
          data={
            'connected': os.environ.get('PROBE_OUTCOME')=='success',
            'report': r('/tmp/public.txt')[:15000],
            'error': r('/tmp/public.err')[-1200:],
            'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('DRLINQ_PUBLIC_STATUS.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_PUBLIC_STATUS.json
          git commit -m "Record DrLinq public status" || exit 0
          git push
