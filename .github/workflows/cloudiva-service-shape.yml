name: Cloudiva service shape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudiva-service-shape.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect service record keys only
        env:
          CLOU_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Token $CLOU_TOKEN" \
            -H 'Accept: application/json' \
            'https://apihub.cloudiva.net/fa/api/v1/services/' \
            -o /tmp/services.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/services.json',encoding='utf-8'))
          items=d.get('services',[]) if isinstance(d,dict) else []
          s=next((x for x in items if isinstance(x,dict) and x.get('main_name')=='python-0jatcc'),None)
          def shape(v,depth=0):
              if depth>3:return type(v).__name__
              if isinstance(v,dict):return {k:shape(v[k],depth+1) for k in sorted(v)}
              if isinstance(v,list):return [shape(v[0],depth+1)] if v else []
              return type(v).__name__
          out={'service_found':bool(s),'shape':shape(s) if s else {}}
          open('cloudiva-service-shape.json','w',encoding='utf-8').write(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudiva-service-shape.json
          git diff --cached --quiet || git commit -m 'Record sanitized Cloudiva service shape'
          git push >/dev/null 2>&1
