name: One-time Cloudiva persistence test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudiva-persistence-test.yml'

permissions:
  contents: write

jobs:
  test-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Cloudiva CLI
        run: npm install -g @cloudiva.net/cli >/dev/null 2>&1

      - name: Create synthetic DrLinq request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          base='https://python-0jatcc.cldv.dev/alanoffer'
          def post(path, payload):
              data=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(base+path,data=data,headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))
          def get(path):
              with urllib.request.urlopen(base+path,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))
          before=get('/api/chat/health')
          start=post('/api/chat/start',{})
          sid=start['sessionId']
          out=None
          for text in ['تست ماندگاری زیرساخت','اهواز','کیفیت','یک مورد','عجله ندارم','09120000000']:
              out=post('/api/chat/message',{'sessionId':sid,'text':text})
          assert out and out.get('ready') is True and out.get('requestId')
          open('/tmp/request_id','w').write(out['requestId'])
          open('/tmp/before_count','w').write(str(before.get('requests',0)))
          PY

      - name: Restart Cloudiva service
        env:
          CLOUDIVA_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          diva login -t "$CLOUDIVA_TOKEN" >/dev/null 2>&1
          diva service restart -s python-0jatcc >/dev/null 2>&1

      - name: Verify request survived restart
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request, urllib.parse, datetime
          base='https://python-0jatcc.cldv.dev/alanoffer'
          rid=open('/tmp/request_id').read().strip()
          before=int(open('/tmp/before_count').read().strip())
          health=None
          for _ in range(20):
              try:
                  with urllib.request.urlopen(base+'/api/chat/health',timeout=15) as r:
                      health=json.loads(r.read().decode('utf-8'))
                  if health.get('ok') is True:
                      break
              except Exception:
                  pass
              time.sleep(3)
          assert health and health.get('ok') is True
          with urllib.request.urlopen(base+'/api/request/'+urllib.parse.quote(rid,safe=''),timeout=20) as r:
              req=json.loads(r.read().decode('utf-8'))
          persisted=req.get('ok') is True and req.get('id')==rid
          after=int(health.get('requests',0))
          assert persisted and after >= before + 1
          result={
              'service':'python-0jatcc',
              'persistent_path':'/data',
              'persisted_after_restart':persisted,
              'backend_ok':health.get('ok') is True,
              'backend_version':health.get('version'),
              'request_count_before':before,
              'request_count_after':after,
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open('cloudiva-persistence-result.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY

      - name: Record sanitized result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudiva-persistence-result.json
          git diff --cached --quiet || git commit -m 'Record Cloudiva persistence verification'
          git push >/dev/null 2>&1
