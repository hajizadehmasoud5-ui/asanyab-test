name: DrLinq referral smoke
on:
  push:
    paths:
      - '.github/workflows/referral-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test referral flow
        run: |
          set -euo pipefail
          BASE='https://python-0jatcc.cldv.dev/alanoffer/api/referral'
          curl -fsSL --retry 12 --retry-delay 5 "$BASE/health" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert d.get('ok') is True and d.get('version')=='0.1.0', d
          PY
          curl -fsSL -X POST "$BASE/specialists/register" -H 'Content-Type: application/json' \
            --data '{"name":"متخصص تست ارجاع","clinicName":"مرکز تست","city":"اهواز"}' -o /tmp/reg.json
          SID=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['specialistId'])")
          TOK=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['accessToken'])")
          SLUG=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['slug'])")
          python - <<'PY'
          import base64
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          open('/tmp/test.png','wb').write(base64.b64decode(png))
          PY
          PAYLOAD='{"patientName":"بیمار تست","patientPhone":"09000000000","referringDoctor":"دکتر تست","referringPhone":"0610000000","tooth":"46","referralType":"مشکل حین درمان","workingDiagnosis":"SAP","tests":"درد به پرکاشن","problem":"فایل جداشده","problemDetail":"MB","radiographType":"PA","urgency":"این هفته","consent":"true"}'
          curl -fsSL -X POST "$BASE/c/$SLUG/submit" \
            -F "payload=$PAYLOAD" -F "files=@/tmp/test.png;type=image/png" -o /tmp/sub.json
          RID=$(python -c "import json;print(json.load(open('/tmp/sub.json'))['referralId'])")
          curl -fsSL "$BASE/specialists/$SID/dashboard?token=$TOK" -o /tmp/dash.json
          FID=$(python -c "import json;d=json.load(open('/tmp/dash.json'));print(d['referrals'][0]['files'][0]['id'])")
          curl -fsSL "$BASE/specialists/$SID/referrals/$RID/files/$FID?token=$TOK" -o /tmp/out.png
          python - <<'PY'
          import json, os
          h=json.load(open('/tmp/health.json',encoding='utf-8'))
          s=json.load(open('/tmp/sub.json',encoding='utf-8'))
          d=json.load(open('/tmp/dash.json',encoding='utf-8'))
          assert s.get('ok') and s.get('filesReceived')==1, s
          assert d.get('ok') and d.get('referrals') and d['referrals'][0]['tooth']=='46', d
          assert os.path.getsize('/tmp/out.png')>0
          out={'ok':True,'backend_version':h.get('version'),'specialist_registration':True,'conditional_referral_submission':True,'file_upload':True,'specialist_dashboard':True,'secure_file_download':True}
          json.dump(out,open('referral-smoke-result.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Save sanitized result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add referral-smoke-result.json
          git commit -m 'Record endodontic referral smoke result'
          git push
