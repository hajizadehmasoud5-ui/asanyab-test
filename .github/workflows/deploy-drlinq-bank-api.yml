name: Deploy DrLinq Bank API

on:
  push:
    branches: [main]
    paths:
      - 'bank_api/app.py'
      - 'bank_api/schema.sql'
      - 'bank_api/requirements.txt'
      - 'bank_api/Containerfile'
      - '.github/workflows/deploy-drlinq-bank-api.yml'
  workflow_dispatch:

concurrency:
  group: drlinq-bank-vps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Deploy current bank application only
        id: deploy
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/drlinq/bank-api'
          sshpass -e scp -P "$VPS_PORT" -o ConnectTimeout=20 bank_api/*.py bank_api/schema.sql bank_api/requirements.txt bank_api/Containerfile "$VPS_USER@$VPS_HOST:/opt/drlinq/bank-api/"
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/deploy.txt 2>/tmp/deploy.err <<'REMOTE'
          set -euo pipefail
          cd /opt/drlinq
          docker compose -f bank-compose.yml build
          docker compose -f bank-compose.yml up -d
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS https://n8n.drlinq.ir/bank/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          echo 'HEALTH:'
          curl -fsS https://n8n.drlinq.ir/bank/health
          echo
          echo 'STATS:'
          curl -fsS https://n8n.drlinq.ir/bank/stats
          echo
          REMOTE
      - name: Write deployment status
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,datetime
          def r(p):
            x=pathlib.Path(p); return x.read_text(errors='ignore').strip() if x.exists() else ''
          pathlib.Path('DRLINQ_BANK_DEPLOY_STATUS.json').write_text(json.dumps({
            'ok':os.environ.get('OUTCOME')=='success','report':r('/tmp/deploy.txt')[-12000:],'error':r('/tmp/deploy.err')[-3000:],
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit deployment status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_BANK_DEPLOY_STATUS.json
          git commit -m "Record DrLinq bank API deployment" || exit 0
          git push
