name: VPS Add Laptop Key Temp

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/workflows/vps-add-laptop-key-temp.yml'

permissions:
  contents: read

jobs:
  add-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Force laptop key into root authorized_keys
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJGfEL+u0x58TedvjT4Lmc0IoS2jV4Nu4kMGXrYegRPn rayandika@DESKTOP-9027PMF1'
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o ConnectTimeout=15 -o BatchMode=no -o PasswordAuthentication=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -e; echo CONNECTED_AS=\$(whoami); if [ \"\$(id -u)\" -eq 0 ]; then SUDO=''; else SUDO='sudo -n'; fi; \$SUDO install -d -m 700 -o root -g root /root/.ssh; \$SUDO touch /root/.ssh/authorized_keys; \$SUDO grep -qxF '$KEY' /root/.ssh/authorized_keys || printf '%s\n' '$KEY' | \$SUDO tee -a /root/.ssh/authorized_keys >/dev/null; \$SUDO chown root:root /root/.ssh/authorized_keys; \$SUDO chmod 600 /root/.ssh/authorized_keys; echo ROOT_KEY_OK; \$SUDO sshd -T | grep -E '^(pubkeyauthentication|authorizedkeysfile|permitrootlogin) ' || true"

      - name: Verify root key explicitly
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          sshpass -e ssh -o ConnectTimeout=15 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "if [ \"\$(id -u)\" -eq 0 ]; then SUDO=''; else SUDO='sudo -n'; fi; \$SUDO grep -q 'rayandika@DESKTOP-9027PMF1' /root/.ssh/authorized_keys && echo VERIFIED_ROOT_KEY"

# trigger-root-fix
