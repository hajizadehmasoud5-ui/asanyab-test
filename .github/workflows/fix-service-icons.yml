name: Fix service icons
on:
  push:
    paths:
      - '.github/workflows/fix-service-icons.yml'
permissions:
  contents: write
jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace service emoji with SVG icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          svgs = [
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 5c-6 0-9 5-9 11 0 6 3 10 5 15 2 5 3 12 6 12 3 0 3-8 5-8s2 8 5 8c3 0 4-7 6-12 2-5 5-9 5-15 0-6-3-11-9-11-3 0-5 2-7 2s-4-2-7-2Z"/><path d="M24 24v15M20 29h8M20 34h8M21 39h6"/></svg>''',
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 8c-5 0-8 5-8 11 0 5 2 9 4 14 2 5 3 10 6 10 3 0 3-7 6-7s3 7 6 7c3 0 4-5 6-10 2-5 4-9 4-14 0-6-3-11-8-11-3 0-5 2-8 2s-5-2-8-2Z"/><path d="M37 5v8M33 9h8M8 6v5M5.5 8.5h5"/></svg>''',
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 10h18l-2 8H17l-2-8Z"/><path d="M17 18c-4 3-5 7-4 12 1 6 3 13 6 13 3 0 3-7 5-7s2 7 5 7c3 0 5-7 6-13 1-5 0-9-4-12"/><path d="M18 14h12"/></svg>''',
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 7c-5 0-8 5-8 11 0 6 3 10 5 15 2 5 3 10 6 10 3 0 3-7 6-7s3 7 6 7c3 0 4-5 6-10 2-5 5-9 5-15 0-6-3-11-8-11-3 0-5 2-9 2s-6-2-9-2Z"/><rect x="12" y="20" width="24" height="9" rx="3"/><path d="M18 20v9M24 20v9M30 20v9"/></svg>''',
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 6c-5 0-8 5-8 11 0 5 3 10 5 15 2 5 3 11 6 11 3 0 3-8 6-8s3 8 6 8c3 0 4-6 6-11 2-5 5-10 5-15 0-6-3-11-8-11-3 0-5 2-9 2s-6-2-9-2Z"/><path d="M24 16v19M24 23c-4 2-6 5-6 9M24 23c4 2 6 5 6 9"/></svg>''',
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 7c-5 0-8 5-8 11 0 6 3 10 5 15 2 5 3 10 6 10 3 0 3-7 6-7s3 7 6 7c3 0 4-5 6-10 2-5 5-9 5-15 0-6-3-11-8-11-3 0-5 2-9 2s-6-2-9-2Z"/><path d="M17 17h14v8H17z"/><path d="M17 21h14"/></svg>''',
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 7c-5 0-8 5-8 11 0 6 3 10 5 15 2 5 3 10 6 10 3 0 3-7 6-7s3 7 6 7c3 0 4-5 6-10 2-5 5-9 5-15 0-6-3-11-8-11-3 0-5 2-9 2s-6-2-9-2Z"/><path d="M6 39l10-10M10 43l10-10M32 29l10 10M28 33l10 10"/></svg>''',
          '''<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 8c-5 0-8 5-8 11 0 5 3 9 5 14 2 5 3 10 6 10 3 0 3-7 6-7s3 7 6 7c3 0 4-5 6-10 2-5 5-9 5-14 0-6-3-11-8-11-3 0-5 2-9 2s-6-2-9-2Z"/><path d="M18 22c2 3 4 4 6 4s4-1 6-4"/><circle cx="19" cy="18" r="1.5"/><circle cx="29" cy="18" r="1.5"/></svg>'''
          ]

          replacement = 'const serviceIcons=[' + ','.join(repr(x) for x in svgs) + '];'
          s2, n = re.subn(r"const serviceIcons=\[[^;]*\];", replacement, s, count=1)
          if n != 1:
              raise SystemExit('serviceIcons array not found')

          marker = '.service .ico{width:44px;height:44px;border-radius:14px;background:var(--blue2);display:grid;place-items:center;margin:0 auto 10px;font-size:19px}'
          addition = marker + '.service .ico svg{width:30px;height:30px;fill:none;stroke:var(--blue);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}'
          if '.service .ico svg{' not in s2:
              if marker not in s2:
                  raise SystemExit('service icon CSS marker not found')
              s2 = s2.replace(marker, addition, 1)

          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit icon update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use consistent dental SVG service icons"
          git push
