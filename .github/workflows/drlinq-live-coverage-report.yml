name: DrLinq Live Coverage Report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-live-coverage-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Query coverage inside live bank container
        id: query
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'docker exec -i drlinq-bank-api python -' > /tmp/coverage.json <<'PY'
          import json,datetime
          from app import selection_count
          services=['داروخانه','دندانپزشکی','آزمایشگاه','فیزیوتراپی','رادیولوژی','بیمارستان','درمانگاه']
          cities=[('تهران','تهران'),('خوزستان','اهواز')]
          out={}
          for province,city in cities:
              key=f'{province}/{city}'
              out[key]={}
              for service in services:
                  try:
                      out[key][service]={'count':selection_count(service=service,province=province,city=city)}
                  except Exception as e:
                      out[key][service]={'error':str(e)}
          print(json.dumps({'coverage':out,'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},ensure_ascii=False))
          PY
      - name: Save report
        env:
          OUTCOME: ${{ steps.query.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('/tmp/coverage.json')
          if p.exists() and p.read_text(errors='ignore').strip():
              try: data=json.loads(p.read_text())
              except Exception as e: data={'ok':False,'error':str(e),'raw':p.read_text(errors='ignore')[-4000:]}
          else:
              data={'ok':False,'error':'coverage query produced no output'}
          data['workflow_ok']=os.environ.get('OUTCOME')=='success'
          pathlib.Path('DRLINQ_LIVE_COVERAGE_REPORT.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_LIVE_COVERAGE_REPORT.json
          git commit -m "Record live raw-provider coverage from VPS" || exit 0
          git push
