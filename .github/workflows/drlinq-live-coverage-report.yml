name: DrLinq Live Coverage Report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-live-coverage-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Query coverage inside live bank container
        id: query
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e scp -P "$VPS_PORT" -o ConnectTimeout=20 bank_api/coverage_probe.py "$VPS_USER@$VPS_HOST:/opt/drlinq/bank-api/coverage_probe.py"
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/coverage.json 2>/tmp/coverage.err <<'REMOTE'
          set -euo pipefail
          docker cp /opt/drlinq/bank-api/coverage_probe.py drlinq-bank-api:/app/coverage_probe.py
          docker exec drlinq-bank-api python /app/coverage_probe.py
          REMOTE
      - name: Save report
        env:
          OUTCOME: ${{ steps.query.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('/tmp/coverage.json')
          err=pathlib.Path('/tmp/coverage.err')
          raw=p.read_text(errors='ignore').strip() if p.exists() else ''
          if raw:
              try: data=json.loads(raw.splitlines()[-1])
              except Exception as e: data={'ok':False,'error':str(e),'raw':raw[-4000:]}
          else:
              data={'ok':False,'error':'coverage query produced no output','stderr':err.read_text(errors='ignore')[-4000:] if err.exists() else ''}
          data['workflow_ok']=os.environ.get('OUTCOME')=='success'
          pathlib.Path('DRLINQ_LIVE_COVERAGE_REPORT.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_LIVE_COVERAGE_REPORT.json
          git commit -m "Record live raw-provider coverage from VPS" || exit 0
          git push
