name: DrLinq v2 smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-v2-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Run synthetic patient-provider flow
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          base='https://python-0jatcc.cldv.dev/alanoffer/api/v2'
          def get(path, params=None):
              url=base+path
              if params: url += '?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))
          def post(path, payload, params=None):
              url=base+path
              if params: url += '?' + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          health=get('/health')
          assert health.get('ok') is True
          provider=post('/providers/register',{
              'name':'دندانپزشک تست سیستم',
              'city':'اهواز',
              'service':'ایمپلنت',
              'priceMin':15000000,
              'priceMax':30000000,
              'availability':'تا ۳ روز',
              'features':['اقساط'],
              'offerText':'تست سیستمی'
          })
          request=post('/requests',{
              'service':'ایمپلنت',
              'city':'اهواز',
              'budgetMax':25000000,
              'priorities':['قیمت بهتر','اقساط'],
              'wait':'تا یک هفته',
              'note':'تست سیستمی'
          })
          pid=provider['providerId']; token=provider['accessToken']; rid=request['requestId']
          dash=get(f'/providers/{pid}/dashboard',{'token':token})
          matched=any(x.get('requestId')==rid for x in dash.get('requests',[]))
          assert matched
          offer=post(f'/providers/{pid}/requests/{rid}/offer',{
              'action':'interested','offeredPrice':24000000,'availability':'تا ۳ روز','note':'تست پیشنهاد'
          },{'token':token})
          assert offer.get('ok') is True
          patient=get(f'/requests/{rid}')
          offer_visible=any(x.get('providerId')==pid for x in patient.get('offers',[]))
          assert offer_visible
          selected=post(f'/requests/{rid}/select',{'providerId':pid})
          assert selected.get('ok') is True
          final=get(f'/requests/{rid}')
          selected_ok=final.get('request',{}).get('status')=='selected' and any(x.get('status')=='selected' for x in final.get('offers',[]))
          assert selected_ok
          out={
              'ok':True,
              'backend_version':health.get('version'),
              'provider_registered':provider.get('ok') is True,
              'request_registered':request.get('ok') is True,
              'matched':matched,
              'offer_visible_to_patient':offer_visible,
              'selection_completed':selected_ok,
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open('drlinq-v2-smoke-result.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2); f.write('\n')
          PY

      - name: Record sanitized result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drlinq-v2-smoke-result.json
          git diff --cached --quiet || git commit -m 'Record DrLinq v2 smoke result'
          git push >/dev/null 2>&1
