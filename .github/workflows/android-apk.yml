name: Build AlanOffer Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release APK
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Create temporary test signing key
        run: |
          keytool -genkeypair -v -keystore alanoffer-test.jks -storepass alanoffer123 -keypass alanoffer123 -alias alanoffer -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=AlanOffer Test, OU=Android, O=AlanOffer, L=Ahvaz, ST=Khuzestan, C=IR"
      - name: Align and sign APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk AlanOffer-Ahvaz-v0.3-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks alanoffer-test.jks \
            --ks-key-alias alanoffer \
            --ks-pass pass:alanoffer123 \
            --key-pass pass:alanoffer123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out AlanOffer-Ahvaz-v0.3.apk \
            AlanOffer-Ahvaz-v0.3-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs AlanOffer-Ahvaz-v0.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlanOffer-Ahvaz-v0.3
          path: AlanOffer-Ahvaz-v0.3.apk
          if-no-files-found: error
