name: DrLinq Alborz Ahvaz Live Pilot

on:
  push:
    branches: [main]
    paths:
      - 'bank_api/seed_alborz_ahvaz_pilot.py'
      - '.github/workflows/drlinq-alborz-ahvaz-live-pilot.yml'
  workflow_dispatch:

concurrency:
  group: drlinq-bank-vps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Seed real Alborz Ahvaz providers and verify
        id: run
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e scp -P "$VPS_PORT" -o ConnectTimeout=20 bank_api/seed_alborz_ahvaz_pilot.py "$VPS_USER@$VPS_HOST:/tmp/seed_alborz_ahvaz_pilot.py"
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/out.txt 2>/tmp/err.txt <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/seed_alborz_ahvaz_pilot.py drlinq-bank-api:/app/seed_alborz_ahvaz_pilot.py
          echo 'INGEST:'
          docker exec drlinq-bank-api python /app/seed_alborz_ahvaz_pilot.py
          echo
          echo 'STATS:'
          curl -fsS https://n8n.drlinq.ir/bank/stats
          echo
          for SERVICE in 'دندانپزشکی' 'آزمایشگاه' 'داروخانه'; do
            echo "SERVICE:$SERVICE"
            curl -fsS -G 'https://n8n.drlinq.ir/bank/providers' \
              --data-urlencode "service=$SERVICE" \
              --data-urlencode 'insurer=بیمه البرز' \
              --data-urlencode 'province=خوزستان' \
              --data-urlencode 'city=اهواز' \
              --data-urlencode 'limit=5'
            echo
          done
          REMOTE
      - name: Record live pilot status
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,datetime
          def read(p):
              x=pathlib.Path(p)
              return x.read_text(errors='ignore').strip() if x.exists() else ''
          pathlib.Path('DRLINQ_ALBORZ_AHVAZ_LIVE_STATUS.json').write_text(json.dumps({
              'ok': os.environ.get('OUTCOME') == 'success',
              'report': read('/tmp/out.txt')[-30000:],
              'error': read('/tmp/err.txt')[-8000:],
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          },ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_ALBORZ_AHVAZ_LIVE_STATUS.json
          git commit -m "Record Alborz Ahvaz live pilot result" || exit 0
          git push
