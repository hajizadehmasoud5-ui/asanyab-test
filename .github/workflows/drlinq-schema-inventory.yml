name: DrLinq Schema Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-schema-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Read server schema files
        id: probe
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=20 -o BatchMode=no -o PasswordAuthentication=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/schema.txt 2>/tmp/schema.err <<'REMOTE'
          set +e
          cd /opt/drlinq || exit 1
          echo "--- compose services ---"
          docker compose config --services 2>/dev/null || true
          echo "--- core schema ---"
          sed -n '1,300p' database/001_core_schema.sql 2>/dev/null || true
          REMOTE
      - name: Write status
        env:
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,datetime
          def r(p):
            x=pathlib.Path(p); return x.read_text(errors='ignore').strip() if x.exists() else ''
          pathlib.Path('DRLINQ_SCHEMA_STATUS.json').write_text(json.dumps({
            'connected': os.environ.get('OUTCOME')=='success',
            'report': r('/tmp/schema.txt')[:30000],
            'error': r('/tmp/schema.err')[-1200:],
            'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_SCHEMA_STATUS.json
          git commit -m "Record DrLinq schema inventory" || exit 0
          git push
