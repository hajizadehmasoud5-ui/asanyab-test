name: DrLinq secretary smoke
on:
  push:
    paths:
      - '.github/workflows/secretary-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test secretary flow
        run: |
          set -euo pipefail
          BASE='https://python-0jatcc.cldv.dev/alanoffer/api/secretary'
          curl -fsSL --retry 5 --retry-delay 3 "$BASE/health" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('version') == '0.1.0', d
          PY
          curl -fsSL -X POST "$BASE/clinics/register" -H 'Content-Type: application/json' \
            --data '{"name":"مرکز تست منشی","category":"کلینیک دندانپزشکی","city":"اهواز","area":"کیانپارس","services":["ایمپلنت","روکش"],"insurers":["بیمه دانا"],"hoursText":"عصر","paymentText":"پرداخت مرحله‌ای","faq":[{"q":"بیمه دانا دارید؟","a":"بله، طبق قرارداد مرکز بررسی می‌شود."}]}' -o /tmp/reg.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reg.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('clinicId') and d.get('accessToken') and d.get('slug'), d
          PY
          CID=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['clinicId'])")
          TOK=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['accessToken'])")
          SLUG=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['slug'])")
          curl -fsSL "$BASE/c/$SLUG" -o /tmp/pub.json
          curl -fsSL -X POST "$BASE/c/$SLUG/inquiries" -H 'Content-Type: application/json' \
            --data '{"kind":"appointment","patientName":"بیمار تست","patientPhone":"0000000000","service":"ایمپلنت","preferredTime":"فردا عصر"}' -o /tmp/inq.json
          curl -fsSL "$BASE/clinics/$CID/dashboard?token=$TOK" -o /tmp/dash.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/pub.json',encoding='utf-8'))
          i=json.load(open('/tmp/inq.json',encoding='utf-8'))
          d=json.load(open('/tmp/dash.json',encoding='utf-8'))
          assert p.get('ok') and i.get('ok') and d.get('ok')
          assert len(d.get('inquiries',[])) >= 1
          out={
            'ok': True,
            'backend_version': '0.1.0',
            'clinic_registration': True,
            'public_link': True,
            'patient_inquiry': True,
            'clinic_dashboard': True,
          }
          json.dump(out,open('secretary-smoke-result.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Save sanitized result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add secretary-smoke-result.json
          git commit -m 'Record smart secretary smoke result'
          git push
