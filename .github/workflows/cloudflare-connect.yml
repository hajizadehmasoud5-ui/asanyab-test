name: Cloudflare Connection Check

on:
  push:
    branches:
      - cloudflare-connect
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare API token with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest whoami

      - name: Ensure DrLinq Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx --yes wrangler@latest pages project list --json)"
          if printf '%s' "$projects" | jq -e '.[] | select(.name == "drlinq")' >/dev/null; then
            echo "drlinq_pages_project_exists=true"
          else
            echo "drlinq_pages_project_exists=false"
            set +e
            create_output="$(npx --yes wrangler@latest pages project create drlinq --production-branch main 2>&1)"
            create_code=$?
            set -e
            if [ "$create_code" -ne 0 ]; then
              if printf '%s' "$create_output" | grep -qi 'already exists'; then
                echo "drlinq_pages_project_exists=true"
              else
                printf '%s\n' "$create_output" >&2
                exit "$create_code"
              fi
            else
              printf '%s\n' "$create_output"
            fi
          fi

      - name: Build safe preview bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cf-pages-dist
          mkdir -p cf-pages-dist
          cp index.html robots.txt sitemap.xml cf-pages-dist/

      - name: Deploy DrLinq preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest pages deploy cf-pages-dist --project-name=drlinq --branch=cloudflare-connect
