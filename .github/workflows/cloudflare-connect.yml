name: Cloudflare Connection Check

on:
  push:
    branches:
      - cloudflare-connect
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare API token with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest whoami

      - name: Ensure DrLinq Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx --yes wrangler@latest pages project list --json)"
          if printf '%s' "$projects" | jq -e '.[] | select(.name == "drlinq")' >/dev/null; then
            echo "drlinq_pages_project_exists=true"
          else
            echo "drlinq_pages_project_exists=false"
            set +e
            create_output="$(npx --yes wrangler@latest pages project create drlinq --production-branch main 2>&1)"
            create_code=$?
            set -e
            if [ "$create_code" -ne 0 ]; then
              if printf '%s' "$create_output" | grep -qi 'already exists'; then
                echo "drlinq_pages_project_exists=true"
              else
                printf '%s\n' "$create_output" >&2
                exit "$create_code"
              fi
            else
              printf '%s\n' "$create_output"
            fi
          fi

      - name: Build safe preview bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cf-pages-dist
          mkdir -p cf-pages-dist
          cp index.html robots.txt sitemap.xml cf-pages-dist/

      - name: Deploy DrLinq preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest pages deploy cf-pages-dist --project-name=drlinq --branch=cloudflare-connect

      - name: Check DrLinq zone access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=drlinq.ir")"
          success="$(printf '%s' "$response" | jq -r '.success // false')"
          count="$(printf '%s' "$response" | jq -r '.result | if type=="array" then length else 0 end')"
          echo "zone_api_success=$success"
          echo "drlinq_zone_count=$count"
          if [ "$success" != "true" ]; then
            printf '%s' "$response" | jq -r '.errors[]? | "cloudflare_error_code=\(.code) message=\(.message)"'
          fi

      - name: Ensure preview.drlinq.ir custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="071050881d9e94f9fcf18db432bc972e"
          BASE="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/drlinq/domains"
          domains="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$BASE")"
          if printf '%s' "$domains" | jq -e '.result[]? | select(.name == "preview.drlinq.ir")' >/dev/null; then
            echo "preview_domain_exists=true"
          else
            created="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"preview.drlinq.ir"}' "$BASE")"
            success="$(printf '%s' "$created" | jq -r '.success // false')"
            echo "preview_domain_create_success=$success"
            if [ "$success" != "true" ]; then
              printf '%s' "$created" | jq -r '.errors[]? | "cloudflare_error_code=\(.code) message=\(.message)"'
            else
              printf '%s' "$created" | jq -r '"preview_domain_status=" + (.result.status // "unknown")'
            fi
          fi
