name: Cloudflare Connection Check

on:
  push:
    branches:
      - cloudflare-connect
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare API token with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest whoami

      - name: Check whether DrLinq Pages project already exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          projects="$(npx --yes wrangler@latest pages project list --json)"
          if printf '%s' "$projects" | jq -e '.[] | select(.name == "drlinq")' >/dev/null; then
            echo "drlinq_pages_project_exists=true"
          else
            echo "drlinq_pages_project_exists=false"
          fi
