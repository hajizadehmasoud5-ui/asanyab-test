name: Assemble Cloudiva deploy sources

on:
  push:
    branches: [cloudiva-deploy]
    paths:
      - '.deploy_payload/**'
      - '.github/workflows/assemble-cloudiva.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudiva-deploy
      - name: Decode sources
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if [ -f .deploy_payload/myapp.py.gz.b64 ]; then
            base64 -d .deploy_payload/myapp.py.gz.b64 | gzip -d > myapp.py
            changed=1
          fi
          if [ -f .deploy_payload/alanoffer_blueprint.py.gz.b64 ]; then
            base64 -d .deploy_payload/alanoffer_blueprint.py.gz.b64 | gzip -d > alanoffer_blueprint.py
            changed=1
          fi
          python -m py_compile myapp.py alanoffer_blueprint.py
          rm -rf .deploy_payload
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Assemble sanitized Cloudiva runtime sources"
            git push origin cloudiva-deploy
          fi
