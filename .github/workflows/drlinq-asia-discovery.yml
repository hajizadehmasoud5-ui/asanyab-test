name: DrLinq Asia Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-asia-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official Asia centers page
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,datetime
          url='https://www.bimehasia.com/%D9%85%D8%B1%D8%A7%DA%A9%D8%B2-%D8%A7%D8%B1%D8%A7%DB%8C%D9%87-%D8%AE%D8%AF%D9%85%D8%A7%D8%AA/%D9%85%D8%B1%D8%A7%D8%AC%D8%B9-%D8%AF%D8%B1%D9%85%D8%A7%D9%86%DB%8C-%D8%B7%D8%B1%D9%81-%D9%82%D8%B1%D8%A7%D8%B1%D8%AF%D8%A7%D8%AF'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 DrLinqDiscovery/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            html=r.read().decode('utf-8','ignore')
          out={'url':url,'bytes':len(html)}
          tables=re.findall(r'<table\b.*?</table>',html,re.I|re.S)
          out['table_count']=len(tables)
          out['table_rows']=[len(re.findall(r'<tr\b.*?</tr>',t,re.I|re.S)) for t in tables[:20]]
          links=[]
          for href,text in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',html,re.I|re.S):
            txt=re.sub(r'<[^>]+>',' ',text); txt=re.sub(r'\s+',' ',txt).strip()
            if any(x in txt for x in ['1','2','3','4','5','بعد','قبل','>|','<|']) or any(k in href.lower() for k in ['start=','limitstart','page','filter','search']):
              links.append({'href':href,'text':txt[:100]})
          out['pagination_links']=links[:200]
          forms=[]
          for m in re.finditer(r'<form\b([^>]*)>(.*?)</form>',html,re.I|re.S):
            attrs=m.group(1); body=m.group(2)
            action=re.search(r'action=["\']([^"\']*)',attrs,re.I)
            method=re.search(r'method=["\']([^"\']*)',attrs,re.I)
            fields=[]
            for tag in re.findall(r'<(?:input|select|button)\b[^>]*>',body,re.I):
              name=re.search(r'name=["\']([^"\']+)',tag,re.I); value=re.search(r'value=["\']([^"\']*)',tag,re.I)
              if name: fields.append({'name':name.group(1),'value':value.group(1) if value else ''})
            forms.append({'action':action.group(1) if action else '', 'method':method.group(1) if method else '', 'fields':fields[:100]})
          out['forms']=forms[:20]
          strings=sorted(set(re.findall(r'["\']([^"\']{3,220})["\']',html)))
          out['candidates']=[x for x in strings if any(k in x.lower() for k in ['ajax','api','limitstart','filter','province','city','ostan','shahr'])][:200]
          out['checked_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('DRLINQ_ASIA_DISCOVERY.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_ASIA_DISCOVERY.json
          git commit -m "Record Asia official centers discovery" || exit 0
          git push
