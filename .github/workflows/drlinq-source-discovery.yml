name: DrLinq Source Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-source-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public source pages
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,datetime
          urls={
            'dana':'https://dana1404.ir/centers',
            'mellat':'https://www.mellatinsurance.com/marakez',
            'pasargad':'https://www.insurancepasargad.com/service-portal/174-treatment-centers',
          }
          out={}
          for key,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 DrLinqSourceDiscovery/1.0'})
              raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',raw,re.I)
              links=re.findall(r'href=["\']([^"\']+)',raw,re.I)
              endpoints=sorted(set(re.findall(r'(?:https?://[^"\'\s<>]+|/[A-Za-z0-9_./?=&%-]*(?:api|center|markaz|darman|medical)[A-Za-z0-9_./?=&%-]*)',raw,re.I)))
              out[key]={
                'url':url,'bytes':len(raw),'scripts':scripts[:30],
                'candidate_links':[x for x in links if any(t in x.lower() for t in ['center','darman','medical','hospital','download','pdf'])][:40],
                'candidate_endpoints':endpoints[:80],
                'has_next_data':'__NEXT_DATA__' in raw,
                'has_nuxt':'__NUXT__' in raw,
                'title':(re.search(r'<title[^>]*>(.*?)</title>',raw,re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',raw,re.I|re.S) else '')
              }
            except Exception as e:
              out[key]={'url':url,'error':str(e)}
          out['checked_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('DRLINQ_SOURCE_DISCOVERY.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit discovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_SOURCE_DISCOVERY.json
          git commit -m "Record DrLinq source discovery" || exit 0
          git push
