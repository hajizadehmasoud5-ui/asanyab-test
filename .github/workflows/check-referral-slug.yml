name: Check referral slug
on:
  push:
    paths:
      - '.github/workflows/check-referral-slug.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public specialist slugs
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          base='https://python-0jatcc.cldv.dev/alanoffer/api/referral/c/'
          slugs=['دکتر-محسن-شاهمرادی','demo-endo']
          out={}
          for s in slugs:
              u=base+urllib.parse.quote(s)
              try:
                  with urllib.request.urlopen(u, timeout=15) as r:
                      d=json.load(r)
                      out[s]={'status':r.status,'ok':bool(d.get('ok')),'name':(d.get('specialist') or {}).get('name','')}
              except urllib.error.HTTPError as e:
                  out[s]={'status':e.code,'ok':False}
              except Exception as e:
                  out[s]={'status':0,'ok':False,'error':type(e).__name__}
          json.dump(out,open('referral-slug-check.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Save sanitized result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add referral-slug-check.json
          git commit -m 'Record referral slug check'
          git push
