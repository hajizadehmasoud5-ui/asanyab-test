name: Deploy DrLinq Marketplace Test

on:
  push:
    branches: [main]
    paths:
      - 'marketplace-test/**'
      - 'marketplace_test_api/**'
      - 'bank_api/marketplace.py'
      - 'bank_api/marketplace_smoke.py'
      - '.github/workflows/deploy-marketplace-test.yml'
  workflow_dispatch:

concurrency:
  group: drlinq-marketplace-test-vps
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Deploy isolated test environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/drlinq-marketplace-test/repo/bank_api /opt/drlinq-marketplace-test/repo/marketplace_test_api'
          sshpass -e scp -P "$VPS_PORT" -o ConnectTimeout=20 \
            bank_api/requirements.txt bank_api/marketplace.py bank_api/marketplace_smoke.py \
            "$VPS_USER@$VPS_HOST:/opt/drlinq-marketplace-test/repo/bank_api/"
          sshpass -e scp -P "$VPS_PORT" -o ConnectTimeout=20 marketplace_test_api/* \
            "$VPS_USER@$VPS_HOST:/opt/drlinq-marketplace-test/repo/marketplace_test_api/"
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          TEST_ROOT=/opt/drlinq-marketplace-test/repo
          TEST_API_DIR="$TEST_ROOT/marketplace_test_api"
          TEST_ENV="$TEST_API_DIR/.env"
          TEST_COMPOSE="$TEST_API_DIR/docker-compose.yml"
          TEST_DB_CONTAINER=drlinq-marketplace-test-postgres
          TEST_API_CONTAINER=drlinq-marketplace-test-api
          PROD_DB_CONTAINER=drlinq-postgres

          if [ ! -f "$TEST_ENV" ]; then
            umask 077
            test_password="$(openssl rand -hex 24)"
            {
              echo 'TEST_DB_NAME=drlinq_marketplace_test'
              echo 'TEST_DB_USER=drlinq_test'
              echo "TEST_DB_PASSWORD=$test_password"
            } > "$TEST_ENV"
          fi
          set -a
          . "$TEST_ENV"
          set +a

          cd "$TEST_API_DIR"
          docker compose -p drlinq-marketplace-test -f "$TEST_COMPOSE" up -d marketplace-test-postgres
          for i in $(seq 1 40); do
            if docker exec "$TEST_DB_CONTAINER" pg_isready -U "$TEST_DB_USER" -d "$TEST_DB_NAME" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$TEST_DB_CONTAINER" pg_isready -U "$TEST_DB_USER" -d "$TEST_DB_NAME"

          set -a
          . /opt/drlinq/.env
          set +a
          prod_before="$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$PROD_DB_CONTAINER" \
            psql -h 127.0.0.1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT count(*) FROM bank_providers")"

          docker exec -e PGPASSWORD="$TEST_DB_PASSWORD" "$TEST_DB_CONTAINER" \
            psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U "$TEST_DB_USER" -d "$TEST_DB_NAME" \
            -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public; CREATE EXTENSION IF NOT EXISTS pgcrypto;'

          dump_file="$(mktemp /tmp/drlinq-bank-copy.XXXXXX.sql)"
          trap 'find /tmp -maxdepth 1 -name "drlinq-bank-copy.*.sql" -type f -delete' EXIT
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$PROD_DB_CONTAINER" \
            pg_dump -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --no-privileges \
            -t bank_sources -t bank_providers -t bank_locations \
            -t bank_provider_locations -t bank_services -t bank_service_aliases \
            -t bank_provider_services -t bank_insurers -t bank_contracts > "$dump_file"
          docker exec -i -e PGPASSWORD="$TEST_DB_PASSWORD" "$TEST_DB_CONTAINER" \
            psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U "$TEST_DB_USER" -d "$TEST_DB_NAME" < "$dump_file" >/dev/null

          docker compose -p drlinq-marketplace-test -f "$TEST_COMPOSE" up -d --build marketplace-test-api
          for i in $(seq 1 50); do
            if docker exec "$TEST_API_CONTAINER" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$TEST_API_CONTAINER" python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"

          caddy_file=/opt/drlinq/Caddyfile
          if ! grep -q 'drlinq-marketplace-test-route' "$caddy_file"; then
            caddy_new="$(mktemp /opt/drlinq/Caddyfile.marketplace-test.XXXXXX)"
            awk '
              !done && /^n8n\.drlinq\.ir[[:space:]]*\{/ {
                print
                print "  # drlinq-marketplace-test-route"
                print "  handle_path /marketplace-test-api/* {"
                print "    reverse_proxy drlinq-marketplace-test-api:8000"
                print "  }"
                done=1
                next
              }
              { print }
              END { if (!done) exit 42 }
            ' "$caddy_file" > "$caddy_new"
            docker run --rm -v "$caddy_new:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile
            cp "$caddy_file" "$caddy_file.pre-marketplace-test"
            mv "$caddy_new" "$caddy_file"
            if ! docker exec drlinq-caddy caddy reload --config /etc/caddy/Caddyfile; then
              cp "$caddy_file.pre-marketplace-test" "$caddy_file"
              docker exec drlinq-caddy caddy reload --config /etc/caddy/Caddyfile
              exit 1
            fi
          fi

          prod_after="$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$PROD_DB_CONTAINER" \
            psql -h 127.0.0.1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT count(*) FROM bank_providers")"
          test "$prod_before" = "$prod_after"
          prod_marketplace="$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" "$PROD_DB_CONTAINER" \
            psql -h 127.0.0.1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT to_regclass('public.marketplace_requests') IS NULL")"
          test "$prod_marketplace" = 't'

          curl -fsS https://n8n.drlinq.ir/marketplace-test-api/health
          echo
          docker exec "$TEST_API_CONTAINER" python /app/marketplace_smoke.py --base-url http://127.0.0.1:8000
          REMOTE
      - name: Verify HTTPS frontend and API
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS https://drlinq.ir/marketplace-test/ | grep -q 'درمان یا خدمت مورد نیازت را ثبت کن'; then
              break
            fi
            sleep 5
          done
          curl -fsS https://drlinq.ir/marketplace-test/ | grep -q 'درمان یا خدمت مورد نیازت را ثبت کن'
          curl -fsS https://n8n.drlinq.ir/marketplace-test-api/health | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['environment']=='isolated-test' and d['production_writes'] is False"
