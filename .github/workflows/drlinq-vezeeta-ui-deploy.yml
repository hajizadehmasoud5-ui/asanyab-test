name: DrLinq Vezeeta UI Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-vezeeta-ui-deploy.yml'
  workflow_dispatch:

concurrency:
  group: drlinq-vezeeta-ui
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Deploy current UI
        id: deploy
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e scp -P "$VPS_PORT" bank_api/app.py "$VPS_USER@$VPS_HOST:/opt/drlinq/bank-api/app.py"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/out.txt 2>/tmp/err.txt <<'REMOTE'
          set -euo pipefail
          cd /opt/drlinq
          docker compose -f bank-compose.yml build
          docker compose -f bank-compose.yml up -d
          for i in $(seq 1 40); do
            if curl -fsS https://n8n.drlinq.ir/bank/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo 'HEALTH:'
          curl -fsS https://n8n.drlinq.ir/bank/health
          echo
          echo 'VIEW:'
          curl -fsS https://n8n.drlinq.ir/bank/view | grep -o 'خدمت مناسب را نزدیک خودت پیدا کن' | head -n1
          echo
          echo 'FILTER_COUNT:'
          curl -fsS https://n8n.drlinq.ir/bank/filters | python3 -c "import sys,json; d=json.load(sys.stdin); print('insurers=',len(d.get('insurers',[])),'services=',len(d.get('services',[])),'provinces=',len(d.get('provinces',[])))"
          REMOTE
      - name: Save status
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,datetime
          def r(p):
              x=pathlib.Path(p); return x.read_text(errors='ignore').strip() if x.exists() else ''
          pathlib.Path('DRLINQ_VEZEETA_UI_STATUS.json').write_text(json.dumps({
              'ok':os.environ.get('OUTCOME')=='success',
              'report':r('/tmp/out.txt')[-12000:],
              'error':r('/tmp/err.txt')[-3000:],
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_VEZEETA_UI_STATUS.json
          git commit -m "Record Vezeeta-style DrLinq UI deployment" || exit 0
          git push
