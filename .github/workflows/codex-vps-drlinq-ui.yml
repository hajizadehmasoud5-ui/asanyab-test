name: Codex VPS - DrLinq UI task

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/codex-tasks/drlinq-ui-task.txt'

permissions:
  contents: write

concurrency:
  group: codex-vps-drlinq-ui
  cancel-in-progress: false

jobs:
  codex-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drlinq-patient-v1-wip
          fetch-depth: 0

      - name: Prepare workspace archive
        run: |
          tar --exclude=.git -czf /tmp/drlinq-codex-work.tgz .

      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Run Codex on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote_dir="/tmp/drlinq-codex-${GITHUB_RUN_ID}"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          sshpass -e scp -P "$VPS_PORT" /tmp/drlinq-codex-work.tgz "$VPS_USER@$VPS_HOST:$remote_dir/work.tgz"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$remote_dir'" <<'REMOTE'
          set -euo pipefail
          remote_dir="$1"
          work="$remote_dir/work"
          mkdir -p "$work"
          tar -xzf "$remote_dir/work.tgz" -C "$work"
          command -v codex
          codex --version

          auth_file="$(find /root /home /opt -type f -path '*/.codex/auth.json' 2>/dev/null | head -n 1 || true)"
          if [ -n "$auth_file" ]; then
            export CODEX_HOME="$(dirname "$auth_file")"
            echo "Using existing Codex login from $CODEX_HOME"
          else
            echo "No existing Codex auth.json found on VPS" >&2
            exit 9
          fi

          cd "$work"
          prompt="$(cat .github/codex-tasks/drlinq-ui-task.txt)"
          codex exec --sandbox workspace-write --skip-git-repo-check "$prompt"
          test -s drlinq-test/implant-intake.html
          grep -q 'فک بالا' drlinq-test/implant-intake.html
          grep -q 'فک پایین' drlinq-test/implant-intake.html
          grep -q '18' drlinq-test/implant-intake.html
          grep -q '38' drlinq-test/implant-intake.html
          tar -czf "$remote_dir/result.tgz" drlinq-test/implant-intake.html
          REMOTE
          sshpass -e scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$remote_dir/result.tgz" /tmp/drlinq-codex-result.tgz
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -rf '$remote_dir'"

      - name: Apply Codex result and validate
        run: |
          tar -xzf /tmp/drlinq-codex-result.tgz
          git diff --check
          node --test drlinq-test/tests/*.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drlinq-test/implant-intake.html')
          t=p.read_text(encoding='utf-8')
          required=['فک بالا','فک پایین','انتخاب روی تصویر','18','17','16','11','21','28','48','41','31','38']
          for x in required:
              assert x in t, x
          assert '<svg' in t.lower(), 'SVG dental chart missing'
          assert 'assets/lower-real.js' in t, 'existing lower photo asset must remain'
          PY

      - name: Commit Codex changes
        run: |
          if git diff --quiet -- drlinq-test/implant-intake.html; then
            echo 'Codex made no change' >&2
            exit 1
          fi
          git config user.name 'DrLinq Codex VPS'
          git config user.email 'codex-vps@users.noreply.github.com'
          git add drlinq-test/implant-intake.html
          git commit -m 'Update implant location UI via Codex on VPS'
          git push origin HEAD:drlinq-patient-v1-wip
