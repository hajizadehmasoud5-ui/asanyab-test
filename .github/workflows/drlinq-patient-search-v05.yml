name: DrLinq Patient Search v0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drlinq-patient-search-v05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Deploy and verify
        id: run
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e scp -P "$VPS_PORT" bank_api/app.py "$VPS_USER@$VPS_HOST:/opt/drlinq/bank-api/app.py"
          sshpass -e ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/out.txt 2>/tmp/err.txt <<'REMOTE'
          set -euo pipefail
          cd /opt/drlinq
          docker compose -f bank-compose.yml build
          docker compose -f bank-compose.yml up -d
          for i in $(seq 1 40); do
            if curl -fsS https://n8n.drlinq.ir/bank/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo 'FILTERS_ALL:'
          curl -fsS 'https://n8n.drlinq.ir/bank/filters'
          echo
          echo 'FILTERS_KHUZESTAN:'
          curl -fsS --get 'https://n8n.drlinq.ir/bank/filters' --data-urlencode 'province=خوزستان'
          echo
          echo 'FILTERS_AHVAZ:'
          curl -fsS --get 'https://n8n.drlinq.ir/bank/filters' --data-urlencode 'province=خوزستان' --data-urlencode 'city=اهواز'
          echo
          echo 'VIEW_CHECK:'
          curl -fsS 'https://n8n.drlinq.ir/bank/view' | grep -o 'چه خدمتی می‌خواهی؟' | head -n1
          REMOTE
      - name: Save status
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,datetime
          def r(p):
              x=pathlib.Path(p); return x.read_text(errors='ignore').strip() if x.exists() else ''
          pathlib.Path('DRLINQ_PATIENT_SEARCH_STATUS.json').write_text(json.dumps({
              'ok':os.environ.get('OUTCOME')=='success','report':r('/tmp/out.txt')[-24000:],'error':r('/tmp/err.txt')[-4000:],
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_PATIENT_SEARCH_STATUS.json
          git commit -m "Record patient search deployment" || exit 0
          git push
