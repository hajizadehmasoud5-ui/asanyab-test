name: Configure n8n Domain HTTPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-n8n-domain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install runner helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass jq

      - name: Configure Cloudflare DNS
        id: dns
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          zone_json=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=drlinq.ir&status=active")
          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')
          test -n "$zone_id"

          rec_json=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=A&name=n8n.drlinq.ir")
          rec_id=$(echo "$rec_json" | jq -r '.result[0].id // empty')
          payload=$(jq -nc --arg ip "$VPS_HOST" '{type:"A",name:"n8n",content:$ip,ttl:1,proxied:true}')

          if [ -n "$rec_id" ]; then
            out=$(curl -fsS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$rec_id")
          else
            out=$(curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")
          fi
          echo "$out" | jq -e '.success == true' >/dev/null

      - name: Configure Caddy and n8n URL
        id: server
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" -o BatchMode=no -o PasswordAuthentication=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -qq
          apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https curl gpg
          if [ ! -f /usr/share/keyrings/caddy-stable-archive-keyring.gpg ]; then
            curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
            curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' > /etc/apt/sources.list.d/caddy-stable.list
          fi
          apt-get update -qq
          apt-get install -y -qq caddy

          cat > /opt/n8n/compose.yml <<'EOF'
          services:
            postgres:
              image: postgres:16-alpine
              restart: unless-stopped
              environment:
                POSTGRES_USER: n8n
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: n8n
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
                interval: 5s
                timeout: 5s
                retries: 20

            n8n:
              image: docker.n8n.io/n8nio/n8n:latest
              restart: unless-stopped
              depends_on:
                postgres:
                  condition: service_healthy
              ports:
                - "127.0.0.1:5678:5678"
              environment:
                DB_TYPE: postgresdb
                DB_POSTGRESDB_HOST: postgres
                DB_POSTGRESDB_PORT: 5432
                DB_POSTGRESDB_DATABASE: n8n
                DB_POSTGRESDB_USER: n8n
                DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
                N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
                N8N_HOST: n8n.drlinq.ir
                N8N_PROTOCOL: https
                N8N_PORT: 5678
                N8N_EDITOR_BASE_URL: https://n8n.drlinq.ir/
                WEBHOOK_URL: https://n8n.drlinq.ir/
                N8N_PROXY_HOPS: 1
                N8N_SECURE_COOKIE: "true"
                GENERIC_TIMEZONE: Asia/Tehran
                TZ: Asia/Tehran
              volumes:
                - n8n_data:/home/node/.n8n

          volumes:
            postgres_data:
            n8n_data:
          EOF

          cd /opt/n8n
          docker compose up -d

          cat > /etc/caddy/Caddyfile <<'EOF'
          n8n.drlinq.ir {
              encode gzip zstd
              reverse_proxy 127.0.0.1:5678
          }
          EOF
          caddy validate --config /etc/caddy/Caddyfile
          systemctl enable --now caddy
          systemctl restart caddy

          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
            ufw allow 22/tcp >/dev/null || true
            ufw allow 80/tcp >/dev/null || true
            ufw allow 443/tcp >/dev/null || true
          fi

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5678/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1
          REMOTE

      - name: Check public HTTPS
        id: public
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 8 https://n8n.drlinq.ir/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Write sanitized result
        env:
          DNS_OUTCOME: ${{ steps.dns.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, datetime
          data = {
              'dns_ok': os.environ.get('DNS_OUTCOME') == 'success',
              'server_ok': os.environ.get('SERVER_OUTCOME') == 'success',
              'public_https_ok': os.environ.get('PUBLIC_OUTCOME') == 'success',
              'url': 'https://n8n.drlinq.ir',
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('vps-n8n-domain-result.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vps-n8n-domain-result.json
          git commit -m "Record n8n domain setup result" || exit 0
          git push
