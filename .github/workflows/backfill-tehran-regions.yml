name: Backfill Tehran Regions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-tehran-regions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Run conservative Tehran region backfill
        id: run
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          sshpass -e scp -P "$VPS_PORT" bank_api/backfill_tehran_regions.py "$VPS_USER@$VPS_HOST:/opt/drlinq/bank-api/backfill_tehran_regions.py"
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/tehran_regions.txt 2>/tmp/tehran_regions.err <<'REMOTE'
          set -euo pipefail
          docker cp /opt/drlinq/bank-api/backfill_tehran_regions.py drlinq-bank-api:/app/backfill_tehran_regions.py
          echo 'BACKFILL:'
          docker exec drlinq-bank-api python /app/backfill_tehran_regions.py
          echo 'FILTERS:'
          curl -fsS -G 'https://n8n.drlinq.ir/bank/filters' \
            --data-urlencode 'province=تهران' \
            --data-urlencode 'city=تهران' | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("districts",[]))'
          echo 'PHARMACY_DISTRICT_COUNTS:'
          for d in 'منطقه ۱۹' 'منطقه ۲۰' 'منطقه ۲۲'; do
            n=$(curl -fsS -G 'https://n8n.drlinq.ir/bank/providers' \
              --data-urlencode 'service=داروخانه' \
              --data-urlencode 'province=تهران' \
              --data-urlencode 'city=تهران' \
              --data-urlencode "district=$d" \
              --data-urlencode 'limit=200' | python3 -c 'import sys,json; print(len(json.load(sys.stdin).get("items",[])))')
            echo "$d=$n"
          done
          REMOTE
      - name: Save status
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,datetime
          def r(p):
            x=pathlib.Path(p); return x.read_text(errors='ignore').strip() if x.exists() else ''
          pathlib.Path('DRLINQ_TEHRAN_REGION_STATUS.json').write_text(json.dumps({
            'ok':os.environ.get('OUTCOME')=='success',
            'report':r('/tmp/tehran_regions.txt')[-12000:],
            'error':r('/tmp/tehran_regions.err')[-4000:],
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          },ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DRLINQ_TEHRAN_REGION_STATUS.json
          git commit -m "Record Tehran region backfill" || exit 0
          git push
