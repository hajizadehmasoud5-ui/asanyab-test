name: Codex VPS Probe

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/workflows/codex-vps-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Probe Codex installation and auth locations
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== identity ==='
          id
          printf 'HOME=%s\n' "$HOME"
          echo '=== codex binary ==='
          command -v codex || true
          codex --version 2>/dev/null || true
          echo '=== codex config/auth paths (names only) ==='
          for d in /root/.codex /home/*/.codex "$HOME/.codex"; do
            if [ -d "$d" ]; then
              echo "DIR $d"
              find "$d" -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sed -n '1,80p'
            fi
          done
          echo '=== possible codex processes ==='
          ps -eo user,pid,args | grep -i '[c]odex' || true
          echo '=== docker names containing codex/chatgpt/openai ==='
          docker ps -a --format '{{.Names}}' 2>/dev/null | grep -Ei 'codex|chatgpt|openai' || true
          echo '=== users ==='
          awk -F: '$3>=1000 || $1=="root" {print $1 ":" $6 ":" $7}' /etc/passwd
          REMOTE
