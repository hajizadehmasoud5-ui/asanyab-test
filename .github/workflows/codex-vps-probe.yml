name: Codex VPS Probe

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - '.github/workflows/codex-vps-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Test existing Codex session on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== version ==='
          codex --version
          echo '=== login status ==='
          codex login status || true
          echo '=== minimal exec test ==='
          tmp="$(mktemp -d)"
          cd "$tmp"
          timeout 45s codex exec --sandbox read-only --skip-git-repo-check 'Reply with exactly READY and nothing else.' || true
          rm -rf "$tmp"
          REMOTE
