name: Cleanup old control test runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-control-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete pre-hardening Cloudiva/Chabokan test runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in \
            32398521389 \
            32398612732 \
            32398978309 \
            32399539271 \
            32399582239 \
            32399663070
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}")
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              echo "cleanup_failed_for_run_${id}_http_${code}"
              exit 1
            fi
          done
          echo 'old_control_test_runs_cleaned'
