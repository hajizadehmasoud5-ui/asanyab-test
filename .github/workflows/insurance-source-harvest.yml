name: DrLinq Insurance Source Harvest

on:
  push:
    branches:
      - automation/insurance-source-harvest-20260824
    paths:
      - 'automation/insurance_harvest.py'
      - '.github/workflows/insurance-source-harvest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'automation/insurance_harvest.py'
      - '.github/workflows/insurance-source-harvest.yml'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Harvest public official insurer sources
        env:
          OUT_DIR: insurance_harvest_output
        run: python automation/insurance_harvest.py
      - name: Upload harvest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drlinq-insurance-source-harvest
          path: insurance_harvest_output/
          if-no-files-found: warn
          retention-days: 7
