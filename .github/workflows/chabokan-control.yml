name: Cloudiva control bridge

on:
  push:
    branches: [main]
    paths:
      - 'chabokan-control.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install official Cloudiva CLI
        run: npm install -g @cloudiva.net/cli

      - name: Login to Cloudiva with API token
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CHABOKAN_TOKEN" || { echo 'Missing GitHub secret: CHABOKAN_TOKEN'; exit 2; }
          diva login -t "$CHABOKAN_TOKEN"

      - name: Discover available control commands
        run: |
          set +e
          echo '--- diva help ---'
          diva --help
          echo '--- deploy help ---'
          diva deploy --help
          echo '--- service help (if available) ---'
          diva service --help
          exit 0

      - name: Verify live DrLinq backend
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 https://python-0jatcc.cldv.dev/alanoffer/api/chat/health
          echo
