name: Cloudiva control bridge

on:
  push:
    branches: [main]
    paths:
      - 'chabokan-control.json'
      - '.github/workflows/chabokan-control.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install official Cloudiva CLI
        run: npm install -g @cloudiva.net/cli

      - name: Login with Cloudiva API token
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CHABOKAN_TOKEN" || { echo 'missing_token' > /tmp/control_failure; exit 2; }
          diva login -t "$CHABOKAN_TOKEN"

      - name: List visible services and inspect safe command syntax
        run: |
          set +e
          echo '--- diva service list ---'
          diva service list
          echo '--- diva service logs --help ---'
          diva service logs --help
          echo '--- diva service restart --help ---'
          diva service restart --help
          echo '--- diva service start --help ---'
          diva service start --help
          exit 0

      - name: Verify live DrLinq backend
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 https://python-0jatcc.cldv.dev/alanoffer/api/chat/health
          echo

      - name: Write sanitized control result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, datetime
          try:
              req=json.load(open('chabokan-control.json',encoding='utf-8'))
          except Exception:
              req={}
          detail=''
          try:
              detail=open('/tmp/control_failure',encoding='utf-8').read().strip()
          except Exception:
              pass
          out={
              'service': req.get('service','python-0jatcc'),
              'action': 'cloudiva_service_discovery',
              'workflow_status': os.environ.get('JOB_STATUS','unknown'),
              'detail': detail,
              'run_id': os.environ.get('RUN_ID',''),
              'commit_sha': os.environ.get('COMMIT_SHA',''),
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open('cloudiva-control-result.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudiva-control-result.json
          git diff --cached --quiet || git commit -m 'Record Cloudiva control result'
          git push
