name: Cloudiva control bridge

on:
  push:
    branches: [main]
    paths:
      - 'chabokan-control.json'
      - '.github/workflows/chabokan-control.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: control

      - uses: actions/checkout@v4
        with:
          ref: cloudiva-deploy
          path: deploy-src

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install official Cloudiva CLI
        run: npm install -g @cloudiva.net/cli >/dev/null 2>&1

      - name: Read requested action
        id: ctl
        working-directory: control
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('chabokan-control.json',encoding='utf-8'))
          action=d.get('action','status')
          service=d.get('service','python-0jatcc')
          if action not in {'status','restart','start','deploy'}:
              raise SystemExit(f'Unsupported action: {action}')
          if service != 'python-0jatcc':
              raise SystemExit('Only the DrLinq python service is allowed')
          print(f'action={action}')
          print(f'service={service}')
          PY

      - name: Login to Cloudiva silently
        env:
          CLOUDIVA_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDIVA_TOKEN" || { echo 'missing_token' > /tmp/control_failure; exit 2; }
          if ! diva login -t "$CLOUDIVA_TOKEN" >/tmp/diva-login.txt 2>&1; then
            echo 'cloudiva_login_failed' > /tmp/control_failure
            exit 3
          fi

      - name: Verify target service access without exposing account data
        env:
          TARGET: ${{ steps.ctl.outputs.service }}
        run: |
          set -euo pipefail
          if ! diva service list >/tmp/diva-services.txt 2>&1; then
            echo 'service_list_failed' > /tmp/control_failure
            exit 4
          fi
          if ! grep -Fq "$TARGET" /tmp/diva-services.txt; then
            echo 'target_service_not_visible' > /tmp/control_failure
            exit 5
          fi

      - name: Validate deploy source
        if: steps.ctl.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          test -f deploy-src/server.py
          test -f deploy-src/alanoffer_blueprint.py
          test -f deploy-src/requirements.txt
          test -f deploy-src/start.sh
          grep -Fq "version='0.4.0'" deploy-src/alanoffer_blueprint.py || grep -Fq "VERSION='0.4.0'" deploy-src/alanoffer_blueprint.py

      - name: Run requested control action silently
        env:
          ACTION: ${{ steps.ctl.outputs.action }}
          TARGET: ${{ steps.ctl.outputs.service }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status)
              :
              ;;
            restart)
              if ! diva service restart -s "$TARGET" >/tmp/diva-action.txt 2>&1; then
                echo 'restart_failed' > /tmp/control_failure
                exit 6
              fi
              sleep 8
              ;;
            start)
              if ! diva service start -s "$TARGET" >/tmp/diva-action.txt 2>&1; then
                echo 'start_failed' > /tmp/control_failure
                exit 7
              fi
              sleep 8
              ;;
            deploy)
              if ! diva deploy --path deploy-src --service "$TARGET" >/tmp/diva-action.txt 2>&1; then
                echo 'deploy_failed' > /tmp/control_failure
                tail -n 20 /tmp/diva-action.txt || true
                exit 9
              fi
              sleep 15
              ;;
          esac

      - name: Verify live DrLinq backend silently
        run: |
          set -euo pipefail
          if ! curl -fsSL --retry 10 --retry-delay 4 https://python-0jatcc.cldv.dev/alanoffer/api/chat/health -o /tmp/health.json; then
            echo 'backend_health_failed' > /tmp/control_failure
            exit 8
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          if d.get('ok') is not True:
              raise SystemExit('backend_not_ok')
          PY

      - name: Write sanitized control result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          ACTION: ${{ steps.ctl.outputs.action }}
          TARGET: ${{ steps.ctl.outputs.service }}
        working-directory: control
        run: |
          python - <<'PY'
          import json, os, datetime
          detail=''
          try:
              detail=open('/tmp/control_failure',encoding='utf-8').read().strip()
          except Exception:
              pass
          health={}
          try:
              health=json.load(open('/tmp/health.json',encoding='utf-8'))
          except Exception:
              pass
          out={
              'service': os.environ.get('TARGET') or 'python-0jatcc',
              'action': os.environ.get('ACTION') or 'unknown',
              'workflow_status': os.environ.get('JOB_STATUS','unknown'),
              'detail': detail,
              'backend_ok': health.get('ok') is True,
              'backend_version': health.get('version'),
              'run_id': os.environ.get('RUN_ID',''),
              'commit_sha': os.environ.get('COMMIT_SHA',''),
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open('cloudiva-control-result.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudiva-control-result.json
          git diff --cached --quiet || git commit -m 'Record Cloudiva control result'
          git push >/dev/null 2>&1
