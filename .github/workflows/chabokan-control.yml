name: Cloudiva control bridge

on:
  push:
    branches: [main]
    paths:
      - 'chabokan-control.json'
      - '.github/workflows/chabokan-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install official Chabokan CLI
        run: npm install -g @chabokan.net/cli

      - name: Login with API token
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CHABOKAN_TOKEN" || { echo 'Missing GitHub secret: CHABOKAN_TOKEN'; exit 2; }
          chabok login --token "$CHABOKAN_TOKEN"

      - name: Show account and services
        run: |
          set -euo pipefail
          chabok account info
          chabok service list

      - name: Read requested action
        id: ctl
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('chabokan-control.json',encoding='utf-8'))
          action=d.get('action','status')
          service=d.get('service','python-0jatcc')
          if action not in {'status','logs','restart','start'}:
              raise SystemExit(f'Unsupported action: {action}')
          print(f'action={action}')
          print(f'service={service}')
          PY

      - name: Run requested control action
        env:
          ACTION: ${{ steps.ctl.outputs.action }}
          TARGET: ${{ steps.ctl.outputs.service }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status)
              chabok service list
              ;;
            logs)
              chabok service logs --service "$TARGET" | tail -n 150
              ;;
            restart)
              chabok service restart --service "$TARGET"
              sleep 8
              chabok service logs --service "$TARGET" | tail -n 120
              ;;
            start)
              chabok service start --service "$TARGET"
              sleep 8
              chabok service logs --service "$TARGET" | tail -n 120
              ;;
          esac

      - name: Verify live DrLinq backend
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 https://python-0jatcc.cldv.dev/alanoffer/api/chat/health
          echo
