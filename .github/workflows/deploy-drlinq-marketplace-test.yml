name: Deploy DrLinq Isolated Test

on:
  push:
    branches: [drlinq-patient-v1-wip]
    paths:
      - 'drlinq-test/**'
      - 'bank_api/app_implant.py'
      - 'bank_api/app_implant_patient.py'
      - 'bank_api/implant_schema.sql'
      - 'bank_api/Containerfile.implant-test'
      - 'bank_api/requirements.txt'
      - '.github/workflows/deploy-drlinq-marketplace-test.yml'
  workflow_dispatch:

concurrency:
  group: drlinq-isolated-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_BASE: https://n8n.drlinq.ir/drlinq-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: drlinq-test/package-lock.json

      - name: Run static, unit, and browser E2E checks
        run: |
          npm ci --prefix drlinq-test
          npm test --prefix drlinq-test
          python -m pip install --disable-pip-version-check -q -r bank_api/requirements.txt
          (cd bank_api && python -m unittest discover -s tests -p 'test_*.py')
          python -m py_compile bank_api/app_implant.py bank_api/app_implant_patient.py
          test -f drlinq-test/implant-intake.html
          test -f drlinq-test/implant-doctor.html
          test -f drlinq-test/implant-case.html
          test -f drlinq-test/implant-intake-secure.js
          test -f drlinq-test/implant-doctor-patient.js
          grep -q 'پرونده شما ثبت شد' drlinq-test/implant-intake.html
          grep -q 'پرونده‌های ایمپلنت' drlinq-test/implant-doctor.html
          grep -q 'پیگیری پرونده ایمپلنت' drlinq-test/implant-case.html

      - name: Create ephemeral E2E doctor code
        id: e2e-code
        shell: bash
        run: |
          code="$(openssl rand -hex 24)"
          hash="$(printf '%s' "$code" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Prepare deployment archive
        run: tar --exclude=drlinq-test/node_modules -czf /tmp/drlinq-implant-test.tgz drlinq-test bank_api

      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Deploy isolated Implant Intake containers
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
          E2E_CODE_HASH: ${{ steps.e2e-code.outputs.hash }}
        run: |
          : "${VPS_PORT:=22}"
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e scp -P "$VPS_PORT" /tmp/drlinq-implant-test.tgz "$VPS_USER@$VPS_HOST:/tmp/drlinq-implant-test.tgz"
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$GITHUB_SHA' '$E2E_CODE_HASH'" <<'REMOTE'
          set -euo pipefail

          release_sha="$1"
          e2e_code_hash="$2"
          release_id="${release_sha:0:12}"
          test_root=/opt/drlinq/implant-test
          release_root="$test_root/releases/$release_id"
          data_root="$test_root/data"
          env_file="$test_root/implant.env"
          caddy_file=/opt/drlinq/Caddyfile
          caddy_backup="$test_root/caddy/Caddyfile.$release_id.before"
          api_name=drlinq-implant-api-test
          web_name=drlinq-marketplace-test
          implant_db=drlinq_implant_test
          implant_user=drlinq_implant_test
          doctor_code_hash=f39124f22b990deb74aac2772b543d65d8c1ef1b38d3c5d7ec271450cbd2b57a
          backup_suffix="backup-$(date +%s)"
          api_backup="${api_name}-${backup_suffix}"
          web_backup="${web_name}-${backup_suffix}"

          case "$release_id$e2e_code_hash" in
            *[!A-Za-z0-9]*) echo "Unexpected release or E2E hash" >&2; exit 1 ;;
          esac
          mkdir -p "$release_root" "$data_root/uploads" "$test_root/caddy"
          chmod 700 "$data_root" "$data_root/uploads"
          tar -xzf /tmp/drlinq-implant-test.tgz -C "$release_root"

          live_root_hash_before="$(curl -fsSL --max-time 30 https://drlinq.ir/ | sha256sum | awk '{print $1}')"
          curl -fsSL --max-time 30 https://n8n.drlinq.ir/ >/dev/null

          get_container_env() {
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$1" \
              | sed -n "s/^$2=//p" | head -n 1
          }
          db_admin="$(get_container_env drlinq-postgres POSTGRES_USER)"
          admin_db="$(get_container_env drlinq-postgres POSTGRES_DB)"
          : "${db_admin:=postgres}"
          : "${admin_db:=postgres}"
          case "$db_admin$admin_db" in
            *[!A-Za-z0-9_.-]*) echo "Unexpected PostgreSQL identifier" >&2; exit 1 ;;
          esac

          db_password=""
          session_secret=""
          if [ -f "$env_file" ]; then
            db_password="$(sed -n 's/^DB_PASSWORD=//p' "$env_file" | head -n 1)"
            session_secret="$(sed -n 's/^DOCTOR_SESSION_SECRET=//p' "$env_file" | head -n 1)"
          fi
          : "${db_password:=$(openssl rand -hex 32)}"
          : "${session_secret:=$(openssl rand -hex 48)}"
          case "$db_password$session_secret" in
            *[!A-Fa-f0-9]*) echo "Unexpected generated credential" >&2; exit 1 ;;
          esac
          umask 077
          {
            printf 'DB_HOST=postgres\n'
            printf 'DB_PORT=5432\n'
            printf 'DB_NAME=%s\n' "$implant_db"
            printf 'DB_USER=%s\n' "$implant_user"
            printf 'DB_PASSWORD=%s\n' "$db_password"
            printf 'IMPLANT_UPLOAD_ROOT=/data/uploads\n'
            printf 'DOCTOR_SESSION_SECRET=%s\n' "$session_secret"
            printf 'DOCTOR_LOGIN_CODE_HASH=%s\n' "$doctor_code_hash"
            printf 'E2E_DOCTOR_LOGIN_CODE_HASH=%s\n' "$e2e_code_hash"
            printf 'PYTHONDONTWRITEBYTECODE=1\n'
          } > "$env_file"
          chmod 600 "$env_file"

          docker exec -i drlinq-postgres psql -v ON_ERROR_STOP=1 -U "$db_admin" -d "$admin_db" <<SQL
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='$implant_user') THEN
              CREATE ROLE $implant_user LOGIN;
            END IF;
          END
          \$\$;
          ALTER ROLE $implant_user NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION;
          ALTER ROLE $implant_user PASSWORD '$db_password';
          SQL
          if [ "$(docker exec drlinq-postgres psql -U "$db_admin" -d "$admin_db" -tAc "SELECT 1 FROM pg_database WHERE datname='$implant_db'")" != "1" ]; then
            docker exec drlinq-postgres createdb -U "$db_admin" -O "$implant_user" "$implant_db"
          fi
          docker exec drlinq-postgres psql -v ON_ERROR_STOP=1 -U "$db_admin" -d "$admin_db" \
            -c "REVOKE CONNECT ON DATABASE $implant_db FROM PUBLIC; GRANT CONNECT ON DATABASE $implant_db TO $implant_user;" >/dev/null

          api_image="drlinq-implant-api-test:$release_id"
          web_image="drlinq-marketplace-test:$release_id"
          docker build -t "$api_image" -f "$release_root/bank_api/Containerfile.implant-test" "$release_root/bank_api"
          docker build -t "$web_image" -f "$release_root/drlinq-test/Containerfile" "$release_root/drlinq-test"

          had_api=0
          had_web=0
          restore_previous() {
            set +e
            docker rm -f "$api_name" "$web_name" >/dev/null 2>&1
            if [ "$had_api" = 1 ]; then docker rename "$api_backup" "$api_name"; docker start "$api_name" >/dev/null; fi
            if [ "$had_web" = 1 ]; then docker rename "$web_backup" "$web_name"; docker start "$web_name" >/dev/null; fi
            if [ -f "$caddy_backup" ]; then
              cp "$caddy_backup" "$caddy_file"
              docker exec drlinq-caddy caddy reload --config /etc/caddy/Caddyfile >/dev/null 2>&1
            fi
          }
          trap restore_previous ERR

          if docker container inspect "$api_name" >/dev/null 2>&1; then
            had_api=1
            docker stop "$api_name" >/dev/null
            docker rename "$api_name" "$api_backup"
          fi
          if docker container inspect "$web_name" >/dev/null 2>&1; then
            had_web=1
            docker stop "$web_name" >/dev/null
            docker rename "$web_name" "$web_backup"
          fi

          docker run -d --name "$api_name" --restart unless-stopped \
            --network drlinq-internal --env-file "$env_file" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount "type=bind,src=$data_root,dst=/data" \
            --security-opt no-new-privileges --cap-drop ALL \
            "$api_image" >/dev/null
          docker run -d --name "$web_name" --restart unless-stopped \
            --network drlinq-internal \
            --security-opt no-new-privileges \
            "$web_image" >/dev/null

          for attempt in $(seq 1 45); do
            if docker exec "$api_name" python -c \
              "import requests; d=requests.get('http://127.0.0.1:8000/health',timeout=3).json(); assert d['ok'] and d['persistent']" \
              >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$api_name" python -c \
            "import requests; d=requests.get('http://127.0.0.1:8000/health',timeout=5).json(); assert d['ok'] and d['persistent']"
          docker exec "$web_name" wget -qO- http://127.0.0.1/health.json >/dev/null

          cp "$caddy_file" "$caddy_backup"
          python3 - "$caddy_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          begin = "# BEGIN DRLINQ MARKETPLACE TEST"
          block = """  # BEGIN DRLINQ MARKETPLACE TEST
            handle_path /drlinq-test/implant-api/* {
              request_body {
                max_size 55MB
              }
              reverse_proxy drlinq-implant-api-test:8000
            }
            handle_path /drlinq-test/api/* {
              reverse_proxy drlinq-bank-api-test:8000
            }
            handle_path /drlinq-test/* {
              reverse_proxy drlinq-marketplace-test:80
            }
            handle {
              reverse_proxy n8n:5678
            }
            # END DRLINQ MARKETPLACE TEST"""

          if begin in text:
              pattern = re.compile(r"(?ms)^\s*# BEGIN DRLINQ MARKETPLACE TEST.*?^\s*# END DRLINQ MARKETPLACE TEST\s*$")
              updated, count = pattern.subn(block, text, count=1)
              if count != 1:
                  raise SystemExit("existing test route block could not be replaced")
          else:
              pattern = re.compile(r"(?m)^\s*reverse_proxy\s+n8n:5678\s*$")
              updated, count = pattern.subn(block, text, count=1)
              if count != 1:
                  raise SystemExit("n8n fallback proxy was not found")
          path.write_text(updated, encoding="utf-8")
          PY

          docker exec drlinq-caddy caddy validate --config /etc/caddy/Caddyfile >/dev/null
          docker exec drlinq-caddy caddy reload --config /etc/caddy/Caddyfile >/dev/null

          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 15 https://n8n.drlinq.ir/drlinq-test/health.json >/dev/null \
              && curl -fsS --max-time 15 https://n8n.drlinq.ir/drlinq-test/implant-api/health \
                | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['persistent']" \
              && curl -fsS --max-time 15 https://n8n.drlinq.ir/drlinq-test/implant-intake.html | grep -q 'پرونده شما ثبت شد' \
              && curl -fsS --max-time 15 https://n8n.drlinq.ir/drlinq-test/implant-doctor.html | grep -q 'پرونده‌های ایمپلنت' \
              && curl -fsS --max-time 15 https://n8n.drlinq.ir/drlinq-test/implant-case.html | grep -q 'پیگیری پرونده ایمپلنت'; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsSL --max-time 30 https://n8n.drlinq.ir/ >/dev/null
          live_root_hash_after="$(curl -fsSL --max-time 30 https://drlinq.ir/ | sha256sum | awk '{print $1}')"
          test "$live_root_hash_before" = "$live_root_hash_after"

          trap - ERR
          if [ "$had_api" = 1 ]; then docker rm -f "$api_backup" >/dev/null; fi
          if [ "$had_web" = 1 ]; then docker rm -f "$web_backup" >/dev/null; fi
          REMOTE

      - name: Install Chromium for browser E2E
        run: (cd drlinq-test && npx playwright install --with-deps chromium)

      - name: Run mobile patient to doctor to secure patient E2E
        id: browser-e2e
        env:
          DRLINQ_TEST_BASE: ${{ env.TEST_BASE }}
          DRLINQ_E2E_DOCTOR_CODE: ${{ steps.e2e-code.outputs.code }}
        run: |
          result="$(node drlinq-test/tests/implant-e2e.mjs)"
          echo "$result"
          json="$(printf '%s\n' "$result" | tail -n 1)"
          case_id="$(printf '%s' "$json" | python -c 'import json,sys; print(json.load(sys.stdin)["case_id"])')"
          patient_secure_url="$(printf '%s' "$json" | python -c 'import json,sys; print(json.load(sys.stdin)["patient_secure_url"])')"
          echo "case_id=$case_id" >> "$GITHUB_OUTPUT"
          echo "patient_secure_url=$patient_secure_url" >> "$GITHUB_OUTPUT"

      - name: Remove ephemeral login and verify restart persistence
        if: always() && steps.deploy.outcome == 'success'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_NEW_ROOT_PASSWORD }}
          CASE_ID: ${{ steps.browser-e2e.outputs.case_id }}
          PATIENT_SECURE_URL: ${{ steps.browser-e2e.outputs.patient_secure_url }}
        run: |
          : "${VPS_PORT:=22}"
          sshpass -e ssh -o ConnectTimeout=20 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$CASE_ID'" <<'REMOTE'
          set -euo pipefail
          env_file=/opt/drlinq/implant-test/implant.env
          data_root=/opt/drlinq/implant-test/data
          sed -i '/^E2E_DOCTOR_LOGIN_CODE_HASH=/d' "$env_file"
          api_image="$(docker inspect -f '{{.Config.Image}}' drlinq-implant-api-test)"
          docker rm -f drlinq-implant-api-test >/dev/null
          docker run -d --name drlinq-implant-api-test --restart unless-stopped \
            --network drlinq-internal --env-file "$env_file" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount "type=bind,src=$data_root,dst=/data" \
            --security-opt no-new-privileges --cap-drop ALL \
            "$api_image" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec drlinq-implant-api-test python -c \
              "import requests; assert requests.get('http://127.0.0.1:8000/health',timeout=3).json()['ok']" \
              >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec drlinq-implant-api-test python -c \
            "import requests; assert requests.get('http://127.0.0.1:8000/health',timeout=5).json()['ok']"
          if [ -n "$1" ]; then
            docker exec -i drlinq-implant-api-test python - "$1" <<'PY'
          import os
          import sys
          import psycopg

          case_id = sys.argv[1]
          dsn = " ".join([
              f"host={os.environ['DB_HOST']}", f"port={os.environ['DB_PORT']}",
              f"dbname={os.environ['DB_NAME']}", f"user={os.environ['DB_USER']}",
              f"password={os.environ['DB_PASSWORD']}",
          ])
          with psycopg.connect(dsn) as conn:
              row = conn.execute(
                  """SELECT c.status, c.doctor_note, c.patient_response_published,
                            c.more_info_required_published, c.more_info_message_published,
                            c.response_published_at, c.patient_access_token_hash,
                            (SELECT count(*) FROM implant_case_files f WHERE f.case_id=c.id) AS file_count
                     FROM implant_cases c WHERE c.case_code=%s""",
                  (case_id,),
              ).fetchone()
          assert row and row[0] == "needs_more_info" and row[1].startswith("یادداشت تست پایدار")
          assert row[2].startswith("پاسخ تست بیمار") and row[3] is True
          assert row[4].startswith("درخواست اطلاعات تست") and row[5] is not None
          assert row[6] and len(row[6]) == 64 and row[7] == 2
          print(f"restart database persistence: PASS ({case_id})")
          PY
          fi
          REMOTE

          python - <<'PY'
          import json
          import os
          from urllib.parse import parse_qs, quote, urlparse
          import requests

          secure_url = os.environ.get("PATIENT_SECURE_URL", "")
          case_id = os.environ.get("CASE_ID", "")
          assert secure_url and case_id
          parsed = urlparse(secure_url)
          params = parse_qs(parsed.fragment)
          assert params.get("case", [""])[0] == case_id
          token = params.get("token", [""])[0]
          assert len(token) >= 40
          api = f"{os.environ['TEST_BASE']}/implant-api/patient/cases/{quote(case_id)}?token={quote(token)}"
          response = requests.get(api, timeout=20)
          response.raise_for_status()
          data = response.json()
          assert data["case_id"] == case_id
          assert data["patient_response"].startswith("پاسخ تست بیمار")
          assert data["more_info_required"] is True
          assert data["more_info_message"].startswith("درخواست اطلاعات تست")
          assert data["response_published_at"]
          assert "doctor_note" not in data and "patient_name" not in data and "mobile" not in data
          print(f"restart secure patient API persistence: PASS ({case_id})")
          PY
