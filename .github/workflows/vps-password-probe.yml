name: VPS Password Prompt Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-password-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect
      - name: Probe first forced password prompt
        id: probe
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          OLD_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          cat > /tmp/probe.exp <<'EXP'
          log_user 0
          set timeout 25
          set host $env(VPS_HOST)
          set user $env(VPS_USER)
          set port $env(VPS_PORT)
          set old $env(OLD_PASSWORD)
          proc writefile {p v} { set f [open $p w]; puts $f $v; close $f }
          writefile "/tmp/probe_stage.txt" "connect"
          spawn ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p $port $user@$host
          expect {
            -re "(?i)password:" { send -- "$old\r" }
            timeout { writefile "/tmp/probe_result.txt" "login_timeout"; exit 11 }
            eof { writefile "/tmp/probe_result.txt" "login_eof"; exit 12 }
          }
          writefile "/tmp/probe_stage.txt" "post_login"
          expect {
            -re "(?i)current.*password:" { writefile "/tmp/probe_result.txt" "current_password"; exit 0 }
            -re "(?i)new.*password:" { writefile "/tmp/probe_result.txt" "new_password"; exit 0 }
            -re "(?i)retype.*password:" { writefile "/tmp/probe_result.txt" "retype_password"; exit 0 }
            -re {[#>$] $} { writefile "/tmp/probe_result.txt" "shell_prompt"; exit 0 }
            timeout { writefile "/tmp/probe_result.txt" "post_login_timeout"; exit 13 }
            eof { writefile "/tmp/probe_result.txt" "post_login_eof"; exit 14 }
          }
          EXP
          set +e
          expect /tmp/probe.exp
          echo $? > /tmp/probe_code.txt
          exit 0
      - name: Write result
        run: |
          python3 - <<'PY'
          import pathlib, json, datetime
          def read(p):
              x=pathlib.Path(p)
              return x.read_text().strip() if x.exists() else ''
          data={
            'first_prompt': read('/tmp/probe_result.txt'),
            'stage': read('/tmp/probe_stage.txt'),
            'exit_code': read('/tmp/probe_code.txt'),
            'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('vps-password-probe-result.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vps-password-probe-result.json
          git commit -m "Record VPS password prompt probe" || exit 0
          git push
