name: DrLinq adaptive assistant smoke
on:
  push:
    paths:
      - '.github/workflows/assistant-pro-smoke.yml'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test adaptive assistant
        run: |
          set -euo pipefail
          BASE='https://python-0jatcc.cldv.dev/alanoffer/api/assistant'
          curl -fsSL --retry 5 --retry-delay 3 "$BASE/health" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert d.get('ok') is True and d.get('version')=='0.1.0', d
          PY
          curl -fsSL "$BASE/c/demo-implant" -o /tmp/demo.json
          curl -fsSL -X POST "$BASE/c/demo-implant/message" -H 'Content-Type: application/json' --data '{"text":"کاشت دندان چنده؟"}' -o /tmp/memory.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/memory.json',encoding='utf-8'))
          assert d.get('ok') and d.get('source')=='clinic_memory', d
          PY
          curl -fsSL -X POST "$BASE/c/demo-implant/message" -H 'Content-Type: application/json' --data '{"text":"میخوام نوبت بگیرم"}' -o /tmp/intake.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/intake.json',encoding='utf-8'))
          assert d.get('ok') and d.get('source')=='intake' and d.get('options'), d
          PY
          curl -fsSL -X POST "$BASE/clinics/register" -H 'Content-Type: application/json' --data '{"name":"مرکز تست دستیار","category":"مطب تخصصی","specialty":"implant","city":"اهواز","services":["ایمپلنت"]}' -o /tmp/reg.json
          CID=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['clinicId'])")
          TOK=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['accessToken'])")
          SLUG=$(python -c "import json;print(json.load(open('/tmp/reg.json'))['slug'])")
          curl -fsSL -X POST "$BASE/c/$SLUG/message" -H 'Content-Type: application/json' --data '{"text":"سفید کردن دندان چقدر طول میکشه؟"}' -o /tmp/unknown.json
          IID=$(python -c "import json;print(json.load(open('/tmp/unknown.json'))['inquiryId'])")
          curl -fsSL -X POST "$BASE/clinics/$CID/inquiries/$IID/answer?token=$TOK" -H 'Content-Type: application/json' --data '{"answer":"زمان این خدمت پس از بررسی شرایط بیمار توسط مرکز اعلام می‌شود."}' -o /tmp/teach.json
          curl -fsSL -X POST "$BASE/c/$SLUG/message" -H 'Content-Type: application/json' --data '{"text":"برای سفید کردن دندان چقدر زمان لازمه؟"}' -o /tmp/reuse.json
          python - <<'PY'
          import json
          u=json.load(open('/tmp/unknown.json',encoding='utf-8'))
          t=json.load(open('/tmp/teach.json',encoding='utf-8'))
          r=json.load(open('/tmp/reuse.json',encoding='utf-8'))
          assert u.get('needsHuman') is True, u
          assert t.get('learned') is True, t
          assert r.get('source')=='clinic_memory' and r.get('learned') is True, r
          out={'ok':True,'backend_version':'0.1.0','adaptive_intake':True,'clinic_memory':True,'human_teach_once':True,'semantic_reuse':True}
          json.dump(out,open('assistant-pro-smoke-result.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Save sanitized result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assistant-pro-smoke-result.json
          git commit -m 'Record adaptive assistant smoke result'
          git push
