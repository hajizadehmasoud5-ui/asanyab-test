<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دکترلینک | عملیات</title>
<style>
:root{--p:#1565c0;--bg:#f5f7f9;--line:#e4e7eb;--mut:#6f7782;--ok:#18794e;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#171717}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-weight:900;font-size:21px}.brand b{color:var(--p)}button,input,textarea,select{font:inherit}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}.login{display:grid;grid-template-columns:1fr auto;gap:8px}.login input,.field input,.field textarea{width:100%;border:1px solid #d9dde3;border-radius:11px;padding:10px;outline:0}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--p);color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:#222;border:1px solid #d9dde3}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.small{font-size:10px;color:var(--mut);line-height:1.7}.meta{font-size:11px;color:var(--mut);line-height:1.9}.title{font-size:15px;font-weight:900;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:#f1f5f9;border-radius:999px;padding:6px 9px;font-size:10px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.msg{white-space:pre-wrap;background:#f7f9fc;border:1px solid #e5eaf0;padding:10px;border-radius:12px;font-size:11px;line-height:1.8;margin-top:8px}.provider{padding:9px;border-top:1px solid #eee;font-size:11px}.provider:first-child{border-top:0}.field{display:grid;gap:5px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}@media(max-width:650px){.grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand">دکتر<b>لینک</b> — عملیات</div><button class="btn ghost" id="refresh">↻ بروزرسانی</button></div>
<div class="panel" id="loginBox"><div class="small">توکن مدیریت فقط در همین مرورگر نگه داشته می‌شود.</div><div class="login"><input id="token" type="password" placeholder="DRLINQ_ADMIN_TOKEN"><button class="btn" id="login">ورود</button></div></div>
<div id="summary" class="small"></div><div id="list"></div>
</div>
<script>
(()=>{'use strict';
const API='https://python-0jatcc.cldv.dev/alanoffer';const $=x=>document.getElementById(x);let token=sessionStorage.getItem('drlinq_admin')||'';
const labels={needs_provider_search:'نیاز به جستجو',outreach:'ارسال به درمانگر',provider_interested:'درمانگر علاقه‌مند',offered:'پیشنهاد آماده',completed:'تکمیل شده',closed_no_match:'بدون گزینه',cancelled:'لغو شده'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','X-Admin-Token':token,...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'خطا');return d}
function copy(text){navigator.clipboard.writeText(text).then(()=>alert('کپی شد')).catch(()=>prompt('کپی کن:',text))}
function waLink(n){const x=String(n||'').replace(/\D/g,'');return x?`https://wa.me/${x.startsWith('0')?'98'+x.slice(1):x}`:''}
function providerHtml(r,p){return `<div class="provider"><b>${esc(p.name)}</b> — ${esc(p.status)}<br>${p.whatsapp?`واتساپ: ${esc(p.whatsapp)} `:''}${p.instagram?`اینستاگرام: @${esc(p.instagram)}`:''}<div class="row"><button class="btn ghost" onclick="window.pstat('${r.id}','${p.provider_id}','contacted')">پیام دادم</button><button class="btn ok" onclick="window.pstat('${r.id}','${p.provider_id}','interested')">قبول کرد</button><button class="btn bad" onclick="window.pstat('${r.id}','${p.provider_id}','rejected')">رد کرد</button><button class="btn ghost" onclick="window.pstat('${r.id}','${p.provider_id}','no_reply')">جواب نداد</button></div></div>`}
function card(r){const p=r.payload||{};const c=p.contact||'';return `<div class="card"><div class="title">${esc(p.service||'درخواست')} — ${esc(p.city||'')}</div><div class="meta">وضعیت: <b>${esc(labels[r.status]||r.status)}</b><br>اولویت: ${esc(p.priorities||'-')} | حجم: ${esc(p.case_size||'-')} | مهلت: ${esc(p.wait||'-')}<br>تماس بیمار: ${esc(c)}<br>کد: ${esc(r.id)}</div><div class="chips"><span class="chip">${esc(p.city||'')}</span><span class="chip">${esc(p.service||'')}</span><span class="chip">${esc(p.priorities||'')}</span></div><div class="msg">${esc(r.outreachText||'')}</div><div class="row"><button class="btn" onclick="window.copyMsg('${r.id}')">کپی پیام درمانگر</button>${c?`<button class="btn ghost" onclick="window.open('${waLink(c)}','_blank')">واتساپ بیمار</button>`:''}<button class="btn ghost" onclick="window.rstat('${r.id}','closed_no_match')">گزینه پیدا نشد</button><button class="btn ok" onclick="window.rstat('${r.id}','completed')">تکمیل شد</button></div><div class="field"><b>افزودن درمانگر برای همین درخواست</b><div class="grid"><input id="n_${r.id}" placeholder="نام درمانگر/مرکز"><input id="w_${r.id}" placeholder="شماره واتساپ"><input id="i_${r.id}" placeholder="آیدی اینستاگرام"><input id="s_${r.id}" placeholder="منبع؛ مثلا اینستاگرام"></div><button class="btn ghost" onclick="window.addProvider('${r.id}')">+ افزودن به بانک و این درخواست</button></div><div>${(r.providers||[]).map(x=>providerHtml(r,x)).join('')}</div></div>`}
let rows=[];
async function load(){if(!token)return;$('list').innerHTML='<div class="small">در حال بارگذاری...</div>';try{const d=await req('/api/admin/requests');rows=d.requests||[];$('summary').textContent=`${rows.length} درخواست اخیر`;$('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="panel">هنوز درخواستی ثبت نشده.</div>';$('loginBox').style.display='none'}catch(e){$('list').innerHTML=`<div class="panel">خطا: ${esc(e.message)}</div>`;$('loginBox').style.display='block'}}
window.copyMsg=id=>{const r=rows.find(x=>x.id===id);if(r)copy(r.outreachText||'')};
window.rstat=async(id,status)=>{await req(`/api/admin/requests/${id}/status`,{method:'POST',body:JSON.stringify({status})});load()};
window.addProvider=async id=>{const b={name:$(`n_${id}`).value.trim(),whatsapp:$(`w_${id}`).value.trim(),instagram:$(`i_${id}`).value.trim(),source:$(`s_${id}`).value.trim()};if(!b.name||(!b.whatsapp&&!b.instagram)){alert('نام و حداقل یک راه ارتباطی لازم است');return}await req(`/api/admin/requests/${id}/providers`,{method:'POST',body:JSON.stringify(b)});load()};
window.pstat=async(rid,pid,status)=>{await req(`/api/admin/requests/${rid}/providers/${pid}/status`,{method:'POST',body:JSON.stringify({status})});load()};
$('login').onclick=()=>{token=$('token').value.trim();sessionStorage.setItem('drlinq_admin',token);load()};$('refresh').onclick=load;if(token){$('token').value=token;load()}
})();
</script></body></html>
