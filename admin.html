<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlanOffer | مدیریت کسب‌وکارها</title><style>body{margin:0;background:#f6f7f8;font-family:Tahoma,Arial,sans-serif;color:#171717}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;font-size:19px}.brand b{color:#ff6a00}.back{background:#111;color:#fff;text-decoration:none;padding:9px 11px;border-radius:11px;font-size:11px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:19px;padding:15px;margin-bottom:12px}input,button{font:inherit;width:100%;min-height:45px;border-radius:11px}input{border:1px solid #ddd;padding:0 10px}button{border:0;background:#ff6a00;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#111}.reject{background:#eee;color:#333}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{display:grid;gap:9px}.item{border:1px solid #e8e8e8;border-radius:15px;padding:12px}.item h3{margin:0 0 7px;font-size:16px}.meta{font-size:10px;color:#666;line-height:1.9}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.state{font-size:11px;padding:9px;background:#f4f4f4;border-radius:11px;margin-top:8px}.empty{font-size:11px;color:#777;text-align:center;padding:20px}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">الان<b>آفر</b> · مدیریت</div><a class="back" href="index.html">سایت</a></div><div class="card"><div class="grid"><input id="token" type="password" placeholder="Admin Token"><button onclick="loadPending()">بارگذاری ثبت‌های منتظر</button></div><div id="statusBox" class="state">برای مدیریت، ابتدا بک‌اند باید در صفحه دیتابیس تنظیم شده باشد.</div></div><div class="card"><b>ثبت‌های در انتظار بررسی</b><div id="list" class="list" style="margin-top:10px"></div></div></div><script src="api-client.js"></script><script src="business-categories.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function loadPending(){if(!AlanApi.configured()){statusBox.textContent='دیتابیس مشترک تنظیم نشده است.';return}const t=token.value.trim();if(!t){statusBox.textContent='Admin Token را وارد کن.';return}statusBox.textContent='در حال دریافت…';try{const r=await AlanApi.pending(t);statusBox.textContent=`${(r.count||0).toLocaleString('fa-IR')} ثبت منتظر بررسی`;list.innerHTML=(r.items||[]).length?(r.items||[]).map(x=>`<div class="item"><h3>${esc(x.name)}</h3><div class="meta">${esc(AlanBiz.topLabel(x.top))} · ${esc(AlanBiz.subLabel(x.top,x.sub))}<br>📍 ${esc(x.area)} · ${esc(x.address)}${x.phone?`<br>☎ ${esc(x.phone)}`:''}<br>مختصات: ${x.lat}, ${x.lng}</div><div class="actions"><button onclick="review('${x.id}','approve')">تأیید و انتشار</button><button class="reject" onclick="review('${x.id}','reject')">رد</button></div></div>`).join(''):'<div class="empty">ثبت منتظری وجود ندارد.</div>'}catch(e){statusBox.textContent=e.status===401?'توکن مدیر نادرست است.':'اتصال به سرور انجام نشد.'}}async function review(id,action){try{await AlanApi.review(id,action,token.value.trim());await loadPending()}catch(e){alert('عملیات انجام نشد.')}}</script></body></html>
