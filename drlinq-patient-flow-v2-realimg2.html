<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دکترلینک | فرم جامع بیمار با تصاویر واقعی</title><style>html,body{margin:0;background:#fff}.loading{font-family:Tahoma,Arial,sans-serif;padding:40px;text-align:center;color:#555}</style></head><body><div class="loading">در حال بارگذاری دکترلینک…</div><script>(async function(){const OPG='https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Panoramicfilm.JPG/330px-Panoramicfilm.JPG';const CBCT='https://upload.wikimedia.org/wikipedia/commons/d/d8/DVT-scan-MagoCut-bild4-dvtreconstructed.jpg';let html=await fetch('drlinq-patient-flow-v2.html?v='+Date.now(),{cache:'no-store'}).then(r=>r.text());const css='<style>.doc{grid-template-columns:150px 1fr!important}.thumb{height:96px!important;background:#05080b!important}.thumb img.real-medical{width:100%;height:100%;object-fit:cover;display:block;background:#05080b}.doc[data-real="cbct"] .thumb{height:120px!important}@media(max-width:520px){.doc{grid-template-columns:135px 1fr!important}.thumb{height:88px!important}.doc[data-real="cbct"] .thumb{height:105px!important}}</style>';const patch=`<script>(function(){var urls={OPG:'${OPG}',CBCT:'${CBCT}'};function patch(){var cards=document.querySelectorAll('.doc');for(var i=0;i<cards.length;i++){var b=cards[i].querySelector('b'),th=cards[i].querySelector('.thumb');if(!b||!th)continue;var n=b.textContent.trim();if((n==='OPG'||n==='CBCT')&&th.getAttribute('data-real')!=='1'){th.innerHTML='<img class="real-medical" src="'+urls[n]+'" alt="نمونه واقعی '+n+'">';th.setAttribute('data-real','1');cards[i].setAttribute('data-real',n.toLowerCase());}}}new MutationObserver(patch).observe(document.body,{childList:true,subtree:true});setInterval(patch,300);patch();})();<\/script>`;html=html.replace('</head>',css+'</head>').replace('</body>',patch+'</body>');document.open();document.write(html);document.close();})();</script></body></html>
